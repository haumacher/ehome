# The Debian package of E-Home (doc/debian.md): builds and tests the app without the development
# tooling, builds the war of the profile "debian" and packages it with bin/build-deb.sh. Every push to
# master leaves the package as an artifact of the run; a tag vX.Y.Z also publishes it as a release.
name: Debian package

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The version of a package between tags names the commit.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The resource bundles are committed: no machine translation (it needs a DeepL key) in CI.
      - name: Build and test the app
        run: ./mvnw -B -Pproduction,debian -DskipTests=false -Dtl.javadoc.skipTranslate=true install

      - name: Build the package
        id: deb
        run: echo "file=$(bin/build-deb.sh | tail -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ehome-deb
          path: ${{ steps.deb.outputs.file }}
          retention-days: 30

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.deb.outputs.file }}" --title "E-Home ${GITHUB_REF_NAME#v}" --generate-notes
