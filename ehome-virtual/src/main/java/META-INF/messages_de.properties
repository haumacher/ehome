class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_ALREADY_RUNNING__NAME_ENDPOINT = Es läuft bereits eine virtuelle Schnittstelle: {0} auf {1}. Bitte zuerst anhalten.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_COUPLER_ADDRESS__ADDRESS = Das Gerät {0} hat die Adresse eines Bereichskopplers, eine virtuelle Schnittstelle kann es nicht bedienen.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_INVALID_PORT__PORT = {0} ist kein UDP-Port, ein Port ist eine Zahl von 1 bis 65535.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_NOT_RUNNING = Es läuft keine virtuelle Schnittstelle.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_NO_ADDRESS = Das Gerät hat keine vollständige physikalische Adresse.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_NO_DEVICE = Es ist kein Gerät ausgewählt.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_NO_LOCAL_ADDRESS = Bitte die lokale Adresse wählen, auf der die virtuelle Schnittstelle wartet.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_NO_MASK = Das Applikationsprogramm des Geräts nennt keine Maskenversion.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_NO_PROGRAM = Das Gerät hat kein Applikationsprogramm.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_NO_TRACE__NAME = Die Aufzeichnung {0} gibt es nicht mehr.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_TRACE_FILE__DETAIL = Die Datei der Aufzeichnung konnte nicht angelegt werden: {0}
class.de.haumacher.ehome.virtual.tooling.I18NConstants.STATUS_ADDRESS_CHANGED__ADDRESS_PROJECT = Ein Programmierwerkzeug hat die Adresse {0} geschrieben: Das Gerät antwortet dort auf dem virtuellen Bus, bis das virtuelle Gerät angehalten wird. Das Projekt behält {1}, das virtuelle Gerät ändert das Projekt nicht.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.STATUS_ADDRESS_UNREACHABLE__ADDRESS_COUPLER = Die Schnittstelle (Koppler {1}) leitet keine Telegramme an {0} weiter: Unter seiner neuen Adresse ist das Gerät über sie nicht erreichbar.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.STATUS_PROGRAMMING_MODE__ADDRESS = Der Programmiermodus ist an: Das Gerät {0} beantwortet A_IndividualAddress_Read und übernimmt die Adresse aus A_IndividualAddress_Write. Er endet mit dem nächsten Neustart des Geräts oder einem weiteren Druck auf die Programmiertaste.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.STATUS_RUNNING__NAME_ENDPOINT_DEVICE_SERVICES = Die virtuelle Schnittstelle „{0}“ wartet auf {1} (UDP). Ihr einziges Gerät ist {2}, nichts wird an einen Bus weitergeleitet. Bisher aufgezeichnete Dienste: {3}.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.STATUS_STOPPED = Es läuft keine virtuelle Schnittstelle.
de.haumacher.ehome.virtual.tooling.VirtualFunctions$Builder = Erzeuger
de.haumacher.ehome.virtual.tooling.VirtualFunctions$Builder.tooltip = Erzeuger einer Funktion des virtuellen Geräts: die <i>Funktion</i> mit dem Namen, unter dem sie registriert ist.
de.haumacher.ehome.virtual.tooling.VirtualFunctions$Function = Funktion
de.haumacher.ehome.virtual.tooling.VirtualFunctions$Function.tooltip = Die Funktionen, benannt so, wie sie registriert sind.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualProgramming = Programmiermodus des virtuellen Geräts
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualProgramming.tooltip = <code>virtualProgramming(refresh?)</code>: was der Programmiermodus des laufenden Geräts bedeutet, für eine Person; <code>null</code>, wenn er aus ist oder keine virtuelle Schnittstelle läuft.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualProgrammingButton = Programmiertaste des virtuellen Geräts
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualProgrammingButton.tooltip = <code>virtualProgrammingButton()</code>: drückt die Programmiertaste des laufenden Geräts (Programmiermodus an, oder aus, wenn er an ist); das Ergebnis ist der Status.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualRules = Regeln der Ladezustände
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualRules.tooltip = <code>virtualRules()</code>: die Regeln, nach denen ein Gerät der Maske 0700/0701 seine Ladezustände beantworten kann.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualRunning = Virtuelle Schnittstelle läuft
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualRunning.tooltip = <code>virtualRunning(refresh?)</code>: Gibt an, ob eine virtuelle Schnittstelle läuft.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualStart = Virtuelles Gerät starten
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualStart.tooltip = <code>virtualStart(device, address, port, rule, discovery)</code>: Startet die virtuelle Schnittstelle mit dem simulierten Gerät des Projektgeräts; das Ergebnis ist der Status.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualStartVeto = Einwand gegen den Start
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualStartVeto.tooltip = <code>virtualStartVeto(device, refresh?)</code>: warum für das Gerät jetzt kein virtuelles Gerät gestartet werden kann, <code>null</code>, wenn es geht.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualStatus = Zustand der virtuellen Schnittstelle
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualStatus.tooltip = <code>virtualStatus(refresh?)</code>: was läuft, für einen Menschen; das Argument lässt eine Sicht ihn nur neu berechnen.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualStop = Virtuelles Gerät anhalten
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualStop.tooltip = <code>virtualStop()</code>: Stoppt die virtuelle Schnittstelle; das Ergebnis ist der Status.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualStopVeto = Einwand gegen das Anhalten
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualStopVeto.tooltip = <code>virtualStopVeto(refresh?)</code>: warum es nichts anzuhalten gibt, <code>null</code>, wenn eine virtuelle Schnittstelle läuft.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualTraceFile = Datei einer Aufzeichnung
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualTraceFile.tooltip = <code>virtualTraceFile(name)</code>: die Aufzeichnung des angegebenen Namens als Datei zum Herunterladen.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualTraces = Aufzeichnungen
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualTraces.tooltip = <code>virtualTraces(refresh?)</code>: die Aufzeichnungen, die neueste zuerst, als Zeilen mit <code>name</code>, <code>device</code>, <code>mask</code>, <code>interface</code>, <code>started</code>, <code>services</code>.
de.haumacher.ehome.virtual.tooling.VirtualInterfaces = Virtuelle Schnittstellen
de.haumacher.ehome.virtual.tooling.VirtualInterfaces.Config.directory = Verzeichnis
de.haumacher.ehome.virtual.tooling.VirtualInterfaces.Config.directory.tooltip = Das Verzeichnis der Aufzeichnungen (<code>traces/</code>) und der Dateien des KNXnet/IP-Servers (<code>server/</code>); Aliase wie <code>%STORAGE_PATH%</code> werden ersetzt.
de.haumacher.ehome.virtual.tooling.VirtualInterfaces.tooltip = Der Dienst des virtuellen Geräts in der Anwendung: der eine <i>Verwalter der virtuellen Schnittstelle</i>, seine Aufzeichnungen im Datenverzeichnis der Anwendung, und das Anhalten der virtuellen Schnittstelle, wenn die Anwendung beendet wird. <p> Registriert in <code>WEB-INF/autoconf/ehome.virtual.config.xml</code>. </p>
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule = Regel der Ladezustände im Speicher
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.ECHO = Echo
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.ECHO.tooltip = Der Zustand, den die letzte Ladesteuerung ergibt (der Ladezustandsautomat der KNX-Spezifikation).
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.ERROR = Fehler
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.ERROR.tooltip = Immer „Fehler“.
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.LOADED = Geladen
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.LOADED.tooltip = Immer „geladen“.
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.LOADING = Laden
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.LOADING.tooltip = Immer „laden“.
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.UNLOADED = Nicht geladen
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.UNLOADED.tooltip = Immer „nicht geladen“.
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.tooltip = Wie ein simuliertes Gerät mit Ladezustandsautomaten im Speicher (BIM M112, Masken 0700 und 0701) das Lesen seiner Ladezustände (Speicher B6EA bis B6ED) beantwortet. <p> Was ein solches Gerät nach jeder Ladesteuerung wirklich antwortet, ist nicht bekannt: Aufzeichnungen von ETS gegen das virtuelle Gerät sollen es herausfinden (haumacher/ehome #22). Die Regel ist deshalb eine Wahl, keine Behauptung. </p>
de.haumacher.ehome.virtual.tooling.device.SimulatedDevice$LoadControlKind = Art der Ladesteuerung
de.haumacher.ehome.virtual.tooling.device.SimulatedDevice$LoadControlKind.tooltip = Wie die Ladezustandsautomaten eines Geräts gesteuert werden.
de.haumacher.ehome.virtual.tooling.device.SimulatedDevice.LoadControlKind.MEMORY = Speicher
de.haumacher.ehome.virtual.tooling.device.SimulatedDevice.LoadControlKind.MEMORY.tooltip = Über den Speicher 0104, die Zustände bei B6EA (BIM M112, Masken 0700, 0701).
de.haumacher.ehome.virtual.tooling.device.SimulatedDevice.LoadControlKind.NONE = Keine
de.haumacher.ehome.virtual.tooling.device.SimulatedDevice.LoadControlKind.NONE.tooltip = Keine Ladezustandsautomaten: einfacher Speicher (BCU 1, BCU 2).
de.haumacher.ehome.virtual.tooling.device.SimulatedDevice.LoadControlKind.PROPERTIES = Eigenschaften
de.haumacher.ehome.virtual.tooling.device.SimulatedDevice.LoadControlKind.PROPERTIES.tooltip = Über die Eigenschaft der Ladesteuerung der Schnittstellenobjekte 1 bis 4 (Maske 7.5).
de.haumacher.ehome.virtual.tooling.trace.TraceEntry$Direction = Richtung
de.haumacher.ehome.virtual.tooling.trace.TraceEntry$Direction.tooltip = Woher ein <i>Eintrag einer Aufzeichnung</i> stammt.
de.haumacher.ehome.virtual.tooling.trace.TraceEntry.Direction.EVENT = Ereignis
de.haumacher.ehome.virtual.tooling.trace.TraceEntry.Direction.EVENT.tooltip = Ein Ereignis des Geräts selbst, nichts auf der Leitung: <code>*</code>.
de.haumacher.ehome.virtual.tooling.trace.TraceEntry.Direction.RECEIVED = Empfangen
de.haumacher.ehome.virtual.tooling.trace.TraceEntry.Direction.RECEIVED.tooltip = Vom Gerät empfangen (vom Programmierwerkzeug): <code>&gt;</code>.
de.haumacher.ehome.virtual.tooling.trace.TraceEntry.Direction.SENT = Gesendet
de.haumacher.ehome.virtual.tooling.trace.TraceEntry.Direction.SENT.tooltip = Vom Gerät gesendet: <code>&lt;</code>.
