class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_ALREADY_RUNNING__NAME_ENDPOINT = A virtual interface is running already: {0} on {1}. Stop it first.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_COUPLER_ADDRESS__ADDRESS = The device {0} has the address of an area coupler, a virtual interface cannot serve it.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_INVALID_PORT__PORT = {0} is no UDP port, a port is a number from 1 to 65535.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_NOT_RUNNING = No virtual interface is running.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_NO_ADDRESS = The device has no complete individual address.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_NO_DEVICE = No device is selected.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_NO_LOCAL_ADDRESS = Choose the local address the virtual interface listens on.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_NO_MASK = The application program of the device names no mask version.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_NO_PROGRAM = The device has no application program.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_NO_TRACE__NAME = The trace {0} does not exist any more.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.ERROR_TRACE_FILE__DETAIL = The trace file could not be created: {0}
class.de.haumacher.ehome.virtual.tooling.I18NConstants.STATUS_ADDRESS_CHANGED__ADDRESS_PROJECT = A programming tool wrote the address {0}: the device answers there on the virtual bus until the virtual device is stopped. The project keeps {1}, the virtual device does not change the project.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.STATUS_ADDRESS_UNREACHABLE__ADDRESS_COUPLER = The interface (coupler {1}) does not route frames to {0}: the device cannot be reached through it at its new address.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.STATUS_PROGRAMMING_MODE__ADDRESS = Programming mode is on: the device {0} answers A_IndividualAddress_Read and takes the address of A_IndividualAddress_Write. It ends with the next restart of the device or another press of the programming button.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.STATUS_RUNNING__NAME_ENDPOINT_DEVICE_SERVICES = The virtual interface "{0}" listens on {1} (UDP). Its only device is {2}, nothing is forwarded to a bus. Services recorded so far: {3}.
class.de.haumacher.ehome.virtual.tooling.I18NConstants.STATUS_STOPPED = No virtual interface is running.
de.haumacher.ehome.virtual.tooling.VirtualFunctions$Builder = Builder
de.haumacher.ehome.virtual.tooling.VirtualFunctions$Builder.tooltip = Builder of a <i>virtual functions</i> function: the <i>function</i> named as the function is registered.
de.haumacher.ehome.virtual.tooling.VirtualFunctions$Function = Function
de.haumacher.ehome.virtual.tooling.VirtualFunctions$Function.tooltip = The functions, named as they are registered.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualProgramming = Virtual programming
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualProgramming.tooltip = <code>virtualProgramming(refresh?)</code>: what the programming mode of the running device means, for a person; <code>null</code> if it is off or no virtual interface runs.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualProgrammingButton = Virtual programming button
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualProgrammingButton.tooltip = <code>virtualProgrammingButton()</code>: presses the programming button of the running device (programming mode on, or off if it is on); the result is the status.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualRules = Virtual rules
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualRules.tooltip = <code>virtualRules()</code>: the rules a device of mask 0700/0701 may answer its load states by.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualRunning = Virtual running
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualRunning.tooltip = <code>virtualRunning(refresh?)</code>: whether a virtual interface runs.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualStart = Virtual start
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualStart.tooltip = <code>virtualStart(device, address, port, rule, discovery)</code>: starts the virtual interface with the simulated device of the project device; the result is the status.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualStartVeto = Virtual start veto
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualStartVeto.tooltip = <code>virtualStartVeto(device, refresh?)</code>: why no virtual device can be started for the device now, <code>null</code> if one can.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualStatus = Virtual status
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualStatus.tooltip = <code>virtualStatus(refresh?)</code>: what runs, for a person; the argument only makes a view recompute it.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualStop = Virtual stop
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualStop.tooltip = <code>virtualStop()</code>: stops the virtual interface; the result is the status.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualStopVeto = Virtual stop veto
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualStopVeto.tooltip = <code>virtualStopVeto(refresh?)</code>: why there is nothing to stop, <code>null</code> if a virtual interface runs.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualTraceFile = Virtual trace file
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualTraceFile.tooltip = <code>virtualTraceFile(name)</code>: the trace of the given name as a file to download.
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualTraces = Virtual traces
de.haumacher.ehome.virtual.tooling.VirtualFunctions.Function.virtualTraces.tooltip = <code>virtualTraces(refresh?)</code>: the recorded traces, the newest first, as rows with <code>name</code>, <code>device</code>, <code>mask</code>, <code>interface</code>, <code>started</code>, <code>services</code>.
de.haumacher.ehome.virtual.tooling.VirtualInterfaces = Virtual interfaces
de.haumacher.ehome.virtual.tooling.VirtualInterfaces.Config.directory = Directory
de.haumacher.ehome.virtual.tooling.VirtualInterfaces.Config.directory.tooltip = The directory of the traces (<code>traces/</code>) and of the files of the KNXnet/IP server (<code>server/</code>); aliases such as <code>%STORAGE_PATH%</code> are expanded.
de.haumacher.ehome.virtual.tooling.VirtualInterfaces.tooltip = The service of the virtual device in the application: the one <i>virtual interface manager</i>, its traces in the application's data directory, and the virtual interface stopped when the application shuts down. <p> Registered in <code>WEB-INF/autoconf/ehome.virtual.config.xml</code>. </p>
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule = Mapped load state rule
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.ECHO = Echo
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.ECHO.tooltip = The state the last load control implies (the load state machine of the KNX specification).
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.ERROR = Error
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.ERROR.tooltip = Always "error".
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.LOADED = Loaded
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.LOADED.tooltip = Always "loaded".
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.LOADING = Loading
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.LOADING.tooltip = Always "loading".
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.UNLOADED = Unloaded
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.UNLOADED.tooltip = Always "unloaded".
de.haumacher.ehome.virtual.tooling.device.MappedLoadStateRule.tooltip = How a simulated device with memory-mapped load state machines (BIM M112, masks 0700 and 0701) answers the reads of its load states (memory B6EA to B6ED). <p> What such a device really answers after each load control is not known: ETS's traces against the virtual device are to find it out (haumacher/ehome #22). The rule is therefore a choice, not a claim. </p>
de.haumacher.ehome.virtual.tooling.device.SimulatedDevice$LoadControlKind = Load control kind
de.haumacher.ehome.virtual.tooling.device.SimulatedDevice$LoadControlKind.tooltip = How the load state machines of a device are controlled.
de.haumacher.ehome.virtual.tooling.device.SimulatedDevice.LoadControlKind.MEMORY = Memory
de.haumacher.ehome.virtual.tooling.device.SimulatedDevice.LoadControlKind.MEMORY.tooltip = Through memory 0104, the states at B6EA (BIM M112 masks 0700, 0701).
de.haumacher.ehome.virtual.tooling.device.SimulatedDevice.LoadControlKind.NONE = None
de.haumacher.ehome.virtual.tooling.device.SimulatedDevice.LoadControlKind.NONE.tooltip = No load state machines: plain memory (BCU 1, BCU 2).
de.haumacher.ehome.virtual.tooling.device.SimulatedDevice.LoadControlKind.PROPERTIES = Properties
de.haumacher.ehome.virtual.tooling.device.SimulatedDevice.LoadControlKind.PROPERTIES.tooltip = Through the load state control property of the interface objects 1 to 4 (mask 7.5).
de.haumacher.ehome.virtual.tooling.trace.TraceEntry$Direction = Direction
de.haumacher.ehome.virtual.tooling.trace.TraceEntry$Direction.tooltip = Where a <i>trace entry</i> comes from.
de.haumacher.ehome.virtual.tooling.trace.TraceEntry.Direction.EVENT = Event
de.haumacher.ehome.virtual.tooling.trace.TraceEntry.Direction.EVENT.tooltip = An event of the device itself, nothing on the wire: <code>*</code>.
de.haumacher.ehome.virtual.tooling.trace.TraceEntry.Direction.RECEIVED = Received
de.haumacher.ehome.virtual.tooling.trace.TraceEntry.Direction.RECEIVED.tooltip = Received by the device (from the programming tool): <code>&gt;</code>.
de.haumacher.ehome.virtual.tooling.trace.TraceEntry.Direction.SENT = Sent
de.haumacher.ehome.virtual.tooling.trace.TraceEntry.Direction.SENT.tooltip = Sent by the device: <code>&lt;</code>.
