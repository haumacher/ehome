de.haumacher.ehome.connection.ConnectionFunctions.Function.controllerConnection.tooltip = <code>controllerConnection(controller)</code>: Der Verbindungsstatus des Controllers als Text (<code>Controllers#state(TLObject)</code>).
de.haumacher.ehome.connection.ConnectionFunctions.Function.controllerOnline = Controller online
de.haumacher.ehome.connection.ConnectionFunctions.Function.controllerOnline.tooltip = <code>controllerOnline(controller)</code>: Ob der Controller gerade verbunden ist.
de.haumacher.ehome.connection.ConnectionFunctions.Function.enrollmentCodeState = Status des Anmeldecodes
de.haumacher.ehome.connection.ConnectionFunctions.Function.enrollmentCodeState.tooltip = <code>enrollmentCodeState(project)</code>: Ob das Projekt einen offenen Anmeldecode hat und bis wann er gilt, als Text (ohne den Code); <code>null</code> für keinen (<code>Controllers#codeState(TLObject, Instant)</code>).
de.haumacher.ehome.connection.ConnectionFunctions.Function.forgetConfirmation = Vergiss die Bestätigung
de.haumacher.ehome.connection.ConnectionFunctions.Function.forgetConfirmation.tooltip = <code>forgetConfirmation(controller)</code>: Die Frage, bevor man den Controller vergisst (<code>I18NConstants#CONFIRM_FORGET__CONTROLLER</code>).
de.haumacher.ehome.connection.CreateEnrollmentCodeAction = Aktion „Anmeldecode erzeugen“
de.haumacher.ehome.connection.CreateEnrollmentCodeAction.tooltip = <i>View-Aktion</i>, die einen Anmeldecode für das Eingabeprojekt erzeugt (haumacher/ehome #54, <code>Enrollment#createCode(TLObject, com.top_logic.knowledge.wrap.person.Person, Instant)</code>) und einen offenen ersetzt. <p> Das Ergebnis ist der Satz mit dem Code, seinem Ablauf und den Minuten, die er gilt, für einen Dialog (außer im verborgenen Attribut des Projekts der einzige Ort, an dem der Code erscheint). </p>
de.haumacher.ehome.connection.ForgetControllerAction = Aktion „Controller vergessen“
de.haumacher.ehome.connection.ForgetControllerAction.tooltip = <i>View-Aktion</i>, die den Eingabe-Controller vergisst (<code>ehome.runtime:Controller</code>, haumacher/ehome #54): löscht ihn (<code>Controllers#forget(TLObject)</code>) und schließt seine Verbindung, die ab sofort abgelehnt wird. Eine spätere Anmeldung desselben Geräts ist ein neuer Controller. <p> Das Ergebnis ist der Satz, der das sagt. </p>
de.haumacher.ehome.discover.DiscoverGatewaysAction = Entdecken Sie die „Gateways“-Aktion
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.timeout = Zeitüberschreitung
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.timeout.tooltip = Es dauert nur wenige Sekunden, bis die Antworten vorliegen.
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-multicast = Multicast verwenden
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-multicast.tooltip = Ob die Suchanfrage per Multicast gesendet werden soll.
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-nat = Verwende NAT
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-nat.tooltip = Ob über einen NAT-Router gesucht werden soll.
de.haumacher.ehome.discover.DiscoverGatewaysAction.tooltip = <i>Aktion anzeigen</i>, die die lokalen Netzwerke nach KNXnet/IP-Gateways durchsucht. <p> Als Eingabe wird entweder nichts oder ein Schlüssel-Wert-Paar mit den Sucheinstellungen erwartet: <code>interface</code> (Name der zu durchsuchenden Netzwerkschnittstelle, alle Schnittstellen, wenn leer), <code>local-host</code> (lokale Absenderadresse), <code>use-nat</code> und <code>use-multicast</code>; in dem Schlüssel-Wert-Paar fehlende Einstellungen werden aus der Konfiguration übernommen. Das Ergebnis ist die Liste der Gateways, die geantwortet haben, jeweils ein Schlüsselpaar pro Gateway (ein Gateway, das mehrmals geantwortet hat, wird nur einmal aufgeführt) mit den Schlüsseln <code>name</code>, <code>address</code>, <code>endpoint</code>, <code>mac</code>, <code>serial</code> und <code>medium</code>, die als Zeilen einer Tabelle angezeigt werden sollen. </p>
de.haumacher.ehome.discover.KnxNetworkInterfaces$Builder = Erzeuger
de.haumacher.ehome.discover.KnxNetworkInterfaces$Builder.tooltip = Generator für <i>KNX-Netzwerkschnittstellen</i>.
de.haumacher.ehome.etsImport.ImportEtsProjectAction = ETS-Projektaktion importieren
de.haumacher.ehome.etsImport.ImportEtsProjectAction.tooltip = <i>Aktion</i> zum Importieren der hochgeladenen ETS-Projektdateien (<code>.knxproj</code>). <p> Als Eingabe dient die hochgeladene Datei, eine Sammlung solcher Dateien oder ein Wörterbuch, in dem unter <code>file</code> die hochgeladene Datei und unter <code>password</code> das Projektpasswort steht. Jede Datei wird in einer eigenen Transaktion importiert. Das Ergebnis ist der Bericht über den Import, ein Wörterbuch: <code>project</code> ist das durch den letzten Import erstellte Projekt (für eine nachfolgende <code>&lt;write-channel&gt;</code>), <code>messages</code> die vom Import gemeldeten Warnungen und Fehler (jeweils ein Wörterbuch mit <code>file</code>, <code>severity</code>, <code>level</code> und <code>message</code>) und <code>summary</code> ein Satz, der die importierten Projekte und die Anzahl der Meldungen nennt. Die Meldungen ändern nichts am Ergebnis: Eine Datei, die nicht importiert werden kann, führt zum Fehlschlagen der Aktion. </p> <p> Eine einzelne Datei, deren Projekt durch ein Passwort geschützt ist und die ohne dieses hochgeladen wird, wird nicht importiert: Das Ergebnis ist ein Wörterbuch, bei dem <code>passwordRequired</code> auf <code>true</code> gesetzt ist, die Datei in <code>file</code> und der Grund in <code>message</code> steht, sodass die Ansicht das Passwort abfragen und die Datei erneut importieren kann. Ein falsches Passwort führt zum Fehlschlagen der Aktion mit Angabe des Grundes. </p>
de.haumacher.ehome.etsImport.ImportProductDataAction = Aktion Produktdaten importieren
de.haumacher.ehome.etsImport.ImportProductDataAction.tooltip = <i>Aktion</i> zum Importieren der hochgeladenen Produktdateien der Hersteller (<code>.knxprod</code>) in den Katalog <i>anzeigen</i>. <p> Eingabe ist die hochgeladene Datei oder eine Sammlung solcher Dateien. Jede Datei wird in einer eigenen Transaktion importiert, wobei die Zuordnung des Projektimports (siehe <code>Importer#importProductData</code>) verwendet wird: Die bereits im Katalog vorhandenen Hersteller, Kataloge, Produkte und Anwendungsprogramme werden anhand ihrer IDs wiederverwendet, ein bereits bekanntes Anwendungsprogramm wird übersprungen. Das Ergebnis ist der Importbericht, ein Verzeichnis ähnlich dem der <i>Projektaktion „Import ets</i>“: <code>manufacturer</code> ist der Hersteller der zuletzt importierten Datei, <code>summary</code> ein Satz, der für jede Datei die importierten sowie die bereits bekannten Hersteller, Produkte und Anwendungsprogramme sowie die Anzahl der Meldungen auflistet, <code>messages</code> die vom Import gemeldeten Warnungen und Fehler. Eine Datei, die nicht importiert werden kann (eine Projektdatei, eine Datei mit Ballast oder verschlüsselten Einträgen), führt zum Fehlschlagen der Aktion mit Angabe des Grundes. </p>
