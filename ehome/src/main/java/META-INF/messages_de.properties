de.haumacher.ehome.project.ProjectOwners = Eigentümer der Projekte
de.haumacher.ehome.project.ProjectOwners.tooltip = Das Konto, das ein Projekt anlegt, wird sein Eigentümer (haumacher/ehome #152): Wie auch immer das Projekt angelegt wird (der Dialog „Neues Projekt“, ein ETS-Import, eine Projektdatei, ein Agent über das Modell), der Commit, der es anlegt, nennt den aktuellen Benutzer als Eigentümer, sofern der anlegende Code nicht selbst Eigentümer genannt hat. Ein Projekt, das ohne Benutzer (im Systemkontext) angelegt wird, erhält keinen Eigentümer; Administratoren handeln dafür. <p> Ein <i>ModificationListener</i> der Wissensbasis, registriert in <code>WEB-INF/autoconf/ehome.project.config.xml</code>. </p>
de.haumacher.ehome.projectfile.ExportProjectFileAction = Als Projektdatei exportieren
