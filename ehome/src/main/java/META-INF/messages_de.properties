de.haumacher.ehome.runtime.IdRenames = ID-Umbenennungen
de.haumacher.ehome.runtime.IdRenames.tooltip = Folgt einer umbenannten ID in den Ausdrücken des Projekts (haumacher/ehome #111): Wenn sich die ID eines Regelparameters, eines Timers, eines Zustands oder eines Anwendungsdatenpunkts oder die ID des Datenpunkts einer Gruppenadresse (d. h. deren Bezeichner oder andernfalls deren Adresse, haumacher/ehome #130) ändert, werden die Ausdrücke der Projektregeln, in denen diese ID genannt wird, in derselben Transaktion neu geschrieben (<i>Ausdrucksumbenennung</i>). Ein eingegebener oder geänderter Ausdruck, der eine Gruppenadresse mit einem Bezeichner anhand ihrer Adresse (<code>@"1/2/3"</code>) benennt, wird mit dem Bezeichner (<code>@kueche.licht</code>) geschrieben – dem Namen ihres Datenpunkts im Abbild. <p> Ein <i>Änderungs-Listener</i> der Wissensbasis: Er erkennt jeden Commit, unabhängig davon, welcher Code die ID geändert hat (ein Formular, eine Tabelle, ein Import in Java), vergleicht die ID jedes aktualisierten Objekts mit seinem Wert vor der Transaktion und schreibt die Ausdrücke in der von ihm zurückgegebenen <i>Änderung</i> um, die die Wissensbasis innerhalb des Commits ausführt, noch bevor die Commit-Prüfung stattfindet. Ein von ihnen abgelehnter Commit (eine ID, die den Einschränkungen des Modells widerspricht, wie z. B. eine Parameter-ID außerhalb des Zeichenbereichs von haumacher/ehome #110) macht die Umschreibung durch die Umbenennung rückgängig. In der Transaktion erstellte Objekte haben keine ID, die nachverfolgt werden könnte; ein gelöschtes und erneut erstelltes Objekt gilt nicht als Umbenennung. </p> <p> Nachdem der Commit erfolgreich war, wird dem Benutzer mitgeteilt, wie viele Ausdrücke angepasst wurden, und bei einem umbenannten Parameter, dass der auf dem Controller festgelegte Wert verloren geht (homecontrol <code>spec/rules.md</code> 8.4, D5); bei einem umbenannten Datenpunkt mit gespeichertem Wert oder Verlauf, dass der Controller sie mit der nächsten Bereitstellung verliert, da er sie unter der ID führt (homecontrol <code>spec/runtime-image.md</code> 3.3): Eine After-Commit-Aktion der Transaktion (<i>Commit-Aktionen</i>) zeigt diese über den <i>Info-Service</i> der Interaktion an, den die Ansichtsebene in dem Fenster anzeigt, in dem gespeichert wurde (außerhalb eines Fensters, z. B. in einem Job, wird nichts angezeigt). </p> <p> Registriert in <code>WEB-INF/autoconf/ehome.runtime.config.xml</code>. </p>
