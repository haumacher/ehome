de.haumacher.ehome.runtime.ControllerStatusAction = Controller-Status
de.haumacher.ehome.runtime.ControllerStatusAction.tooltip = <i>View-Aktion</i>, die liest, was ein Controller ausführt (<code>GET /api/status</code>). <p> Für ein Projekt (<code>ehome.project:Project</code>) ist das Ergebnis der Vergleich dessen, was sein Controller ausführt, mit der letzten Bereitstellung des Projekts (<code>ControllerStatus#drift(TLObject)</code>), für einen Controller (<code>ehome.runtime:Controller</code>) das, was er ausführt; in beiden Fällen ein Text. </p>
de.haumacher.ehome.runtime.CreateFunctionAction = Funktion anlegen
de.haumacher.ehome.runtime.CreateFunctionAction.tooltip = <i>View-Aktion</i>, die dem Eingabeprojekt (<code>ehome.project:Project</code>) eine neue Funktion hinzufügt (ein Licht ohne Datenpunkte), die der Benutzer dann bearbeitet; das Ergebnis ist die neue Funktion.
de.haumacher.ehome.runtime.DeleteFunctionAction = Funktion löschen
de.haumacher.ehome.runtime.DeleteFunctionAction.tooltip = <i>View-Aktion</i>, die die Eingabefunktion (<code>ehome.runtime:Function</code>) löscht und eine vorgeschlagene als verworfen vermerkt (haumacher/ehome #49, <code>FunctionProposal#dismiss(TLObject)</code>). <p> Das Ergebnis ist <code>null</code> (nichts mehr ausgewählt). Der Befehl trägt die Prüfungen der Modellzugriffsrechte: Die Aktion ändert das Projekt in Java. </p>
de.haumacher.ehome.runtime.DeployRuntimeImageAction = Laufzeitabbild bereitstellen
de.haumacher.ehome.runtime.DeployRuntimeImageAction.tooltip = <i>View-Aktion</i>, die das Laufzeitabbild des Eingabeprojekts (<code>ehome.project:Project</code>) in seinen Controller lädt, siehe <i>Deployer</i>. <p> Das Ergebnis ist die aufgezeichnete Bereitstellung (<code>ehome.runtime:Deployment</code>), angenommen oder nicht: Eine Ablehnung ist ein Ergebnis, das angezeigt wird, kein Fehler des Befehls. </p>
de.haumacher.ehome.runtime.DiscoverControllersAction = Controller suchen
de.haumacher.ehome.runtime.DiscoverControllersAction.Config.timeout = Zeitüberschreitung
de.haumacher.ehome.runtime.DiscoverControllersAction.Config.timeout.tooltip = Millisekunden, um die Antworten zu erfassen.
de.haumacher.ehome.runtime.DiscoverControllersAction.tooltip = <i>Aktion zum</i> Durchsuchen der lokalen Netzwerke nach HomeControl-Controllern (haumacher/ehome #42): die Instanzen des DNS-SD-Dienstes <code>"_homecontrol._tcp.local"</code>, die auf eine Multicast-DNS-Abfrage (<i>mdns-Browser</i>) antworten. <p> Die Eingabe ist entweder leer oder eine Map mit dem Eintrag <code>interface</code>: der Name der Netzwerkschnittstelle, auf der gesucht werden soll (einschließlich der Loopback-Schnittstelle); ohne diesen Eintrag wird die Suche auf allen Schnittstellen durchgeführt, die aktiv sind, Multicast unterstützen und keine Loopback-Schnittstelle sind. </p> <p> Das Ergebnis ist die Liste der gefundenen Controller, eine Map pro Controller mit den Schlüsseln <code>name</code> (der Hostname ohne <code>.local</code>, z. B. <code>homecontrol-a1b2c3</code>), <code>instance</code> (der Instanzname der Ankündigung), <code>hostName</code>, <code>host</code> (die IPv4-Adresse), <code>port</code> (der Web-API; <code>portText</code> ohne Tausendertrennzeichen geschrieben), <code>version</code> und <code>build</code> (die TXT-Attribute der Ankündigung, leer, falls nicht vorhanden), die als Zeilen einer Tabelle angezeigt und in einen Controller (<code>ehome.runtime:Controller</code>: Name, Host, Port) umgewandelt werden sollen. </p>
de.haumacher.ehome.runtime.ExportRuntimeImageAction = Laufzeitabbild exportieren
de.haumacher.ehome.runtime.ExportRuntimeImageAction.tooltip = <i>View-Aktion</i>, die das Laufzeitabbild des Eingabeprojekts (<code>ehome.project:Project</code>) zum Herunterladen exportiert, nachdem sie es geprüft hat wie der Controller. <p> Das Abbild trägt die Revision, die die nächste Bereitstellung tragen würde. Das Ergebnis ist eine Map für einen Dialog: <code>file</code> (das Abbild als JSON-Datei, benannt nach dem Projekt; <code>null</code> für ein abgelehntes Abbild), <code>summary</code> (ob das Abbild gültig ist; für ein gültiges, was es enthält, siehe <code>#summary(RuntimeImage)</code>), <code>refusals</code> (eine Map je Ablehnung mit <code>path</code>, <code>reason</code> und dem <code>element</code> des Projekts, zu dem der Pfad führt) und <code>notes</code> (was der Export ausgelassen hat, eine Zeile je Punkt). </p>
de.haumacher.ehome.runtime.ImageComparison$State = Vergleichsergebnis
de.haumacher.ehome.runtime.ImageComparison$State.tooltip = Wie sich das gespeicherte Abbild zu dem Abbild verhält, das bereitgestellt werden soll.
de.haumacher.ehome.runtime.ImageComparison.State.DIFFERENT = Verschieden
de.haumacher.ehome.runtime.ImageComparison.State.DIFFERENT.tooltip = Der Controller speichert ein anderes Abbild: eines anderen Stands des Projekts oder eines anderen Projekts.
de.haumacher.ehome.runtime.ImageComparison.State.IDENTICAL = Identisch
de.haumacher.ehome.runtime.ImageComparison.State.IDENTICAL.tooltip = Der Controller speichert das Abbild des Projekts in seinem aktuellen Stand.
de.haumacher.ehome.runtime.ImageComparison.State.NONE = Keine
de.haumacher.ehome.runtime.ImageComparison.State.NONE.tooltip = Der Controller speichert kein Abbild.
de.haumacher.ehome.runtime.ImageComparison.State.UNKNOWN = Unbekannt
de.haumacher.ehome.runtime.ImageComparison.State.UNKNOWN.tooltip = Der Controller konnte nicht gefragt werden oder hat nicht mit einem Abbild geantwortet.
de.haumacher.ehome.runtime.ImageReport$Kind = Art
de.haumacher.ehome.runtime.ImageReport$Kind.tooltip = Die Arten von Ablehnungen, die entsprechend den Bezeichnungen der Konformitätsfälle benannt sind.
de.haumacher.ehome.runtime.ImageReport.Kind.INVALID = Ungültig
de.haumacher.ehome.runtime.ImageReport.Kind.INVALID.tooltip = Alles andere, was das Dokument falsch angibt (<code>image.invalid</code>).
de.haumacher.ehome.runtime.ImageReport.Kind.NONE = Keine
de.haumacher.ehome.runtime.ImageReport.Kind.NONE.tooltip = Gültig.
de.haumacher.ehome.runtime.ImageReport.Kind.SYNTAX = Syntax
de.haumacher.ehome.runtime.ImageReport.Kind.SYNTAX.tooltip = Kein JSON (<code>image.bad_json</code>).
de.haumacher.ehome.runtime.ImageReport.Kind.TOO_LARGE = Zu groß
de.haumacher.ehome.runtime.ImageReport.Kind.TOO_LARGE.tooltip = Mehr als die Byte-Grenze (<code>image.too_large</code>).
de.haumacher.ehome.runtime.ImageReport.Kind.VERSION = Version
de.haumacher.ehome.runtime.ImageReport.Kind.VERSION.tooltip = Eine neuere Hauptversion des Schemas (<code>image.version</code>).
de.haumacher.ehome.runtime.ProposeFunctionsAction = Funktionen vorschlagen
de.haumacher.ehome.runtime.ProposeFunctionsAction.tooltip = <i>View-Aktion</i>, die dem Eingabeprojekt (<code>ehome.project:Project</code>) die Funktionen hinzufügt, die der <i>Funktionsvorschlag</i> vorschlägt und die dem Projekt fehlen. <p> Das Ergebnis ist ein Satz, der sagt, wie viele Funktionen hinzugefügt wurden, für eine Benachrichtigung. </p>
de.haumacher.ehome.runtime.RuleConstraint = Prüfung eines Regelfelds
de.haumacher.ehome.runtime.RuleConstraint.Config.syntax = Syntax
de.haumacher.ehome.runtime.RuleConstraint.Config.syntax.tooltip = Ob die Prüfung die der Syntax ist (ein Fehler) statt der Ablehnungen des Controllers (eine Warnung).
de.haumacher.ehome.runtime.RuleConstraint.tooltip = <i>Prüfung</i> eines Feldes einer Regel oder eines Zeitplaneintrags (haumacher/ehome #57): Das Feld wird abgelehnt, wie der Controller es ablehnen würde (<code>RuleExport#fieldProblem(Object, String, Object, boolean)</code>). <p> Mit <i>„Syntax“</i> prüft sie, ob der Text ein Ausdruck oder Literal der Regelsprache ist, ein Fehler (ein Text, der sich nicht lesen lässt, wird nicht gespeichert); ohne meldet sie die Ablehnung durch den Lader des Controllers als Warnung (eine Regel darf halbfertig gespeichert werden). Die Prüfung hängt von jedem Feld des Objekts ab, zu dem das Feld gehört (ein Wert wird gegen den Datenpunkt seiner Aktion geprüft), sodass ein Formular ein Feld erneut prüft, wenn sich ein anderes Feld des Objekts ändert. </p> <p> Der Ausgang eines Zeitplaneintrags, den der Lader annimmt, wird außerdem abgelehnt, wenn er ein schreibbarer Anwendungsdatenpunkt ist (<code>ApplicationDatapoints#outputProblem(Object, Object)</code>): Der Controller lehnt Befehle an ihn ab. </p>
de.haumacher.ehome.runtime.RuleFunctions$Builder = Erzeuger
de.haumacher.ehome.runtime.RuleFunctions$Builder.tooltip = Erzeuger einer <i>Regelfunktion</i>: Die <i>Funktion</i>, unter deren Namen die Funktion registriert ist.
de.haumacher.ehome.runtime.RuleFunctions$Function = Funktion
de.haumacher.ehome.runtime.RuleFunctions$Function.tooltip = Die Funktionen, benannt so, wie sie registriert sind.
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleCreate = Regelteil anlegen
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleCreate.tooltip = <code>ruleCreate(owner, reference, type)</code>: Ein neues Teil des angegebenen Typs, am Ende der angegebenen Referenz des Besitzers angefügt, mit einer eigenen Kennung und den Voreinstellungen seiner Art.
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleDatapoints = Datenpunkte der Regeln
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleDatapoints.tooltip = <code>ruleDatapoints(project)</code>: Die Datenpunkte des Abbilds des Projekts, die die Regeln nennen können, jeder eine Zuordnung mit <code>id</code>, <code>label</code>, <code>type</code>, <code>writable</code> und <code>binding</code> (<code>RuleFunctions#datapoints(TLObject)</code>).
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleImportImage = Regeln aus einem Abbild importieren
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleImportImage.tooltip = <code>ruleImportImage(project, file)</code>: Fügt die Regeln und Zeitplaneinträge des hochgeladenen Laufzeitabbilds (JSON) zum Projekt hinzu (<code>RuleImport#importImage(TLObject, String)</code>); der Satz, der sagt, was importiert wurde, gefolgt von dem, was der Import nicht übernommen hat.
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleList = Regelteile
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleList.tooltip = <code>ruleList(owner, reference)</code>: Die Teile in der angegebenen Referenz des Besitzers.
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleMove = Regelteil verschieben
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleMove.tooltip = <code>ruleMove(part, delta)</code>: Verschiebt das Teil um die angegebene Anzahl von Stellen innerhalb der Liste, die es enthält.
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleMoveVeto = Einwand gegen das Verschieben
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleMoveVeto.tooltip = <code>ruleMoveVeto(part, delta)</code>: Warum das Teil nicht so weit verschoben werden kann; <code>null</code>, wenn es geht.
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleNormalize = Regeltexte normalisieren
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleNormalize.tooltip = <code>ruleNormalize(obj)</code>: Speichert die kanonische Form der Texte der Regelsprache, die der Teil einer Regel oder ein Zeitplaneintrag enthält (<i>RuleNormalization</i>); das Objekt.
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleSummary = Zusammenfassung eines Regelteils
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleSummary.tooltip = <code>ruleSummary(obj)</code>: Eine Zeile, die eine Reaktion, einen Auslöser, eine Aktion oder einen Zeitplaneintrag beschreibt.
de.haumacher.ehome.runtime.RuntimeFunctions$Builder = Erzeuger
de.haumacher.ehome.runtime.RuntimeFunctions$Builder.tooltip = Erzeuger einer <i>Laufzeitfunktion</i>: Die <i>Funktion</i>, unter deren Namen die Funktion registriert ist.
de.haumacher.ehome.runtime.RuntimeFunctions$Function = Funktion
de.haumacher.ehome.runtime.RuntimeFunctions$Function.tooltip = Die Funktionen, benannt so, wie sie registriert sind.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.controllerAddress = Controller-Adresse
de.haumacher.ehome.runtime.RuntimeFunctions.Function.controllerAddress.tooltip = <code>controllerAddress(controller)</code>: <code>host:port</code>.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.controllerTokenHint = Hinweis zum Controller-Token
de.haumacher.ehome.runtime.RuntimeFunctions.Function.controllerTokenHint.tooltip = <code>controllerTokenHint(controller)</code>: Gibt an, ob der Controller über ein Token verfügt, ohne das Token selbst anzugeben.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointFlagsSource = Herkunft der Datenpunkt-Flags
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointFlagsSource.tooltip = <code>datapointFlagsSource(address)</code>: Woher die Flags Beschreibbar und Beim Start lesen stammen, als Text (<code>DatapointSettings#flagsSource(TLObject)</code>).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointReadOnStart = Datenpunkt beim Start lesen
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointReadOnStart.tooltip = <code>datapointReadOnStart(address)</code>: Ob der Datenpunkt der Gruppenadresse beim Start gelesen wird (<code>DatapointSettings#readOnStart(TLObject)</code>).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointUnit = Einheit des Datenpunkts
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointUnit.tooltip = <code>datapointUnit(address)</code>: Die Einheit des Datenpunkts der Gruppenadresse (<code>DatapointSettings#unit(TLObject)</code>).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointWritable = Datenpunkt beschreibbar
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointWritable.tooltip = <code>datapointWritable(address)</code>: Ob der Datenpunkt der Gruppenadresse im Laufzeitabbild beschreibbar ist (<code>DatapointSettings#writable(TLObject)</code>).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.deploymentConfirmation = Bestätigung der Bereitstellung
de.haumacher.ehome.runtime.RuntimeFunctions.Function.deploymentConfirmation.tooltip = <code>deploymentConfirmation(project)</code>: Die Frage vor der Bereitstellung des Projekts, mit dem, was sich von dem Abbild unterscheidet, das sein Controller speichert (<code>ImageComparison#confirmation(TLObject, Instant)</code>).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.deploymentVeto = Bereitstellungsveto
de.haumacher.ehome.runtime.RuntimeFunctions.Function.deploymentVeto.tooltip = <code>deploymentVeto(project)</code>: Warum das Projekt derzeit nicht bereitgestellt werden kann (als Text); <code>null</code>, wenn es möglich ist (<code>Deployer#veto(TLObject)</code>).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.nextImageRevision = Nächste Abbild-Revision
de.haumacher.ehome.runtime.RuntimeFunctions.Function.nextImageRevision.tooltip = <code>nextImageRevision(project)</code>: Die Revision, die die nächste Bereitstellung trägt.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeBuildingParts = Gebäudeteile des Projekts
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeBuildingParts.tooltip = <code>runtimeBuildingParts(obj)</code>: Die Teile der Gebäude des Projekts des gegebenen Objekts, die Auswahl des Raums einer Funktion.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeDatapointIdProblem = Problem der Datenpunkt-Id
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeDatapointIdProblem.tooltip = <code>runtimeDatapointIdProblem(text, datapoint)</code>: Warum der Text nicht die Id des Anwendungsdatenpunkts sein kann (<code>ApplicationDatapoints#idProblem(Object, Object)</code>); <code>null</code>, wenn er es kann.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeDatapoints = Datenpunkte des Projekts
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeDatapoints.tooltip = <code>runtimeDatapoints(obj)</code>: Die Datenpunkte des Projekts des angegebenen Objekts (einer Funktion), die Optionen der Rollen einer Funktion (haumacher/ehome #61): zunächst die Gruppenadressen nach ihrer Adresse, dann die Anwendungsdatenpunkte in ihrer Reihenfolge.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeGroupAddresses = Gruppenadressen des Projekts
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeGroupAddresses.tooltip = <code>runtimeGroupAddresses(obj)</code>: Die Gruppenadressen des Projekts des gegebenen Objekts (ein Projekt, eine Funktion), nach ihrer Adresse: die Auswahl der Rollen einer Funktion und des Zeitgebers.
