de.haumacher.ehome.connection.ConnectionFunctions.Function.enrollmentCodeState.tooltip = <code>enrollmentCodeState(project)</code>: Ob das Projekt einen offenen Anmeldecode hat und bis wann er gilt, als Text (ohne den Code); <code>null</code> für keinen (<code>Controllers#codeState(TLObject, Instant)</code>).
de.haumacher.ehome.connection.ConnectionFunctions.Function.forgetConfirmation = Vergiss die Bestätigung
de.haumacher.ehome.connection.ConnectionFunctions.Function.forgetConfirmation.tooltip = <code>forgetConfirmation(controller)</code>: Die Frage, bevor man den Controller vergisst (<code>I18NConstants#CONFIRM_FORGET__CONTROLLER</code>).
de.haumacher.ehome.connection.ConnectionFunctions.Function.installationKeyCreateVeto = Einwand gegen das Erzeugen des Installationsschlüssels
de.haumacher.ehome.connection.ConnectionFunctions.Function.installationKeyCreateVeto.tooltip = <code>installationKeyCreateVeto(project)</code>: Warum kann für das Projekt kein Installationsschlüssel erstellt werden (als Text); <code>null</code>, wenn dies möglich ist (<code>InstallationKeys#createVeto(TLObject)</code>).
de.haumacher.ehome.connection.ConnectionFunctions.Function.installationKeyRenewVeto = Einwand gegen das Erneuern des Installationsschlüssels
de.haumacher.ehome.connection.ConnectionFunctions.Function.installationKeyRenewVeto.tooltip = <code>installationKeyRenewVeto(project)</code>: Warum der Installationsschlüssel des Projekts derzeit nicht erneuert werden kann (als Text); <code>null</code>, wenn dies möglich ist (<code>InstallationKeys#renewVeto(TLObject)</code>).
de.haumacher.ehome.connection.ConnectionFunctions.Function.installationKeyState = Status des Installationsschlüssels
de.haumacher.ehome.connection.ConnectionFunctions.Function.installationKeyState.tooltip = <code>installationKeyState(project)</code>: Der Installationsschlüssel des Projekts und eine laufende Rotation, als Text (<code>InstallationKeys#state(TLObject)</code>).
de.haumacher.ehome.connection.CreateEnrollmentCodeAction = Aktion „Anmeldecode erzeugen“
de.haumacher.ehome.connection.CreateEnrollmentCodeAction.tooltip = <i>View-Aktion</i>, die einen Anmeldecode für das Eingabeprojekt erzeugt (haumacher/ehome #54, <code>Enrollment#createCode(TLObject, com.top_logic.knowledge.wrap.person.Person, Instant)</code>) und einen offenen ersetzt. <p> Das Ergebnis ist der Satz mit dem Code, seinem Ablauf und den Minuten, die er gilt, für einen Dialog (außer im verborgenen Attribut des Projekts der einzige Ort, an dem der Code erscheint). </p>
de.haumacher.ehome.connection.CreateInstallationKeyAction = Aktion „Installationsschlüssel erstellen“
de.haumacher.ehome.connection.CreateInstallationKeyAction.tooltip = <i>Zeigt die Aktion an</i>, mit der der Installationsschlüssel des Eingabeprojekts (Homecontrol-Issue #35, <code>InstallationKeys#create(TLObject)</code>) erstellt wird, das noch keinen besitzt: ein neues Ed25519-Schlüsselpaar, das den mit dem Projekt verbundenen Controllern sofort und den anderen bei ihrer nächsten Verbindung angeboten wird. <p> Das Ergebnis ist ein Satz, der den Fingerabdruck des neuen Schlüssels angibt, den der Besitzer mit dem auf der Einstellungsseite des Controllers angezeigten vergleicht, bevor er ihn akzeptiert. </p>
de.haumacher.ehome.connection.ForgetControllerAction = Aktion „Controller vergessen“
de.haumacher.ehome.connection.ForgetControllerAction.tooltip = <i>View-Aktion</i>, die den Eingabe-Controller vergisst (<code>ehome.runtime:Controller</code>, haumacher/ehome #54): löscht ihn (<code>Controllers#forget(TLObject)</code>) und schließt seine Verbindung, die ab sofort abgelehnt wird. Eine spätere Anmeldung desselben Geräts ist ein neuer Controller. <p> Das Ergebnis ist der Satz, der das sagt. </p>
de.haumacher.ehome.connection.ProjectControllerFunctions$Builder = Erzeuger
de.haumacher.ehome.connection.ProjectControllerFunctions$Builder.tooltip = Erzeuger einer Funktion der Controller eines Projekts: die <i>Funktion</i>, benannt wie die Funktion registriert ist.
de.haumacher.ehome.connection.ProjectControllerFunctions$Function = Funktion
de.haumacher.ehome.connection.ProjectControllerFunctions$Function.tooltip = Die Funktionen, benannt so, wie sie registriert sind.
de.haumacher.ehome.connection.ProjectControllerFunctions.Function.controllerAssign = Controller zuordnen
de.haumacher.ehome.connection.ProjectControllerFunctions.Function.controllerAssign.tooltip = <code>controllerAssign(controller, project)</code>: ein Controller ohne Projekt wird einer der Controller des Projekts (<code>ProjectControllers#assign(TLObject, TLObject)</code>).
de.haumacher.ehome.connection.ProjectControllerFunctions.Function.controllerCreate = Controller erstellen
de.haumacher.ehome.connection.ProjectControllerFunctions.Function.controllerCreate.tooltip = <code>controllerCreate(project, name, host, port, token)</code>: ein neuer Controller im LAN im Projekt (<code>ProjectControllers#create(TLObject, Object, Object, Object, Object)</code>).
de.haumacher.ehome.connection.RenewInstallationKeyAction = Aktion „Installationsschlüssel erneuern“
de.haumacher.ehome.connection.RenewInstallationKeyAction.tooltip = <i>Aktion</i> zur Erneuerung des Installationsschlüssels des Eingabeprojekts <i>anzeigen</i> (Homecontrol-Problem Nr. 35, <code>InstallationKeys#renew(TLObject)</code>): Den Controllern wird ein neues Ed25519-Schlüsselpaar angeboten, und der alte Schlüssel bleibt der Signaturschlüssel, bis sie den neuen akzeptieren. <p> Das Ergebnis ist ein Satz, der den Fingerabdruck des neuen Schlüssels angibt; diesen vergleicht der Besitzer mit dem auf der Einstellungsseite des Controllers angezeigten Fingerabdruck, bevor er ihn akzeptiert. </p>
de.haumacher.ehome.discover.DiscoverGatewaysAction = Entdecken Sie die „Gateways“-Aktion
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.timeout = Zeitüberschreitung
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.timeout.tooltip = Es dauert nur wenige Sekunden, bis die Antworten vorliegen.
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-multicast = Multicast verwenden
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-multicast.tooltip = Ob die Suchanfrage per Multicast gesendet werden soll.
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-nat = Verwende NAT
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-nat.tooltip = Ob über einen NAT-Router gesucht werden soll.
de.haumacher.ehome.discover.DiscoverGatewaysAction.tooltip = <i>Aktion anzeigen</i>, die die lokalen Netzwerke nach KNXnet/IP-Gateways durchsucht. <p> Als Eingabe wird entweder nichts oder ein Schlüssel-Wert-Paar mit den Sucheinstellungen erwartet: <code>interface</code> (Name der zu durchsuchenden Netzwerkschnittstelle, alle Schnittstellen, wenn leer), <code>local-host</code> (lokale Absenderadresse), <code>use-nat</code> und <code>use-multicast</code>; in dem Schlüssel-Wert-Paar fehlende Einstellungen werden aus der Konfiguration übernommen. Das Ergebnis ist die Liste der Gateways, die geantwortet haben, jeweils ein Schlüsselpaar pro Gateway (ein Gateway, das mehrmals geantwortet hat, wird nur einmal aufgeführt) mit den Schlüsseln <code>name</code>, <code>address</code>, <code>endpoint</code>, <code>mac</code>, <code>serial</code> und <code>medium</code>, die als Zeilen einer Tabelle angezeigt werden sollen. </p> <p> Wird abgelehnt, sofern diese Installation keine lokalen Netzwerke erreicht (<code>OperatorSettings#checkLocalNetwork()</code>, haumacher/ehome #150). </p>
de.haumacher.ehome.discover.KnxNetworkInterfaces$Builder = Erzeuger
de.haumacher.ehome.discover.KnxNetworkInterfaces$Builder.tooltip = Generator für <i>KNX-Netzwerkschnittstellen</i>.
de.haumacher.ehome.etsImport.ImportEtsProjectJob = Job: ETS-Projekt importieren
de.haumacher.ehome.etsImport.ImportEtsProjectJob.tooltip = Die Arbeit des ETS-Imports (Rumpf des <code>&lt;start-job&gt;</code> von <code>projects/overview.view.xml</code> und <code>projects/import-password.view.xml</code>, haumacher/ehome #84): Importiert die hochgeladenen ETS-Projektdateien (<code>.knxproj</code>). <p> Der Auftrag wird mit der hochgeladenen Datei, einer Sammlung solcher Dateien oder der Anfrage des Passwortdialogs (einem Wörterbuch mit der in <code>file</code> hochgeladenen Datei) sowie mit dem Projektpasswort als weiterem Textargument gestartet, sofern eines eingegeben wurde. Jede Datei wird in einer eigenen Transaktion in den Phasen von <code>ImportJobs#importFile</code> importiert, wobei der Fortschritt anhand der Einträge der Datei verfolgt wird. Das Ergebnis ist der Importbericht, ein Wörterbuch: <code>project</code> ist das durch den letzten Import erstellte Projekt (für ein nachfolgendes <code>&lt;write-channel&gt;</code>), <code>messages</code> die vom Import gemeldeten Warnungen und Fehler (jeweils ein Wörterbuch mit <code>file</code>, <code>severity</code>, <code>level</code> und <code>message</code>) und <code>summary</code> ein Satz, der die importierten Projekte und die Anzahl der Meldungen nennt. Die Meldungen ändern nichts am Ergebnis: Eine Datei, die nicht importiert werden kann, führt zum Fehlschlagen des Auftrags. </p> <p> Eine einzelne hochgeladene Datei, deren Projekt durch ein Passwort geschützt ist und die ohne Passwort hochgeladen wurde, wird nicht importiert: Das Ergebnis ist ein Wörterbuch, bei dem <code>passwordRequired</code> auf <code>true</code> gesetzt ist, die Datei in <code>file</code> und der Grund in <code>message</code> steht, sodass die Ansicht nach dem Passwort fragen und die Datei erneut importieren kann (ein fehlgeschlagener Auftrag würde den Befehl stattdessen beenden). Ein falsches Passwort oder das Fehlen eines Passworts im Passwortdialog führt zum Fehlschlagen des Auftrags mit Angabe des Grundes, bevor überhaupt etwas importiert wird. </p> <p> Ein abgebrochener Auftrag importiert nichts aus der aktuellen Datei; bei einem Upload mehrerer Dateien bleiben die zuvor importierten Dateien erhalten. </p>
de.haumacher.ehome.etsImport.ImportProductDataJob = Job: Produktdaten importieren
de.haumacher.ehome.etsImport.ImportProductDataJob.tooltip = Der Produktdatenimport in den Katalog (<code>&lt;start-job&gt;</code> von <code>catalogs.view.xml</code>, haumacher/ehome #84): Importiert die hochgeladenen Produktdateien der Hersteller (<code>.knxprod</code>) in den Katalog. <p> Der Job wird mit der hochgeladenen Datei oder einer Sammlung solcher Dateien gestartet. Jede Datei wird schrittweise importiert (haumacher/ehome #160): Die Daten, die sich die Anwendungsprogramme teilen (Stammdaten, Kataloge, Hardware, Dateien), werden in einer eigenen Transaktion importiert, anschließend jedes Anwendungsprogramm in einer eigenen Transaktion in den <code>ImportJobs#importFile</code> Phasen gemäß der Zuordnung des Importprojekts (siehe <code>Importer#importProductData</code>): Die Hersteller, Kataloge, Produkte und Anwendungsprogramme, die der Katalog bereits enthält, werden anhand ihrer IDs wiederverwendet; ein bereits bekanntes Anwendungsprogramm wird übersprungen. Das Ergebnis ist der Importbericht, ein Verzeichnis ähnlich dem des <i>Import-ETS-Projekt-Jobs</i>: <code>manufacturer</code> ist der Hersteller der zuletzt importierten Datei, <code>summary</code> ein Satz, der für jede Datei die importierten Hersteller, Produkte und Anwendungsprogramme auflistet, die bereits bekannten (oder dass keine vorhanden sind) sowie diejenigen, die nicht importiert werden konnten, mit Angabe des Grundes, der Anzahl der importierten Dateien des Herstellers und derjenigen, die durch eine neuere Version ersetzt wurden (haumacher/ehome #154), sowie der Anzahl der Meldungen; <code>messages</code> sind die vom Import gemeldeten Warnungen und Fehler. Eine Datei, die nicht importiert werden kann (eine Projektdatei, eine Datei mit verschlüsselten Einträgen), führt zum Fehlschlagen des Auftrags mit Angabe des Grundes; ein Anwendungsprogramm, das nicht importiert werden kann, wird separat zurückgesetzt und im Bericht aufgeführt, die anderen werden importiert. Ein abgebrochener Auftrag behält die Schritte der Datei bei, bei der er sich gerade befindet und die zuvor festgeschrieben wurden (die gemeinsam genutzten Daten, die vollständig importierten Programme), jedoch nichts von dem Schritt, bei dem er sich gerade befindet. </p>
de.haumacher.ehome.etsImport.ImportProjectFileJob = Projektdatei importieren
de.haumacher.ehome.etsImport.ImportProjectFileJob.tooltip = Der Import von Projektdateien (<code>&lt;name&gt;.ehome</code>, haumacher/ehome #117; <code>&lt;start-job&gt;</code> von <code>projects/overview.view.xml</code>): Jede Datei wird zu einem neuen Projekt. <p> Der Vorgang wird mit der hochgeladenen Datei oder einer Sammlung von Dateien gestartet. Zunächst wird eine Datei gelesen und geprüft (eine Datei in einem anderen Format oder einer neueren Hauptversion des Formats wird vor dem Import abgelehnt); anschließend wird <code>.knxproj</code> wie beim ETS-Import in den Phasen <code>ImportJobs#importFile</code> importiert, und in derselben Transaktion wird der E-Home-Teil dem erstellten Projekt hinzugefügt (<i>Projektdatei-Import</i>). Das Ergebnis ist der Bericht zum <i>Import-ETS-Projekt-Auftrag</i>: die Meldungen beider Schritte, darunter die, dass die Controller erneut gekoppelt werden müssen und – sofern die Installation ein Projekt mit derselben ID enthält – dass beide auf denselben Controllern bereitgestellt würden. </p>
de.haumacher.ehome.etsImport.UpdateFromEtsJob = Aus ETS aktualisieren
de.haumacher.ehome.etsImport.UpdateFromEtsJob.tooltip = Die Arbeit des Befehls „Aus ETS aktualisieren“ (<code>&lt;start-job&gt;</code> von <code>projects/overview.view.xml</code> und <code>projects/update-password.view.xml</code>, haumacher/ehome #125): aktualisiert ein Projekt aus einem neuen Export desselben Projekts aus der ETS und behält, was nur E-Home hält (<i>Projektaktualisierung</i>). <p> Der Auftrag wird mit der hochgeladenen Datei und dem zu aktualisierenden Projekt gestartet oder mit der Anfrage des Passwortdialogs (ein Wörterbuch mit der Datei in <code>file</code> und dem Projekt in <code>project</code>) und dem Projektpasswort. Die Datei wird wie beim ETS-Import in den Phasen von <code>ImportJobs#importFile</code> in ein eigenes Projekt importiert, das die Aktualisierung in derselben Transaktion in das Projekt übernimmt und löscht: Eine abgelehnte Aktualisierung (ein anderes Projekt, Objekte, die die Datei entfernt und E-Home verwendet, …) lässt den Auftrag mit den Gründen fehlschlagen und ändert nichts; ebenso ein abgebrochener. Das Ergebnis ist der Bericht von <i>ETS-Projekt importieren</i> mit dem aktualisierten Projekt in <code>project</code> und den Änderungen je Art unter den Meldungen; ein durch ein Passwort geschütztes Projekt, das ohne Passwort hochgeladen wurde, ergibt das Ergebnis von <i>ETS-Projekt importieren</i>, das nach dem Passwort fragt, mit dem Projekt in <code>project</code>. </p>
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat = Format der Aufzählung
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat.Config.default-value = Standardwert
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat.Config.type = Typ
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat.tooltip = Format zum Auslesen eines Klassifikators einer Aufzählung anhand seines Namens. <p> Ein Wert, der kein Bezeichner ist, wird ausschließlich anhand seiner Buchstaben, Ziffern und Unterstriche abgeglichen, sodass der Klassifikator <code>DPT9</code> den ETS-Wert <code>DPT 9</code> ausliest. </p>
de.haumacher.ehome.etsImport.importer.format.TLEnumerationSetFormat = Format der Aufzählungsmenge
de.haumacher.ehome.etsImport.importer.format.TLEnumerationSetFormat.Config.type = Typ
de.haumacher.ehome.etsImport.importer.format.TLEnumerationSetFormat.Config.type.tooltip = Der qualifizierte Name der Aufzählung.
de.haumacher.ehome.etsImport.importer.format.TLEnumerationSetFormat.tooltip = Format zum Einlesen einer Liste von Klassifikatoren einer Aufzählung anhand ihrer durch Leerzeichen getrennten Namen (eine XML-Schema-Liste, z. B. <code>remote local1</code>) für eine Mehrfachreferenz auf eine Aufzählung.
de.haumacher.ehome.exporter.ExportKnxprojAction = Als .knxproj exportieren
de.haumacher.ehome.exporter.ExportKnxprojAction.tooltip = <i>Aktion</i>, die das Eingabeprojekt (<code>ehome.project:Project</code>) mit dem <i>knxproj-Exporter</i> als ETS-Projektarchiv exportiert. <p> Das Ergebnis ist das Archiv als Binärdaten, benannt nach dem Projekt (<code>&lt;name&gt;.knxproj</code>), für einen Dialog, der es zum Herunterladen anbietet. Das Archiv ist nicht signiert, deshalb importiert die ETS es nicht. </p>
de.haumacher.ehome.importer.CompleteModules = Module vervollständigen
de.haumacher.ehome.importer.CompleteModules.Config.allocators = Allokatoren
de.haumacher.ehome.importer.CompleteModules.Config.allocators.tooltip = Der Handler, der die Allokatoren des Programms ausliest (das Element <code>Allocators</code>).
de.haumacher.ehome.importer.CompleteModules.Config.calculations = Berechnungen
de.haumacher.ehome.importer.CompleteModules.Config.calculations.tooltip = Der Handler, der die Berechnungen (den Inhalt des Elements <code>ParameterCalculations</code>) in eine Programm- oder Moduldefinition einliest.
de.haumacher.ehome.importer.CompleteModules.Config.module = Modul
de.haumacher.ehome.importer.CompleteModules.Config.module-defs = Moduldefinitionen
de.haumacher.ehome.importer.CompleteModules.Config.module-defs.tooltip = Der Handler, der die Moduldefinitionen liest (das Element <code>ModuleDefs</code>).
de.haumacher.ehome.importer.CompleteModules.Config.module.tooltip = Der Handler, der eine Platzierung eines Moduls (das Element <code>Module</code>) in ein Strukturelement liest.
de.haumacher.ehome.importer.CompleteModules.Config.repeat = Wiederholung
de.haumacher.ehome.importer.CompleteModules.Config.repeat.tooltip = Der Handler, der einen wiederholten Teil (das Element <code>Repeat</code>) in ein Strukturelement liest.
de.haumacher.ehome.importer.CompleteModules.Config.validations = Prüfungen
de.haumacher.ehome.importer.CompleteModules.Config.validations.tooltip = Der Handler, der die Prüfungen (den Inhalt des Elements <code>ParameterValidations</code>) in ein Programm oder eine Moduldefinition liest.
de.haumacher.ehome.importer.CompleteModules.tooltip = Vervollständigt ein bekanntes Anwendungsprogramm (die <code>this</code> von <code>&lt;update&gt;</code> von <code>&lt;unless-known&gt;</code>), bei dem ein früherer Import die dynamischen Module ausgelassen hat (haumacher/ehome #119), sofern der Scan der Datei dies vorgesehen hat (siehe <i>Modulvervollständigung</i>), oder ohne dessen Parameterberechnungen (haumacher/ehome #123, <code>calculationsRead</code> nicht gesetzt) oder ohne dessen Parameterprüfungen (haumacher/ehome #124, <code>validationsRead</code> nicht gesetzt); andernfalls wendet es dessen Inhaltshandler an (die Aktualisierung eines bekannten Programms). <p> Die Vervollständigung liest das ein, was der frühere Import übersprungen hat; der Rest des Programms bleibt erhalten: die Allokatoren des Programms (<i>Allocators</i>), seine Moduldefinitionen (<i>Module defs</i>) sowie jeweils <code>Module</code> und <code>Repeat</code> des dynamischen Teils (nicht in einem anderen verschachtelt, <i>Module</i>, <i>Repeat</i>) werden unter ihren Plannamen in das Strukturelement verschoben und an ihre dortige Position gesetzt. Anschließend wird die Markierung <code>usesModules</code> entfernt, und der Import meldet die Vervollständigung. Die Berechnungen des Programms und seiner Moduldefinitionen (<i>Calculations</i>) sowie deren Skripte werden in das Programm und seine Moduldefinitionen eingelesen (diejenigen, die die Modulvervollständigung erstellt, lesen ihre Berechnungen selbst ein), und <code>calculationsRead</code> wird gesetzt. Ebenso die Prüfungen (<i>Validations</i>), und <code>validationsRead</code> wird gesetzt. </p>
de.haumacher.ehome.importer.DeviceModuleInstances = Instanzen von Gerätemodulen
de.haumacher.ehome.importer.DeviceModuleInstances.tooltip = Liest die Modulinstanzen, die ein Gerät in einer Projektdatei mit ihren Argumenten auflistet (ETS: <code>DeviceInstance/ModuleInstances</code>, haumacher/ehome #119), um sie mit den von E-Home berechneten Instanzen zu vergleichen (siehe <i>Modulimport</i>): Die Instanzen selbst stammen von E-Home.
de.haumacher.ehome.importer.DeviceScope = Gerätebereich
de.haumacher.ehome.importer.DeviceScope.Config.contents = Inhalt
de.haumacher.ehome.importer.DeviceScope.Config.contents.tooltip = Die Handler, die den Inhalt des Geräts importieren.
de.haumacher.ehome.importer.DeviceScope.tooltip = Importiert den Inhalt eines Geräts (ETS: <code>DeviceInstance</code>) mit den Gültigkeitsbereichen, auf die sich die Kurz-IDs neuerer ETS-Versionen beziehen. <p> Seit ETS 5 benennt ein Gerät seine Kommunikationsobjekte mit IDs, die relativ zu seinem Anwendungsprogramm sind (<code>O-2_R-1</code> für <code>M-0083_A-0028-38-DB99_O-2_R-1</code>), und seit ETS 5.7 die Gruppenadressen, mit denen es verknüpft ist, mit IDs, die relativ zu seiner Installation sind (<code>GA-1</code> für <code>P-047E-0_GA-1</code>). Das Programm ist dasjenige aus der Programmzuordnung des Geräts (<code>Hardware2ProgramRefId</code>); die Installation ist der Geltungsbereich der geräteeigenen ID. Beide werden in den Variablen <code>"programId"</code> und <code>"installationId"</code> für <i>Programmverweise</i> und <i>Gruppenverknüpfungen</i> bereitgestellt. </p>
de.haumacher.ehome.importer.ExtensionRequirements = Anforderungen der Erweiterung
de.haumacher.ehome.importer.ExtensionRequirements.tooltip = Liest aus den Attributen des Elements <code>Static/Extension</code> eines Anwendungsprogramms (haumacher/ehome #159), was es außer seinen Produktdaten von der ETS benötigt, in <code>ehome.operational:Program#requirements</code> des importierten Programms (das <code>this</code> des Elements) und meldet es: ein Plug-in der Bedienoberfläche allein als Hinweis, jede andere Anforderung als Warnung, dass E-Home das Programm nicht laden kann (siehe <i>PluginRequirements</i>). <p> Es liest nur die Attribute; die Kindelemente <code>Baggage</code> lesen die Handler danach. Ein Programm, das ein früherer Import ohne seine Anforderungen gelesen hat, wird beim nächsten Import seiner Datei vervollständigt (<code>#complete(TLObject, Set, BufferingI18NLog)</code>, aus dem Durchlauf des Imports über die Programmdatei). </p>
de.haumacher.ehome.importer.GroupLinks = Verknüpfte Gruppenadressen
de.haumacher.ehome.importer.GroupLinks.Config.xml-attribute = XML-Attribut
de.haumacher.ehome.importer.GroupLinks.Config.xml-attribute.tooltip = Das XML-Attribut, das die Links enthält.
de.haumacher.ehome.importer.GroupLinks.tooltip = Importiert die Gruppenadressen, mit denen ein Kommunikationsobjekt eines Geräts verknüpft ist, wie ETS 5.7 und neuer sie schreibt: das Attribut <code>Links</code> eines <code>ComObjectInstanceRef</code>, eine durch Leerzeichen getrennte Liste von Gruppenadress-IDs relativ zur Installation (siehe <i>Gerätebereich</i>). <p> Die erste Adresse ist die, an die das Objekt sendet, die anderen die, von denen es empfängt; jede wird eine Verbindung (<code>ehome.physical:Connection</code>) des Objekts, wie die <code>Connectors</code> von ETS 4. </p>
de.haumacher.ehome.importer.KnownProgramTexts = Bekannte Programmtexte
de.haumacher.ehome.importer.KnownProgramTexts.tooltip = Aktualisiert ein bekanntes Anwendungsprogramm (das <code>this</code> eines <code>&lt;update&gt;</code> von <code>&lt;unless-known&gt;</code>) mit den Texten in der Sprache der Datei, falls sie dem Programm fehlt (haumacher/ehome #38). <p> Ein Anwendungsprogramm ändert sich unter seiner ID, die auch die Version enthält, niemals, sodass ein bekanntes Programm nicht erneut importiert wird. Ein Programm speichert jedoch die Sprachen seiner Texte (siehe <i>Programmsprachen</i>), und ETS schreibt dasselbe Programm in der Sprache der Installation, die es exportiert. Fehlt dem gespeicherten Programm die Sprache des Elements (die Variable <code>"language"</code>, die an dessen <code>DefaultLanguage</code> gebunden ist), legen die Inhaltshandler die Texte fest (die Textgruppen der Programmelemente, die über <code>&lt;update-known&gt;</code> auf dessen bekannte Nachkommen angewendet werden), und die Sprache wird gespeichert; andernfalls wird das Element übersprungen. In jedem Fall ist das Programm den Übersetzungen der Datei bekannt, die nur die Sprachen hinzufügen, die vor dem Import noch fehlten. </p> <p> Entscheidung und Aufzeichnung sind Sache der App: Die <code>condition</code> von <code>&lt;update&gt;</code> der Engine könnte entscheiden, aber nicht aufzeichnen, was der Import hinzugefügt hat. </p>
de.haumacher.ehome.importer.ModuleOrder = Position des Moduls
de.haumacher.ehome.importer.ModuleOrder.tooltip = Legt die Position des aktuellen Elements <code>Module</code> oder <code>Repeat</code> in seinem Dokument (ETS: XmlOrder, siehe <code>ModuleScan#getOrder(String)</code>) als die Position <code>order</code> der dadurch erzeugten Platzierung oder Wiederholung fest (haumacher/ehome #119). <p> Es werden keine Daten des Elements ausgelesen. </p>
de.haumacher.ehome.importer.NamedValuesImport = Import benannter Werte
de.haumacher.ehome.importer.NamedValuesImport.tooltip = Importiert die benannten Werte eines Datenpunkt-Subtyps aus seiner Kodierung (ab ETS 5.5: <code>DatapointSubtype/Format</code>) in <code>ehome.datapoint:DatapointSubtype#values</code>. <p> Gelesen werden die Werte eines Subtyps, dessen Wert eine Aufzählung ist: ein <code>Format</code> aus einer einzigen <code>Enumeration</code> (20.102 HLK-Betriebsart: 0 „Auto“, 1 „Comfort“, …). Eine Aufzählung, die ein Feld eines zusammengesetzten Werts ist (der Tag von 10.001 Uhrzeit, die Felder von 219.001), benennt die Werte dieses Felds, nicht die des Subtyps; das Modell kennt keine Felder eines Datenpunkttyps, daher werden sie nicht gelesen. Ein aus einem früheren Import (anhand seiner ID) bekannter Wert wird wiederverwendet und sein Text aktualisiert. </p>
de.haumacher.ehome.importer.PlaceReference = Platzierung einer Referenz
de.haumacher.ehome.importer.PlaceReference.Config.id-attribute = ID-Attribut
de.haumacher.ehome.importer.PlaceReference.Config.id-attribute.tooltip = Das XML-Attribut, das die ID der eingefügten Referenz enthält.
de.haumacher.ehome.importer.PlaceReference.tooltip = Fügt eine Parameter- oder Kommunikationsobjektreferenz (ETS: <code>ParameterRefRef</code>, <code>ComObjectRefRef</code>) in das zu importierende Strukturelement ein. <p> Die erste Stelle, an der eine Referenz platziert wird, ist deren Eigentümer (<code>ehome.operational:ConfigFragment#contents</code>). ETS 6 platziert eine Referenz in mehreren Fällen eines Schalters; jede weitere Stelle erhält eine <code>ehome.operational:SharedPlacement</code>, die auf sie verweist, sodass die Referenz eine Identität behält: ihre ID, ihren Standardwert und die auf sie verweisenden Geräteeinstellungen. </p>
de.haumacher.ehome.importer.ProgramImported = Programm importiert
de.haumacher.ehome.importer.ProgramImported.tooltip = Schließt den Import eines neuen Anwendungsprogramms ab (das <code>this</code> seines <code>&lt;object&gt;</code>, als dessen letzter Handler, nach den Handlern, die sein Element lesen): erfasst die Sprache seiner Texte (siehe <i>Programmsprachen</i>) und meldet die Warnungen bezüglich der Programmwerte, die zurückgehalten wurden, bis der Zugriff auf deren Parameter bekannt ist (siehe <i>verborgene Programmwerte</i>). <p> Er liest nichts aus dem Element. </p>
de.haumacher.ehome.importer.ProgramReference = Programmreferenz
de.haumacher.ehome.importer.ProgramReference.tooltip = Importiert eine Referenz von einem Gerät zu einem Teil seines Anwendungsprogramms, angegeben durch eine vollständige ID (ETS 4) oder durch eine relativ zum Programm bezogene ID (ETS 5 und höher: <code>O-2_R-1</code>), siehe <i>Gerätebereich</i>.
de.haumacher.ehome.importer.ReadModules = Module lesen
de.haumacher.ehome.importer.ReadModules.Config.definitions = Definitionen
de.haumacher.ehome.importer.ReadModules.Config.definitions.tooltip = Ob es sich bei dem Element um die Moduldefinitionen des Programms handelt (oder um eine Platzierung oder eine Wiederholung).
de.haumacher.ehome.importer.ReadModules.tooltip = Liest die dynamischen Module eines Anwendungsprogramms (haumacher/ehome #119) mit deren Inhaltshandlern: die Moduldefinitionen (<code>ModuleDefs</code>), die Platzierung eines Moduls (<code>Module</code>) oder einen wiederholten Teil (<code>Repeat</code>) der Struktur, es sei denn, das Programm verwendet ein Konstrukt, das der Import nicht interpretieren kann (siehe <code>ModuleScan#getRefusal(String)</code>). <p> Dann wird das Element übersprungen: Bei Moduldefinitionen wird das Programm markiert (<code>ehome.operational:Program#usesModules</code>), wodurch der Download es ablehnt und der Import eine Warnung ausgibt, in der das Programm und das Konstrukt genannt werden; eine Platzierung oder Wiederholung wird ohne weitere Meldung übersprungen. Die Einstellungen des Geräts und die Objekte der Instanzen seiner Module werden mit einer Warnung pro Gerät (<code>Importer</code>) ausgelassen. </p>
de.haumacher.ehome.importer.RenameTarget = Ziel einer Umbenennung
de.haumacher.ehome.importer.RenameTarget.tooltip = Importiert das Ziel einer Umbenennung eines Anwendungsprogramms (ETS: <code>Rename@RefId</code>, der Block oder Kanal erhält einen anderen Titel, haumacher/ehome #122). <p> ETS benennt auch die Trennzeichen des Parameterdialogs um (<code>ParameterSeparator</code>, ID <code>…_PS-31</code>), die E-Home jedoch nicht importiert (<code>doc/knx/schema-coverage.md</code>, Lücke 7). Eine Umbenennung, deren Ziel das Programm in E-Home nicht enthält, wird mit einer Warnung, in der die Umbenennung und ihr Ziel genannt werden, aus dem Programm ausgelassen (haumacher/ehome #160); das Programm wird ohne diese Umbenennung importiert. </p>
de.haumacher.ehome.importer.TranslationsImport = Übersetzungen importieren
de.haumacher.ehome.importer.TranslationsImport$Mapping = Zuordnung
de.haumacher.ehome.importer.TranslationsImport$Mapping.tooltip = Ordnet die Übersetzungen eines XML-Attributs von Objekten eines Modelltyps einem Modellattribut zu.
de.haumacher.ehome.importer.TranslationsImport.Config.mappings = Zuordnungen
de.haumacher.ehome.importer.TranslationsImport.Config.mappings.tooltip = Zu welchem Modellattribut die Übersetzungen eines XML-Attributs je nach Modelltyp zugeordnet werden.
de.haumacher.ehome.importer.TranslationsImport.Mapping.attribute = Attribut
de.haumacher.ehome.importer.TranslationsImport.Mapping.attribute.tooltip = Das internationalisierte Modellattribut, das die Übersetzungen empfängt.
de.haumacher.ehome.importer.TranslationsImport.Mapping.type = Typ
de.haumacher.ehome.importer.TranslationsImport.Mapping.type.tooltip = Der Modelltyp der Objekte (einschließlich ihrer Spezialisierungen).
de.haumacher.ehome.importer.TranslationsImport.Mapping.xml-attribute = XML-Attribut
de.haumacher.ehome.importer.TranslationsImport.Mapping.xml-attribute.tooltip = Das XML-Attribut, dessen Übersetzungen zugeordnet werden.
de.haumacher.ehome.importer.TranslationsImport.tooltip = Importiert den Abschnitt <code>Languages</code> einer ETS-Datei: die Texte der Objekte der Datei in weiteren Sprachen. <pre> &lt;Language Identifier="de-DE"&gt; &lt;TranslationUnit RefId="..."&gt; &lt;TranslationElement RefId="(Objekt-ID)"&gt; &lt;Translation AttributeName="Text" Text="..."/&gt; </pre> <p> Das Objekt wird anhand seiner ID unter den Objekten dieses Imports und den aus früheren Importen bekannten gemeinsamen Objekten gesucht. Die Zuordnungen geben an, in welches Modellattribut ein XML-Attribut eines Objekts eines bestimmten Typs importiert wird; Übersetzungen anderer Attribute werden ignoriert. </p> <p> Die Übersetzungen eines Anwendungsprogramms des Imports (eine durch ihre ID benannte Übersetzungseinheit) speichern ihre Sprachen im Programm; die eines bekannten Programms legen nur die Texte der Sprachen fest, die ihm fehlen (siehe <i>Programmsprachen</i>), sowie die Texte der Teile, die der Import hinzugefügt hat (siehe <i>vollständige Module</i>). </p>
de.haumacher.ehome.importer.TypedValueImport = Import von typisierten Werten
de.haumacher.ehome.importer.TypedValueImport.Config.xml-attribute = XML-Attribut
de.haumacher.ehome.importer.TypedValueImport.Config.xml-attribute.tooltip = Das XML-Attribut, das den Wert enthält.
de.haumacher.ehome.importer.TypedValueImport.tooltip = Importiert einen Parameterwert, wie er von ETS in den typisierten Wert des aktuellen Objekts (ein Parameter, eine Parameterreferenz oder eine Parametereinstellung) geschrieben wird, und dekodiert ihn entsprechend dem Parametertyp des Objekts, siehe <code>ParameterValues#decode(TLObject, String)</code>. <p> Der Typ wird aus den Referenzen des Objekts gelesen; daher müssen diese importiert sein, bevor dieser Handler ausgeführt wird. ETS-Dateien definieren die Parametertypen vor den Parametern und die Programme vor den Projekten, die diese verwenden, sodass die Referenzen zu diesem Zeitpunkt aufgelöst sind. Ein Wert, dessen Typ nicht dekodiert werden kann, wird als Text beibehalten und als Warnung unter Angabe des Parameters und seiner Position gemeldet (siehe <code>Importer#getMessages()</code>). </p> <p> Ein Wert des Anwendungsprogramms selbst (eines Parameters oder einer Parameterreferenz) wird nur gemeldet, wenn der Parameter sichtbar ist (siehe <i>verborgene Programmwerte</i>). Ein Wert des Projekts (eine Parametereinstellung) wird immer gemeldet. </p>
de.haumacher.ehome.importer.VersionedMasterData = Versionierte Stammdaten
de.haumacher.ehome.importer.VersionedMasterData.Config.contents = Inhalt
de.haumacher.ehome.importer.VersionedMasterData.Config.contents.tooltip = Die Handler, die das Objekt erstellen.
de.haumacher.ehome.importer.VersionedMasterData.Config.id-attribute = ID-Attribut
de.haumacher.ehome.importer.VersionedMasterData.Config.id-attribute.tooltip = Das XML-Attribut, das die ID des Elements enthält.
de.haumacher.ehome.importer.VersionedMasterData.Config.version-attribute = Versionsattribut
de.haumacher.ehome.importer.VersionedMasterData.Config.version-attribute.tooltip = Das Attribut des Objekts, das die Version der Stammdaten angibt, aus denen es stammt.
de.haumacher.ehome.importer.VersionedMasterData.tooltip = Importiert ein Objekt der Stammdaten, das nur einmal vorhanden ist, und erfasst die Version der Stammdaten, aus denen es stammt: <code>MasterData@Version</code> (92 in den ETS-4-Beispielen, 198 im ETS-6-Beispiel), in <code>etsImporter.xml</code> durch <code>&lt;with-var&gt;</code> an die Variable <code>"masterDataVersion"</code> gebunden. <p> Ein noch nicht bekanntes Objekt wird durch den Inhalt angelegt und erhält die ID, die das Element angibt. Bei einem bereits bekannten Objekt (gefunden durch <code>&lt;resolve-existing&gt;</code>) erzeugt der Inhalt einen transienten Kandidaten ohne ID, den <i>die Stammdatenaktualisierungen</i> am Ende des Imports mit dem bekannten Objekt vergleichen: Stammdaten einer höheren Version als die des bekannten Objekts aktualisieren dieses an Ort und Stelle, andere Stammdaten behalten es bei und melden eine Warnung, wenn sie es anders definieren. Verweise auf die ID werden immer auf das bekannte Objekt aufgelöst. </p> <p> Der Inhalt muss das Objekt anonym (ohne <code>id-attribute</code>) anlegen, und nichts außerhalb des Objekts darf auf dessen Teile verweisen: Eine Aktualisierung ersetzt diese. </p>
