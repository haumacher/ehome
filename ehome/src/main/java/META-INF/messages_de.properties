de.haumacher.ehome.monitor.ConnectMonitorAction.Source.GATEWAY = Gateway
de.haumacher.ehome.monitor.ConnectMonitorAction.Source.GATEWAY.tooltip = Das KNXnet/IP-Gateway des Projekts.
de.haumacher.ehome.monitor.ConnectMonitorAction.tooltip = <i>Aktion anzeigen</i>, bei der der Gruppenmonitor eines Projekts über das Gateway des Projekts (<code>ehome.project:Project#gateway</code>) oder – bei <code>source="controller"</code> – über den Monitorstrom eines HomeControl-Controllers (<i>Controller-Busverbindung</i>) an den Bus angeschlossen wird, sowie die Ansicht des Monitors. <p> Die Eingabe ist das Projekt. Bei <code>source="controller"</code> kann es stattdessen ein Wörterbuch sein, das den Controller benennt (haumacher/ehome #56, <code>ControllerTarget#of</code>): <code>project</code>, <code>controller</code> (ein registrierter Controller), <code>host</code>, <code>port</code> und <code>token</code> (ein ad hoc eingegebener oder ein für den registrierten Controller eingegebenes Token); ein Projekt allein steht für seinen eigenen Controller. Der Monitor ist der des Projekts in der Sitzung (<i>Monitor-Sitzungen</i>); einer, der noch mit demselben Gateway oder Controller verbunden ist, wird nicht erneut verbunden, einer, der mit der anderen Quelle verbunden ist, wird wieder verbunden. Von nun an schreibt jede Änderung des Monitors ihre <code>GroupMonitor#snapshot()</code> in den konfigurierten Kanal (<i>Fenster-Publisher</i>); das Ergebnis ist der aktuelle Snapshot. </p>
