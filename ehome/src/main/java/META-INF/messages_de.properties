de.haumacher.ehome.view.ScriptLabelControlProvider.Config.css-class.tooltip = Ausdruck, der die CSS-Klasse eines Knotens anhand seines Objekts berechnet (die Variable <code>$value</code>); <code>null</code>, wenn keine vorhanden ist.
de.haumacher.ehome.view.ScriptLabelControlProvider.Config.image = Bild
de.haumacher.ehome.view.ScriptLabelControlProvider.Config.image.tooltip = Ausdruck, der ein Bild eines Knotens anhand seines Objekts (der Variablen <code>$value</code>) berechnet, das vor seiner Beschriftung angezeigt wird: ein binärer Wert eines Bildformats; <code>null</code> für „keines“. Wird bei der Anzeige des Knotens berechnet.
de.haumacher.ehome.view.ScriptLabelControlProvider.Config.label = Bezeichnung
de.haumacher.ehome.view.ScriptLabelControlProvider.Config.label.tooltip = Ausdruck, der die Bezeichnung eines Knotens anhand seines Objekts (der Variablen <code>$value</code>) berechnet; <code>null</code> für die eigene Bezeichnung des Objekts. Ohne Angabe zeigt jeder Knoten die Bezeichnung seines Objekts.
de.haumacher.ehome.view.ScriptLabelControlProvider.tooltip = Anzeige eines Knotens eines <code>&lt;tree&gt;</code> (sein <code>nodeContent</code>) mit einer Beschriftung und einer CSS-Klasse, die durch TL-Script-Funktionen berechnet werden, für einen Baum, dessen Knoten eine andere Beschriftung benötigen als die, die ihre Objekte an allen anderen Stellen haben, oder eine Markierung. <p> Der Knoten zeigt das Symbol seines Objekts und die Bezeichnung an, die die Funktion aus dem Objekt berechnet; wenn die Funktion nichts liefert, wird die eigene Bezeichnung des Objekts angezeigt. Wie bei der Standarddarstellung von Knoten ist der Knoten kein Link: Ein Klick wählt ihn aus. Beide Ausdrücke betrachten die Werte der in <code>inputs</code> genannten Kanäle als Variablen, die nach den Kanälen benannt sind, und das Objekt als <code>$value</code>. </p><pre> &lt;nodeContent class="de.haumacher.ehome.view.ScriptLabelControlProvider" label="if($value.instanceOf(`ehome.physical:Connection`), connectionLabel($value), null)"/&gt; &lt;nodeContent class="de.haumacher.ehome.view.ScriptLabelControlProvider" inputs="device" css-class="if(deviceChanged($device, $value), 'ehomeChanged', null)"/&gt; </pre> <p> Wenn ein Ausdruck <code>image</code> ein Bild berechnet (einen binären Wert, z. B. das Symbol eines Kanals aus den Symbolen seines Programms, haumacher/ehome #156), zeigt der Knoten dieses vor seiner Beschriftung an, und zwar in derselben Größe wie der Text. </p> <p> Die Beschriftung und die Klasse werden bei der Anzeige des Knotens sowie bei jeder Änderung seines Objekts berechnet; eine von anderen Objekten abhängige Markierung benötigt einen Baum, der bei einer Änderung neu aufgebaut wird (ein Eingang des Baums, der sich mit der Markierung ändert). </p>
de.haumacher.ehome.zigbee.CatalogTypeConstraint = Einschränkung des Datenpunkttyps im Katalog
de.haumacher.ehome.zigbee.CatalogTypeConstraint.tooltip = Einschränkung des empfohlenen Datenpunkttyps eines Funktionseintrags des Zigbee-Katalogs (<code>ehome.zigbee.catalog:ZigbeeFunctionEntry#type</code>): Er muss zum Werttyp der Funktion passen (<code>ZigbeeBindings#fits(String, String)</code>), wie es eine Bindung muss; ein Funktionsschlüssel, den E-Home nicht kennt (der eines neueren Controllers), nimmt jeden Typ.
de.haumacher.ehome.zigbee.ReadZigbeeDevicesAction = Zigbee-Geräte lesen
de.haumacher.ehome.zigbee.ReadZigbeeDevicesAction.tooltip = <i>View-Aktion</i>, die die Zigbee-Geräte des Controllers des Eingabeprojekts in das Projekt liest (<code>GET /api/zigbee/export</code>, alle Seiten), siehe <code>ZigbeeController#read(TLObject)</code>. <p> Das Ergebnis ist der Satz, der sagt, was importiert wurde, gefolgt von den Hinweisen des Imports. </p>
de.haumacher.ehome.zigbee.ReportingConstraint = Einschränkung der Berichte
de.haumacher.ehome.zigbee.ReportingConstraint.tooltip = Einschränkung der Vorgabe des Installateurs für die Berichte einer Zigbee-Funktion (<code>ehome.zigbee:ZigbeeFunction#reportingMin</code>, <code>reportingMax</code>, <code>reportingChange</code>): lehnt ab, was der Lader des Controllers ablehnt, mit seiner Begründung in der Sprache des Benutzers (<code>ZigbeeReporting#check(TLObject)</code>, die Prüfung, die auch die Abbildprüfung macht). <p> Die Ablehnung wird am Feld des Bestandteils gemeldet, den sie betrifft; eine, die die Vorgabe als Ganzes betrifft (die Funktion nimmt keine), an jedem Feld mit einem Wert. Die drei Felder hängen voneinander ab (ein Höchstintervall unter dem Mindestintervall), daher wird jedes erneut geprüft, wenn sich ein anderes ändert. </p>
de.haumacher.ehome.zigbee.ZigbeeCatalogJson$Mode = Modus
de.haumacher.ehome.zigbee.ZigbeeCatalogJson$Mode.tooltip = Wie der Import einen Typ behandelt, den der Katalog schon kennt.
