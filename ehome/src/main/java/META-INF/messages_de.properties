de.haumacher.ehome.zigbee.ZigbeeCatalogJson.Mode.KEEP.tooltip = Er bleibt, wie er ist: Die mit E-Home ausgelieferten Gerätetypen werden angelegt.
de.haumacher.ehome.zigbee.ZigbeeCatalogJson.Mode.UPDATE = Aktualisieren
de.haumacher.ehome.zigbee.ZigbeeCatalogJson.Mode.UPDATE.tooltip = Er übernimmt den Inhalt der Datei: Der Benutzer importiert eine Datei.
de.haumacher.ehome.zigbee.ZigbeeCatalogSeed = Ausgelieferte Zigbee-Gerätetypen
de.haumacher.ehome.zigbee.ZigbeeCatalogSeed.tooltip = Legt im Zigbee-Katalog (<i>Zigbee-Katalog</i>) die Gerätetypen an, die E-Home ausliefert: die Katalogdateien (<code>.json</code>, <i>Zigbee-Katalog-JSON</i>) in <code>WEB-INF/zigbee-catalog/</code>, jede einmal je Datenbank, so wie die Engine ihre Anfangsdaten lädt (der Start-Haken <code>InitialDataSetup</code>, der nur sein eigenes XML-Format liest). <p> Eine Datei wird beim ersten Start geladen, der sie findet, und in den Eigenschaften der Datenbank als geladen vermerkt (<code>ehome.zigbee-catalog.&lt;file&gt;</code>): Ein Typ, den der Benutzer danach löscht, kommt beim nächsten Start nicht wieder, und eine Datei, die eine spätere Version hinzufügt, wird einmal geladen. Das Laden legt nur die Typen an, die der Katalog nicht kennt (nach Hersteller und Modell); ein bekannter Typ bleibt, wie der Benutzer ihn hält. Eine Datei, die nicht gelesen werden kann oder abgelehnt wird, wird mit dem Grund protokolliert und nicht vermerkt, so dass der nächste Start es erneut versucht. </p>
de.haumacher.ehome.zigbee.ZigbeeFunctions$Builder = Erzeuger
de.haumacher.ehome.zigbee.ZigbeeFunctions$Builder.tooltip = Erzeuger einer <i>Zigbee-Funktion</i>: Die <i>Funktion</i>, unter deren Namen die Funktion registriert ist.
de.haumacher.ehome.zigbee.ZigbeeFunctions$Function = Funktion
de.haumacher.ehome.zigbee.ZigbeeFunctions$Function.tooltip = Die Funktionen, benannt so, wie sie registriert sind.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeBind = Datenpunkt an Zigbee-Funktion binden
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeBind.tooltip = <code>zigbeeBind(function, datapoint)</code>: Bindet den Anwendungsdatenpunkt an die Funktion (<code>ZigbeeBindings#bind(TLObject, TLObject)</code>); der Datenpunkt.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeBindVeto = Einwand gegen das Binden
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeBindVeto.tooltip = <code>zigbeeBindVeto(function)</code>: Warum für die Funktion kein Datenpunkt angelegt oder an sie gebunden werden kann, als Text; <code>null</code>, wenn es geht.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCandidates = Bindbare Datenpunkte
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCandidates.tooltip = <code>zigbeeCandidates(function)</code>: Die Anwendungsdatenpunkte des Projekts, die an die Funktion gebunden werden können: an keine Funktion gebunden, von einem passenden Werttyp.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCatalogExport = Zigbee-Gerätetypen exportieren
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCatalogExport.tooltip = <code>zigbeeCatalogExport(types)</code>: Die Gerätetypen (einer oder eine Liste) als Katalogdatei zum Herunterladen (<code>ZigbeeCatalogJson#export(java.util.Collection)</code>).
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCatalogImport = Zigbee-Gerätetypen importieren
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCatalogImport.tooltip = <code>zigbeeCatalogImport(catalog, file)</code>: Importiert die hochgeladene Katalogdatei in den Katalog (<code>ZigbeeCatalogJson#importFile(TLObject, Object)</code>); der Satz, der sagt, was importiert wurde.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCreateDatapoint = Datenpunkt für Zigbee-Funktion anlegen
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCreateDatapoint.tooltip = <code>zigbeeCreateDatapoint(function)</code>: Ein neuer Anwendungsdatenpunkt, an die Funktion gebunden (<code>ZigbeeBindings#createDatapoint(TLObject)</code>).
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCreateDatapoints = Datenpunkte für Zigbee-Gerät anlegen
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCreateDatapoints.tooltip = <code>zigbeeCreateDatapoints(device)</code>: Legt für jede exportierte, ungebundene und nicht ausgeblendete Funktion des Geräts einen Datenpunkt an (<code>ZigbeeBindings#createDatapoints(TLObject)</code>); der Satz, der sie nennt; mit dem Grund abgelehnt, wenn es keine gibt.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCreateDatapointsVeto = Einwand gegen das Anlegen der Datenpunkte
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCreateDatapointsVeto.tooltip = <code>zigbeeCreateDatapointsVeto(device)</code>: Warum für das Gerät kein Datenpunkt anzulegen ist, als Text; <code>null</code>, wenn es einen gibt.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeDeviceState = Zigbee-Gerätestatus
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeDeviceState.tooltip = <code>zigbeeDeviceState(device)</code>: Der Zustand des Geräts, live aus den Ereignissen des Controllers oder gemäß dem letzten Export (<code>ZigbeeStatus#deviceState(TLObject)</code>).
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeDeviceType = Zigbee-Gerätetyp
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeDeviceType.tooltip = <code>zigbeeDeviceType(device)</code>: Der Typ des Zigbee-Katalogs, der das Gerät ist, nach seinem Hersteller und Modell (<code>ZigbeeCatalog#type(TLObject)</code>); <code>null</code> bei einem unbekannten Gerät.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeFunctionHidden = Zigbee-Funktion ausgeblendet
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeFunctionHidden.tooltip = <code>zigbeeFunctionHidden(function)</code>: Ob der Typ des Geräts im Katalog die Funktion ausblendet (<code>ZigbeeCatalog#hidden(TLObject)</code>).
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeFunctionLabel = Zigbee-Funktionsbezeichnung
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeFunctionLabel.tooltip = <code>zigbeeFunctionLabel(function)</code>: Der Name der Funktion in der Sprache des Benutzers (<code>ZigbeeStatus#functionLabel(TLObject)</code>); ein unbekannter Schlüssel, wie er ist.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeFunctionOptions = Bindbare Zigbee-Funktionen
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeFunctionOptions.tooltip = <code>zigbeeFunctionOptions(datapoint)</code>: Die Funktionen, an die ein Anwendungsdatenpunkt gebunden werden kann, die Auswahl seines Feldes.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeImport = Zigbee-Geräte importieren
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeImport.tooltip = <code>zigbeeImport(project, file)</code>: Importiert den hochgeladenen Export eines Controllers in das Projekt (<code>ZigbeeImport#importFile(TLObject, Object)</code>); der Satz, der sagt, was importiert wurde, gefolgt von den Hinweisen des Imports.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeLiveProblem = Problem des Zigbee-Live-Imports
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeLiveProblem.tooltip = <code>zigbeeLiveProblem(project, refresh)</code>: Warum der letzte Live-Import fehlgeschlagen ist (<code>ZigbeeStatus#liveProblem(TLObject)</code>); <code>null</code>, wenn er nicht fehlgeschlagen ist.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeNetworkState = Zigbee-Netzwerkstatus
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeNetworkState.tooltip = <code>zigbeeNetworkState(project, refresh)</code>: Das Netzwerk des Controllers des Projekts mit dem Countdown des Beitritts (<code>ZigbeeStatus#networkState(TLObject, java.time.Instant)</code>); das zweite Argument bewirkt nur, dass der Aufrufer den Wert erneut berechnet.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeReadState = Zigbee-Lesestatus
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeReadState.tooltip = <code>zigbeeReadState(project, refresh)</code>: Wann die Geräte zuletzt gelesen wurden, live oder auf Anforderung (<code>ZigbeeStatus#readState(TLObject)</code>); <code>null</code> vor dem ersten Lesen.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeRemoveAbsent = Fehlende Zigbee-Funktionen entfernen
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeRemoveAbsent.tooltip = <code>zigbeeRemoveAbsent(device)</code>: Löscht die fehlenden Funktionen des Geräts, an die kein Datenpunkt gebunden ist (<code>ZigbeeStatus#removeAbsent(TLObject)</code>); der Satz, der sagt, was entfernt und was beibehalten wurde.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeRemoveAbsentVeto = Einwand gegen das Entfernen fehlender Funktionen
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeRemoveAbsentVeto.tooltip = <code>zigbeeRemoveAbsentVeto(device)</code>: Warum das Gerät keine fehlende Funktion zum Entfernen hat, als Text; <code>null</code>, wenn es eine hat.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeReporting = Zigbee-Berichte
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeReporting.tooltip = <code>zigbeeReporting(function)</code>: was der Controller mit den Berichten der Funktion tut, für den Benutzer (<code>ZigbeeReporting#summary(TLObject)</code>).
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeUnbind = Zigbee-Bindung lösen
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeUnbind.tooltip = <code>zigbeeUnbind(function)</code>: Hebt die Bindungen der Funktion auf; ihre Datenpunkte bleiben als Datenpunkte der Anwendung erhalten.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeUnbindVeto = Einwand gegen das Lösen der Bindung
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeUnbindVeto.tooltip = <code>zigbeeUnbindVeto(function)</code>: Warum die Bindung der Funktion nicht gelöst werden kann, als Text; <code>null</code>, wenn es geht.
de.haumacher.ehome.zigbee.ZigbeeLive$DeviceState = Gerätezustand
de.haumacher.ehome.zigbee.ZigbeeLive$DeviceState.tooltip = Der aktuelle Status eines Geräts, wie er sich aus den Ereignissen des Controllers ergibt.
de.haumacher.ehome.zigbee.ZigbeeLive.DeviceState.INTERVIEWING = Wird abgefragt
de.haumacher.ehome.zigbee.ZigbeeLive.DeviceState.INTERVIEWING.tooltip = Das Gerät hat sich verbunden, oder der Controller fragt es ab.
de.haumacher.ehome.zigbee.ZigbeeLive.DeviceState.INTERVIEW_FAILED = Abfrage fehlgeschlagen
de.haumacher.ehome.zigbee.ZigbeeLive.DeviceState.INTERVIEW_FAILED.tooltip = Die Abfrage ist fehlgeschlagen; der Controller versucht es erneut, sobald er das Gerät erkennt.
de.haumacher.ehome.zigbee.ZigbeeLive.DeviceState.LEFT = Hat das Netz verlassen
de.haumacher.ehome.zigbee.ZigbeeLive.DeviceState.LEFT.tooltip = Das Gerät hat angekündigt, das Netz zu verlassen; ein erneuter Beitritt stellt es wieder her.
de.haumacher.ehome.zigbee.ZigbeePermitAction = Zigbee-Netz zum Koppeln öffnen
de.haumacher.ehome.zigbee.ZigbeePermitAction.Config.seconds = Sekunden
de.haumacher.ehome.zigbee.ZigbeePermitAction.Config.seconds.tooltip = Die Zeit in Sekunden, für die das Netzwerk geöffnet bleibt (1..254); bei 0 wird es geschlossen.
de.haumacher.ehome.zigbee.ZigbeePermitAction.tooltip = <i>View-Aktion</i>, die das Zigbee-Netz eines Controllers zum Koppeln öffnet (<code>POST /api/zigbee/permit</code>) oder schließt, siehe <code>ZigbeeController#permit(TLObject, int)</code>. <p> Die Eingabe ist ein Controller (<code>ehome.runtime:Controller</code>) oder ein Projekt, dessen Controller gemeint ist; das Ergebnis ist der Satz, der sagt, was der Controller getan hat. </p>
de.haumacher.ehome.zigbee.ZigbeeReporting$ChangeKind = Art der Änderung
de.haumacher.ehome.zigbee.ZigbeeReporting$ChangeKind.tooltip = Wie sich die berichtenswerte Änderung einer Funktion zur Einheit des Datenpunkts verhält.
de.haumacher.ehome.zigbee.ZigbeeReporting$Member = Bestandteil
de.haumacher.ehome.zigbee.ZigbeeReporting$Member.tooltip = Der Bestandteil einer Vorgabe, den eine Ablehnung betrifft.
de.haumacher.ehome.zigbee.ZigbeeReporting.ChangeKind.FIXED = Fest
de.haumacher.ehome.zigbee.ZigbeeReporting.ChangeKind.FIXED.tooltip = Der feste Attributschritt des Controllers, der keinen festen Schritt in der Einheit des Datenpunkts hat (<code>illuminance</code>, <code>color_temperature</code>).
de.haumacher.ehome.zigbee.ZigbeeReporting.ChangeKind.NONE = Keine
de.haumacher.ehome.zigbee.ZigbeeReporting.ChangeKind.NONE.tooltip = Keine: ein diskreter Wert meldet jede Änderung (<code>on_off</code>, <code>occupancy</code>).
de.haumacher.ehome.zigbee.ZigbeeReporting.ChangeKind.UNIT = Einheit
de.haumacher.ehome.zigbee.ZigbeeReporting.ChangeKind.UNIT.tooltip = Eine Zahl in der Einheit des Datenpunkts, die eine Vorgabe setzen kann.
de.haumacher.ehome.zigbee.ZigbeeReporting.Member.CHANGE = Änderung
de.haumacher.ehome.zigbee.ZigbeeReporting.Member.CHANGE.tooltip = Die berichtenswerte Änderung.
de.haumacher.ehome.zigbee.ZigbeeReporting.Member.MAX = Höchstintervall
de.haumacher.ehome.zigbee.ZigbeeReporting.Member.MAX.tooltip = Das maximale Intervall.
de.haumacher.ehome.zigbee.ZigbeeReporting.Member.MIN = Mindestintervall
de.haumacher.ehome.zigbee.ZigbeeReporting.Member.MIN.tooltip = Das minimale Intervall.
de.haumacher.ehome.zigbee.ZigbeeReporting.Member.WHOLE = Ganzes
de.haumacher.ehome.zigbee.ZigbeeReporting.Member.WHOLE.tooltip = Die Vorgabe als Ganzes: die Funktion nimmt keine.
de.haumacher.ehome.zigbee.ZigbeeSource = Zigbee-Quelle
de.haumacher.ehome.zigbee.ZigbeeSource.tooltip = Quelle des Kanals <code>refresh</code> auf der Registerkarte „Zigbee“ eines Projekts (haumacher/ehome #64, <code>projects/zigbee.view.xml</code>): Jede Änderung des Live-Status des Controllers des Projekts (<i>Zigbee Live</i>: ein Ereignis, ein erfolgreicher oder fehlgeschlagener Live-Import) veröffentlicht einen neuen Wert, anhand dessen die Ansicht neu berechnet, was angezeigt wird; solange das Netzwerk für den Beitritt offen ist, aktualisiert sich <i>Zigbee Live</i> einmal pro Sekunde, sodass der Genehmigungs-Countdown weiterläuft. Der Kanal nimmt höchstens einmal pro Sekunde einen Wert an (sein Wert ist <code>update-interval</code>). <p> Ein Live-Import wird in einem separaten Thread durchgeführt; bevor eine Änderung veröffentlicht wird, wird die Wissensdatenbank neu abgerufen, sodass die Ansicht die Berechnung auf der Grundlage des Zustands vornimmt, den der Import hinterlassen hat. </p>
