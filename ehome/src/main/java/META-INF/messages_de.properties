de.haumacher.ehome.scan.ScanFunctions.Function.scanApply = Scannen und anwenden
de.haumacher.ehome.scan.ScanFunctions.Function.scanApply.tooltip = <code>scanApply(row, candidate)</code>: Erstellt oder aktualisiert das Gerät; bei einer eindeutigen Übereinstimmung kann die Kandidatenzeile leer sein.
