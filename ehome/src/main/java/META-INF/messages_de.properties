de.haumacher.ehome.programming.ProgramChanges = Programmänderungen
de.haumacher.ehome.programming.ProgramChanges.tooltip = Bringt ein Gerät, dessen Programm sich geändert hat, in Einklang mit dem neuen Programm, gleich welcher Code es geändert hat (das Geräteformular, haumacher/ehome #121): Die Instanzen der dynamischen Module des neuen Programms werden berechnet, und die R-Werte seiner Parameterberechnungen aus seinen L-Werten (haumacher/ehome #123), wie für ein in E-Home angelegtes Gerät. <p> Ein <i>ModificationListener</i> der Wissensbasis: Er vergleicht die Programmzuordnung jedes geänderten Geräts mit ihrem Wert beim letzten Commit (seiner historischen Version) und passt das Gerät in der <i>Modification</i> an, die er liefert und die innerhalb des Commits läuft. Eine Berechnung, die nicht ausgewertet werden kann oder fehlschlägt, lehnt den Commit mit ihrem Grund ab, sodass die Programmänderung mit ihm zurückgenommen wird. Ein in der Transaktion angelegtes Gerät berechnet sein Ersteller. </p> <p> Registriert in <code>WEB-INF/autoconf/ehome.physical.config.xml</code>. </p>
de.haumacher.ehome.programming.download.BusStateSource = Quelle für den Busstatus
de.haumacher.ehome.programming.download.BusStateSource.tooltip = Quelle einer <code>&lt;source-channel&gt;</code>, die sich ändert, sobald sich der Zustand, der darüber entscheidet, ob ein Pfad zum Bus genutzt werden kann, ändert, ohne dass eine Modelländerung vorliegt (haumacher/ehome #161): eine Bus-Sitzung über einen Controller wird eröffnet oder beendet (<code>BusSessionLink#addSessionListener(Runnable)</code>), ein Controller wird verbunden oder getrennt, oder der Status eines Controllers ändert sich hinsichtlich dessen, was er anbietet (ob er seinen Status gemeldet hat, ob seine Firmware die Bus-Sitzung führt). <p> Die Sperren der Befehle, die den Bus nutzen (<code>BusPath#veto(com.top_logic.model.TLObject)</code>), lesen diesen Laufzeitzustand aus, der durch kein Modellereignis widergespiegelt wird. Ein Befehl, der den Kanal als einen seiner <code>inputs</code> angibt, wird bei jeder Änderung des Kanals neu ausgewertet, sodass ein Befehl, der deaktiviert war, weil ein Job die Bus-Sitzung des Controllers hielt, nach Beendigung des Jobs wieder aktiviert wird – auch wenn der Job in einer anderen Ansicht oder einer anderen Sitzung ausgeführt wurde. </p> <p> Der Wert ist eine Zahl, die die Änderungen zählt; der Kanal übernimmt ihn höchstens so oft, wie es seine <code>update-interval</code> angibt. </p>
de.haumacher.ehome.programming.download.CompareJob = Vergleichsauftrag
de.haumacher.ehome.programming.download.CompareJob.tooltip = Die Funktion des Befehls „compare“ für ein Gerät (<code>&lt;start-job&gt;</code> body): Liest das Gerät auf dem <i>Buspfad</i> des Projekts (dessen Gateway oder dessen Controller) mit <i>dem Calimero-Lesegerät</i> aus (es wird nichts geschrieben) und vergleicht es mit dem Download-Image (<i>Gerätevergleich</i>). <p> Das Gerät ist das erste Objekt, mit dem der Auftrag gestartet wird (der <code>device</code> Eingang). Das Ergebnis ist ein <i>Programmierbericht</i>: die gelesenen Daten sowie pro Block des Images die „identischen“ oder abweichenden Adressen. </p>
de.haumacher.ehome.programming.download.DownloadJob = Download-Auftrag
de.haumacher.ehome.programming.download.DownloadJob.Config.kind = Art
de.haumacher.ehome.programming.download.DownloadJob.Config.kind.tooltip = Was der Download schreibt.
de.haumacher.ehome.programming.download.DownloadJob.tooltip = Die Funktionsweise des Download-Befehls eines Geräts (<code>&lt;start-job&gt;</code> Körper): plant den Download, stellt über <i>den Calimero Writer</i> eine Verbindung zum Bus auf dem <i>Buspfad</i> des Projekts (dessen Gateway oder dessen Controller) her, führt den Plan mit Fortschrittsanzeige pro Vorgang aus und speichert ihn bei Erfolg auf dem Gerät. <p> Das Gerät ist das erste Objekt, mit dem der Auftrag gestartet wird (der <code>device</code> Eingang). Das Ergebnis ist ein <i>Programmierbericht</i>. Eine Ablehnung (Schreiben deaktiviert, kein Gateway oder Controller, ein Plan mit Problemen, keine Verbindung) führt zum Fehlschlagen des Auftrags mit Angabe des Grundes; ein Fehler des Geräts ist das Ergebnis des Berichts. </p>
