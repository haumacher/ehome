de.haumacher.ehome.monitor.ConnectMonitorAction.Source.GATEWAY.tooltip = Das KNXnet/IP-Gateway des Projekts.
de.haumacher.ehome.monitor.ConnectMonitorAction.tooltip = <i>Aktion anzeigen</i>, bei der der Gruppenmonitor eines Projekts über das Gateway des Projekts (<code>ehome.project:Project#gateway</code>) oder – bei <code>source="controller"</code> – über den Monitorstrom eines HomeControl-Controllers (<i>Controller-Bus-Verbindung</i>) an den Bus angeschlossen wird, sowie die Ansicht des Monitors. <p> Die Eingabe ist das Projekt. Bei <code>source="controller"</code> kann es stattdessen ein Wörterbuch sein, das den Controller benennt (haumacher/ehome #56, <code>ControllerTarget#of</code>): <code>project</code>, <code>controller</code> (ein registrierter Controller), <code>host</code>, <code>port</code> und <code>token</code> (einer ad hoc eingegebene oder ein für den registrierten eingegebenes Token); ein Projekt allein steht für seinen eigenen Controller. Der Monitor ist der des Projekts in der Sitzung (<i>Monitor-Sitzungen</i>); einer, der noch mit demselben Gateway oder Controller verbunden ist, wird nicht erneut verbunden, einer, der mit der anderen Quelle verbunden ist, wird wieder verbunden. Die aktuelle <code>GroupMonitor#snapshot()</code> wird in den konfigurierten Kanal geschrieben und stellt das Ergebnis dar; spätere Änderungen gelangen über ihre Quelle (<i>Monitor-Quelle</i>) in den Kanal. </p>
