de.haumacher.ehome.runtime.RuleFunctions.Function.ruleSuggestions.tooltip = <code>ruleSuggestions(obj, text, caret)</code>: Was eine Referenz, ein Parameter, ein Timer, ein Zustand oder ein Funktionsname, der vor dem Cursor unvollständig geblieben ist, bezeichnen kann, soweit das Feld „obj“ dies benennen kann, als Vorschläge eines Textfeldes (<code>RuleFunctions#suggestions(TLObject, String, int)</code>); „obj“ ist der bearbeitete Teil einer Regel (oder deren Überlagerung im Formular bzw. der Entwurf eines Erstellungsdialogs).
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleSummary = Zusammenfassung eines Regelteils
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleSummary.tooltip = <code>ruleSummary(obj)</code>: Eine Zeile, die eine Reaktion, einen Auslöser, eine Aktion oder einen Zeitplaneintrag beschreibt.
de.haumacher.ehome.runtime.RuleTextNormalizer = Normalisierer für Regeltexte
de.haumacher.ehome.runtime.RuleTextNormalizer.tooltip = <i>Wertnormalisierer</i> eines Textes der Regelsprache (haumacher/ehome #60): Ein Formular speichert einen eingegebenen Ausdruck oder ein Literal in seiner kanonischen Form (<code>RuleNormalization#canonical(TLObject, String, String)</code>), also in der Form, die das Bild enthält.
de.haumacher.ehome.runtime.RuntimeFunctions$Builder = Erzeuger
de.haumacher.ehome.runtime.RuntimeFunctions$Builder.tooltip = Erzeuger einer <i>Laufzeitfunktion</i>: Die <i>Funktion</i>, unter deren Namen die Funktion registriert ist.
de.haumacher.ehome.runtime.RuntimeFunctions$Function = Funktion
de.haumacher.ehome.runtime.RuntimeFunctions$Function.tooltip = Die Funktionen, benannt so, wie sie registriert sind.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.controllerAddress = Controller-Adresse
de.haumacher.ehome.runtime.RuntimeFunctions.Function.controllerAddress.tooltip = <code>controllerAddress(controller)</code>: <code>host:port</code>.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.controllerTokenHint = Hinweis zum Controller-Token
de.haumacher.ehome.runtime.RuntimeFunctions.Function.controllerTokenHint.tooltip = <code>controllerTokenHint(controller)</code>: Gibt an, ob der Controller über ein Token verfügt, ohne das Token selbst anzugeben.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointFlagsSource = Herkunft der Datenpunkt-Flags
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointFlagsSource.tooltip = <code>datapointFlagsSource(address)</code>: Woher die Flags Beschreibbar und Beim Start lesen stammen, als Text (<code>DatapointSettings#flagsSource(TLObject)</code>).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointReadOnStart = Datenpunkt beim Start lesen
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointReadOnStart.tooltip = <code>datapointReadOnStart(address)</code>: Ob der Datenpunkt der Gruppenadresse beim Start gelesen wird (<code>DatapointSettings#readOnStart(TLObject)</code>).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointUnit = Einheit des Datenpunkts
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointUnit.tooltip = <code>datapointUnit(address)</code>: Die Einheit des Datenpunkts der Gruppenadresse (<code>DatapointSettings#unit(TLObject)</code>).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointWritable = Datenpunkt beschreibbar
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointWritable.tooltip = <code>datapointWritable(address)</code>: Ob der Datenpunkt der Gruppenadresse im Laufzeitabbild beschreibbar ist (<code>DatapointSettings#writable(TLObject)</code>).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.deleteConfirmation = Löschbestätigung
de.haumacher.ehome.runtime.RuntimeFunctions.Function.deleteConfirmation.tooltip = <code>deleteConfirmation(obj)</code>: Die Frage, die vor dem Löschen des Objekts gestellt wird und in der die Teile des Projekts genannt werden, die sich darauf beziehen, wie beispielsweise die Funktionen, Regeln und Terminplan-Einträge, die einen Datenpunkt benennen (<code>Referers#deleteConfirmation(TLObject)</code>, haumacher/ehome #94).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.deploymentConfirmation = Bestätigung der Bereitstellung
de.haumacher.ehome.runtime.RuntimeFunctions.Function.deploymentConfirmation.tooltip = <code>deploymentConfirmation(project)</code>: Die Frage vor der Bereitstellung des Projekts, mit dem, was sich von dem Abbild unterscheidet, das sein Controller speichert (<code>ImageComparison#confirmation(TLObject, Instant)</code>).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.deploymentVeto = Bereitstellungsveto
de.haumacher.ehome.runtime.RuntimeFunctions.Function.deploymentVeto.tooltip = <code>deploymentVeto(project)</code>: Warum das Projekt derzeit nicht bereitgestellt werden kann (als Text); <code>null</code>, wenn es möglich ist (<code>Deployer#veto(TLObject)</code>).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.functionRedundancy = Funktionsredundanz
de.haumacher.ehome.runtime.RuntimeFunctions.Function.functionRedundancy.tooltip = <code>functionRedundancy(function)</code>: Warum die Funktion auf dem Controller überflüssig ist (als Text); <code>null</code>, wenn dies nicht der Fall ist (<code>FunctionProposal#redundancy(TLObject)</code>, haumacher/ehome #92).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.functionWarning = Funktionswarnung
de.haumacher.ehome.runtime.RuntimeFunctions.Function.functionWarning.tooltip = <code>functionWarning(function)</code>: was an der Funktion nicht stimmt, als Text, eine Zeile je Punkt: warum sie auf dem Controller überflüssig ist (<code>FunctionProposal#redundancy(TLObject)</code>), und ihre Rollen, die kein wirksames Objekt bedient (<code>FunctionRoleCheck#problems(TLObject)</code>, haumacher/ehome #137); <code>null</code>, wenn nichts davon zutrifft.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.groupAddressIdentifierProblem = Problem des Bezeichners einer Gruppenadresse
de.haumacher.ehome.runtime.RuntimeFunctions.Function.groupAddressIdentifierProblem.tooltip = <code>groupAddressIdentifierProblem(text, address)</code>: Warum der Text nicht als Bezeichner der Gruppenadresse dienen kann (<code>GroupAddressIds#problem(Object, Object)</code>, haumacher/ehome #130); <code>null</code>, falls doch.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.groupAddressIdentifierProposal = Vorschlag der Bezeichner der Gruppenadressen
de.haumacher.ehome.runtime.RuntimeFunctions.Function.groupAddressIdentifierProposal.tooltip = <code>groupAddressIdentifierProposal(project)</code>: Die Frage, bevor die vorgeschlagenen Bezeichner den Gruppenadressen des Projekts gegeben werden, mit ihrer Liste (<code>ProposeIdentifiersAction#confirmation(TLObject)</code>, haumacher/ehome #130).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.nextImageRevision = Nächste Abbild-Revision
de.haumacher.ehome.runtime.RuntimeFunctions.Function.nextImageRevision.tooltip = <code>nextImageRevision(project)</code>: Die Revision, die die nächste Bereitstellung trägt.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeBuildingParts = Gebäudeteile des Projekts
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeBuildingParts.tooltip = <code>runtimeBuildingParts(obj)</code>: Die Teile der Gebäude des Projekts des gegebenen Objekts, die Auswahl des Raums einer Funktion.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeDatapointIdProblem = Problem der Datenpunkt-Id
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeDatapointIdProblem.tooltip = <code>runtimeDatapointIdProblem(text, datapoint)</code>: Warum der Text nicht die Id des Anwendungsdatenpunkts sein kann (<code>ApplicationDatapoints#idProblem(Object, Object)</code>); <code>null</code>, wenn er es kann.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeDatapoints = Datenpunkte des Projekts
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeDatapoints.tooltip = <code>runtimeDatapoints(obj)</code>: Die Datenpunkte des Projekts des angegebenen Objekts (einer Funktion), die Optionen der Rollen einer Funktion (haumacher/ehome #61): zunächst die Gruppenadressen nach ihrer Adresse, dann die Anwendungsdatenpunkte in ihrer Reihenfolge.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeGroupAddresses = Gruppenadressen des Projekts
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeGroupAddresses.tooltip = <code>runtimeGroupAddresses(obj)</code>: Die Gruppenadressen des Projekts des gegebenen Objekts (ein Projekt, eine Funktion), nach ihrer Adresse: die Auswahl der Rollen einer Funktion und des Zeitgebers.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeHistoryProblem = Problem des Verlaufs
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeHistoryProblem.tooltip = <code>runtimeHistoryProblem(datapoint)</code>: Was an den Verlaufseinstellungen der Gruppenadresse oder des Anwendungsdatenpunkts nicht stimmt; <code>null</code>, wenn sie passen (<code>DatapointSettings#historyProblem</code>).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeHostNameProblem = Problem des Hostnamens
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeHostNameProblem.tooltip = <code>runtimeHostNameProblem(text)</code>: Warum der Text kein Hostname ist; <code>null</code> für einen leeren Text oder einen Hostnamen.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeIdentifierProblem = Problem der Kennung
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeIdentifierProblem.tooltip = <code>runtimeIdentifierProblem(text)</code>: Warum der Text keine Kennung des Laufzeitabbilds ist; <code>null</code> für einen leeren Text oder eine Kennung.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeLabelProblem = Problem der Bezeichnungslänge
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeLabelProblem.tooltip = <code>runtimeLabelProblem(label, obj)</code>: Warum die für das Objekt eingegebene Bezeichnung für den Controller zu lang ist (<code>LabelLimit#problem(Object, Object)</code>); <code>null</code>, wenn dies nicht der Fall ist.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeParameterIdProblem = Problem der Parameter-ID
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeParameterIdProblem.tooltip = <code>runtimeParameterIdProblem(text, parameter)</code>: Warum der Text nicht die ID des Regelparameters sein kann (<code>RuleExport#parameterIdProblem(Object, Object)</code>); <code>null</code>, wenn er es kann.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeTimeMasterProblem = Problem des Zeitgebers
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeTimeMasterProblem.tooltip = <code>runtimeTimeMasterProblem(address, project, attribute)</code>: Die Prüfung der Adressen des Zeitgebers (<code>timeMasterTime</code>, <code>timeMasterDate</code>, <code>timeMasterDateTime</code>), siehe <code>#timeMasterConstraint(Object, Object, String)</code>.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeTimeZoneProblem = Problem der Zeitzone
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeTimeZoneProblem.tooltip = <code>runtimeTimeZoneProblem(text)</code>: Warum der Text keine POSIX-TZ-Angabe ist; <code>null</code> für einen leeren Text oder eine solche Angabe.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeUnitProblem = Problem der Einheit
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeUnitProblem.tooltip = <code>runtimeUnitProblem(text)</code>: Warum der Text nicht die Einheit eines Datenpunkts sein kann; <code>null</code> für einen leeren Text oder eine Einheit.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.unloadConfirmation = Bestätigung des Entladens
de.haumacher.ehome.runtime.RuntimeFunctions.Function.unloadConfirmation.tooltip = <code>unloadConfirmation(project)</code>: Die Frage vor dem Entladen des Abbilds aus dem Controller des Projekts, mit dem, was der Controller ausführt (<code>ControllerStatus#drift(TLObject)</code>).
de.haumacher.ehome.runtime.StateDatapoints = Zustandsdatenpunkte
de.haumacher.ehome.runtime.StateDatapoints.tooltip = Gibt jeder Regel den Datenpunkt ihres Zustands (haumacher/ehome #140, homecontrol <code>spec/rules.md</code> 8.8): den Teil <code>ehome.runtime:Rule#stateDatapoint</code>, ein <code>ehome.runtime:RuleStateDatapoint</code>, den ein Auslöser, ein virtuelles Gerät oder eine Bedienseite für den Datenpunkt <code>rule/&lt;id&gt;/state</code> nennt. Das Abbild hat diesen Datenpunkt, solange die Regel Zustände hat; ein Verweis einer Regel ohne Zustände darauf wird dort an seinem Feld abgelehnt. <p> Ein <i>ModificationListener</i> der Wissensbasis: Welcher Code auch immer eine Regel oder einen Zustand einer Regel anlegt, der Commit erhält den Zustandsdatenpunkt der Regel in der Modifikation, die die Wissensbasis innerhalb des Commits ausführt. Beim Start erhalten die ohne ihn gespeicherten Regeln ihren in einer eigenen Transaktion. </p> <p> Registriert in <code>WEB-INF/autoconf/ehome.runtime.config.xml</code>. </p>
de.haumacher.ehome.runtime.UnloadRuntimeImageAction = Laufzeitabbild entladen
de.haumacher.ehome.runtime.UnloadRuntimeImageAction.tooltip = <i>View-Aktion</i>, die das Laufzeitabbild entlädt, das der Controller des Eingabeprojekts (<code>ehome.project:Project</code>) ausführt (<code>DELETE /api/image</code>), siehe <code>Deployer#unload(TLObject, Instant)</code>. <p> Das Ergebnis ist das aufgezeichnete Entladen (eine als Entladen markierte <code>ehome.runtime:Deployment</code>), erfolgreich oder nicht: Eine Ablehnung ist ein Ergebnis, das angezeigt wird, kein Fehler des Befehls. </p>
de.haumacher.ehome.runtime.ValueTypes$Unsupported = Nicht unterstützt
de.haumacher.ehome.runtime.ValueTypes$Unsupported.tooltip = Warum unterstützt der Controller einen bestimmten Datenpunkttyp nicht?
de.haumacher.ehome.runtime.ValueTypes.Unsupported.MAIN_TYPE = Haupttyp
de.haumacher.ehome.runtime.ValueTypes.Unsupported.MAIN_TYPE.tooltip = Ein Haupttyp ohne Codec.
de.haumacher.ehome.runtime.ValueTypes.Unsupported.RGB = RGB
de.haumacher.ehome.runtime.ValueTypes.Unsupported.RGB.tooltip = 232, ausgenommen 232.600.
de.haumacher.ehome.runtime.ValueTypes.Unsupported.RGBW = RGBW
de.haumacher.ehome.runtime.ValueTypes.Unsupported.RGBW.tooltip = 251, ausgenommen 251.600.
de.haumacher.ehome.runtime.ValueTypes.Unsupported.STATUS_WITH_MODE = Status mit Modus
de.haumacher.ehome.runtime.ValueTypes.Unsupported.STATUS_WITH_MODE.tooltip = 6.020.
de.haumacher.ehome.scan.CatalogMatch$Kind = Art
de.haumacher.ehome.scan.CatalogMatch$Kind.tooltip = Die Art einer Zuordnung.
de.haumacher.ehome.scan.CatalogMatch.Kind.CHOICE = Auswahl
de.haumacher.ehome.scan.CatalogMatch.Kind.CHOICE.tooltip = Der Benutzer wählt aus mehreren Kandidaten aus.
de.haumacher.ehome.scan.CatalogMatch.Kind.UNIDENTIFIED = Nicht identifiziert
de.haumacher.ehome.scan.CatalogMatch.Kind.UNIDENTIFIED.tooltip = Kein Kandidat.
de.haumacher.ehome.scan.CatalogMatch.Kind.UNIQUE = Eindeutig
de.haumacher.ehome.scan.CatalogMatch.Kind.UNIQUE.tooltip = Genau ein Kandidat.
de.haumacher.ehome.scan.FoundDevice$Source = Quelle
de.haumacher.ehome.scan.FoundDevice$Source.tooltip = Wie ein Gerät erreicht wurde.
de.haumacher.ehome.scan.FoundDevice.Source.BUS = Bus
de.haumacher.ehome.scan.FoundDevice.Source.BUS.tooltip = Punkt-zu-Punkt-Verbindung über den Bus (Verwaltungsverbindung).
de.haumacher.ehome.scan.FoundDevice.Source.LOCAL = Lokal
de.haumacher.ehome.scan.FoundDevice.Source.LOCAL.tooltip = Das Gateway selbst über die lokale Geräteverwaltung von KNXnet/IP.
de.haumacher.ehome.scan.InstallationBuilder$Action = Aktion
de.haumacher.ehome.scan.InstallationBuilder$Action.tooltip = Was ist mit einem Gerät passiert?
de.haumacher.ehome.scan.InstallationBuilder.Action.CONFLICT = Konflikt
de.haumacher.ehome.scan.InstallationBuilder.Action.CONFLICT.tooltip = Ein Gerät mit dieser Adresse ist bereits in einem anderen Programm vorhanden; es wurden keine Änderungen vorgenommen.
de.haumacher.ehome.scan.InstallationBuilder.Action.CREATED = Angelegt
de.haumacher.ehome.scan.InstallationBuilder.Action.CREATED.tooltip = Das Gerät wurde angelegt.
de.haumacher.ehome.scan.InstallationBuilder.Action.UPDATED = Aktualisiert
de.haumacher.ehome.scan.InstallationBuilder.Action.UPDATED.tooltip = Ein Gerät mit dieser Adresse existierte bereits und führt dasselbe Programm aus; es wurde aktualisiert.
de.haumacher.ehome.scan.LedJob = Programmier-LED schalten
de.haumacher.ehome.scan.LedJob.Config.on = Ein
de.haumacher.ehome.scan.LedJob.Config.on.tooltip = Ob der Programmiermodus aktiviert (oder deaktiviert) werden soll.
de.haumacher.ehome.scan.LedJob.tooltip = Die Befehle „LED ein“ / „LED aus“ eines durch einen Scan gefundenen Geräts bewirken Folgendes: Sie schalten den Programmiermodus des Geräts um, sodass dessen Programmier-LED anzeigt, um welches Gerät der Anlage es sich handelt (haumacher/ehome #9). <p> Dies schreibt in das Gerät, daher läuft der Vorgang über <i>den Calimero-Writer</i>, der den Vorgang ablehnt, sofern das Schreiben für die Installation nicht eingeschaltet ist (die Konfigurationsvariable <code>tl_ehome_programming_write_enabled</code>). Der Programmiermodus ist die Eigenschaft 54 des Geräteobjekts; ein Gerät der BCU 1 (Maske 001x) speichert ihn im Bit 0 des Speicherbytes 0060 mit gerader Parität in Bit 7, so wie <code>ManagementProcedures#setProgrammingMode</code> ihn schreibt. Der Zustand wird anschließend zurückgelesen. </p>
de.haumacher.ehome.scan.ReadBackJob = Konfiguration einlesen
de.haumacher.ehome.scan.ReadBackJob.tooltip = Die Funktionsweise des Befehls „Konfiguration lesen“ für ein durch einen Scan gefundenes Gerät (<code>&lt;start-job&gt;</code> von <code>projects/scan.view.xml</code>): Liest den Speicher des Geräts über das Gateway des Projekts mit <i>dem Calimero-Reader</i> aus (es wird nichts geschrieben), dekodiert ihn in einer Transaktion in das Gerät des Projekts (<i>zurücklesen</i>) und protokolliert, dass das Gerät den Zustand des Projekts enthält (wie bei einem Download: <code>loaded</code>, <code>lastDownload</code>, <code>downloadRevision</code>). <p> Der Vorgang wird mit der Zeile des Geräts gestartet (siehe <i>Scan-Zeilen</i>). Das Ergebnis ist ein <i>Programmierbericht</i>: Was wurde gelesen und dekodiert, und stimmt das zurückgelesene Abbild des Geräts mit dem gelesenen Speicher überein? </p>
de.haumacher.ehome.scan.ScanFunctions$Builder = Erzeuger
de.haumacher.ehome.scan.ScanFunctions$Builder.tooltip = Ersteller einer <i>Scan-Funktion</i>: Die <i>Funktion</i> mit dem angegebenen Namen wird registriert.
de.haumacher.ehome.scan.ScanFunctions$Function = Funktion
de.haumacher.ehome.scan.ScanFunctions$Function.tooltip = Die Funktionen, benannt so, wie sie registriert sind.
de.haumacher.ehome.scan.ScanFunctions.Function.scanApply = Scannen und anwenden
de.haumacher.ehome.scan.ScanFunctions.Function.scanApply.tooltip = <code>scanApply(row, candidate)</code>: Erstellt oder aktualisiert das Gerät; bei einer eindeutigen Übereinstimmung kann die Kandidatenzeile leer sein.
de.haumacher.ehome.scan.ScanFunctions.Function.scanApplyVeto = Grund gegen Anlegen
de.haumacher.ehome.scan.ScanFunctions.Function.scanApplyVeto.tooltip = <code>scanApplyVeto(row)</code>: Warum das Gerät nicht angelegt oder aktualisiert werden kann.
de.haumacher.ehome.scan.ScanFunctions.Function.scanLedConfirmation = Bestätigung der Programmier-LED
de.haumacher.ehome.scan.ScanFunctions.Function.scanLedConfirmation.tooltip = <code>scanLedConfirmation(row, on)</code>: Die Frage vor dem Wechsel in den Programmiermodus.
de.haumacher.ehome.scan.ScanFunctions.Function.scanLedVeto = Grund gegen Programmier-LED
de.haumacher.ehome.scan.ScanFunctions.Function.scanLedVeto.tooltip = <code>scanLedVeto(row)</code>: Warum lässt sich der Programmiermodus nicht umschalten?
de.haumacher.ehome.scan.ScanFunctions.Function.scanReadVeto = Grund gegen Einlesen
de.haumacher.ehome.scan.ScanFunctions.Function.scanReadVeto.tooltip = <code>scanReadVeto(row)</code>: Warum die Konfiguration nicht zurückgelesen werden kann.
de.haumacher.ehome.scan.ScanFunctions.Function.scanRefresh = Scan aktualisieren
de.haumacher.ehome.scan.ScanFunctions.Function.scanRefresh.tooltip = <code>scanRefresh(rows)</code>: Die Zeilen, in denen der Status im Projekt neu berechnet wurde.
de.haumacher.ehome.scan.ScanFunctions.Function.scanRematch = Erneut zuordnen
de.haumacher.ehome.scan.ScanFunctions.Function.scanRematch.tooltip = <code>scanRematch(project)</code>: Das Ergebnis einer erneuten Zuordnung der nicht identifizierten Geräte des Projekts.
de.haumacher.ehome.scan.ScanFunctions.Function.scanVeto = Grund gegen Suche
de.haumacher.ehome.scan.ScanFunctions.Function.scanVeto.tooltip = <code>scanVeto(project, area, line, routers, gateway, programming)</code>: Warum der Scan abgelehnt wird.
de.haumacher.ehome.scan.ScanJob = Installation einlesen
de.haumacher.ehome.scan.ScanJob.tooltip = Die Funktion des Befehls „Installation auslesen“ (<code>&lt;start-job&gt;</code> von <code>projects/scan.view.xml</code>): Scannt den Bus hinter dem Gateway des Projekts mit <i>einem Busscanner</i> (es wird nichts geschrieben), gleicht jedes gefundene Gerät mit dem Katalog ab (<i>Katalogabgleich</i>) und behält die nicht identifizierten Geräte im Projekt (<code>InstallationBuilder#recordUnidentified(TLObject, FoundDevice, String)</code>). <p> Der Auftrag wird mit dem Projekt, dem Bereich und der zu scannenden Leitung (leer: keine Leitung) gestartet, wobei angegeben wird, ob nach Routern gesucht, das Gateway über die lokale Geräteverwaltung ausgelesen und nach Geräten im Programmiermodus gesucht werden soll. Das Ergebnis ist ein Wörterbuch: <code>summary</code>, <code>rows</code> (siehe <i>Scan-Zeilen</i>) und <code>notes</code> (was nicht gelesen werden konnte). </p>
de.haumacher.ehome.settings.LocalNetworkVeto$Builder = Erzeuger
de.haumacher.ehome.settings.LocalNetworkVeto$Builder.tooltip = Erzeuger der Funktion <i>localNetworkVeto()</i>.
de.haumacher.ehome.settings.OperatorSettings$Config = Konfiguration
de.haumacher.ehome.settings.OperatorSettings$Config.tooltip = Die Konfiguration der Betreibereinstellungen.
de.haumacher.ehome.settings.OperatorSettings.Config.local-network = Lokale Netze erreichbar
de.haumacher.ehome.settings.OperatorSettings.Config.local-network.tooltip = Ob diese Installation die lokalen Netze ihres Servers erreicht: die Suche nach KNX-Gateways und ihren Netzwerkschnittstellen, eine Verbindung zu einer Gateway-Adresse (Monitor, Programmierung, Scan), die Suche nach Controllern und ein Controller, der über Host und Token erreicht wird. Aus (eine gehostete Installation): All das wird abgelehnt; was über die Verbindung geht, die ein registrierter Controller selbst öffnet, bleibt.
de.haumacher.ehome.settings.OperatorSettings.Config.programming-write-enabled = Schreiben beim Programmieren erlaubt
de.haumacher.ehome.settings.OperatorSettings.Config.programming-write-enabled.tooltip = Ob E-Home auf den KNX-Bus schreibt: Downloads, die physikalische Adresse, die Programmier-LED. Aus: Jeder Schreibvorgang wird abgelehnt (<code>CalimeroWriter</code>, die einzige Klasse, die auf den Bus schreibt).
de.haumacher.ehome.simulation.Simulation$Kind = Art
de.haumacher.ehome.simulation.Simulation$Kind.tooltip = Ein Eintrag der Art <code>Simulation#timeline()</code>.
de.haumacher.ehome.simulation.Simulation.Kind.CLOCK = Uhr
de.haumacher.ehome.simulation.Simulation.Kind.CLOCK.tooltip = Die Uhr wurde vorgestellt, die Simulation wurde gestartet oder angehalten.
de.haumacher.ehome.simulation.Simulation.Kind.COMMAND = Befehl
de.haumacher.ehome.simulation.Simulation.Kind.COMMAND.tooltip = Eine Regel hat einen Datenpunkt befohlen.
de.haumacher.ehome.simulation.Simulation.Kind.PARAMETER = Parameter
de.haumacher.ehome.simulation.Simulation.Kind.PARAMETER.tooltip = Der Wert eines Regelparameters hat sich geändert.
de.haumacher.ehome.simulation.Simulation.Kind.PROBLEM = Problem
de.haumacher.ehome.simulation.Simulation.Kind.PROBLEM.tooltip = Ein Telegramm änderte nichts, ein Befehl wurde abgelehnt, der Bus versagte.
de.haumacher.ehome.simulation.Simulation.Kind.RECEIVED = Erhalten
de.haumacher.ehome.simulation.Simulation.Kind.RECEIVED.tooltip = Ein Gruppentelegramm, das vom Bus empfangen wurde.
de.haumacher.ehome.simulation.Simulation.Kind.RULE = Regel
de.haumacher.ehome.simulation.Simulation.Kind.RULE.tooltip = Ein Protokolleintrag zu einer Regel (<code>spec/rules.md</code> 9.2).
de.haumacher.ehome.simulation.Simulation.Kind.SCHEDULE = Zeitplan
de.haumacher.ehome.simulation.Simulation.Kind.SCHEDULE.tooltip = Eine Protokollzeile des Schedulers.
de.haumacher.ehome.simulation.Simulation.Kind.SENT = Gesendet
