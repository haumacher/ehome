de.haumacher.ehome.runtime.ProposeFunctionsAction = Funktionen vorschlagen
de.haumacher.ehome.runtime.ProposeFunctionsAction.tooltip = <i>View-Aktion</i>, die dem Eingabeprojekt (<code>ehome.project:Project</code>) die Funktionen hinzufügt, die der <i>Funktionsvorschlag</i> vorschlägt und die dem Projekt fehlen. <p> Das Ergebnis ist der Text einer Benachrichtigung (<code>#summary(FunctionProposal.Run)</code>): wie viele benutzte und wie viele unbenutzte Funktionen hinzugefügt wurden, wie viele vorhandene aktualisiert wurden (haumacher/ehome #98), und die Warnungen zur Verdrahtung der vorgeschlagenen Funktionen. </p>
de.haumacher.ehome.runtime.ProposeIdentifiersAction = Aktion „Bezeichner vorschlagen“
de.haumacher.ehome.runtime.ProposeIdentifiersAction.tooltip = <i>View-Aktion</i>, die den Gruppenadressen des Eingabeprojekts (<code>ehome.project:Project</code>) ohne Bezeichner die von <code>GroupAddressIds#propose(TLObject)</code> vorgeschlagenen gibt (haumacher/ehome #130), in einer Transaktion; die Regeln, die sie nennen, folgen (<i>IdRenames</i>). <p> Das Ergebnis ist ein Satz, der sagt, wie viele Adressen einen Bezeichner erhalten haben, für eine Benachrichtigung. Der Befehl fragt zuvor mit <code>#confirmation(TLObject)</code>, die den Vorschlag auflistet. </p>
de.haumacher.ehome.runtime.RuleConstraint = Prüfung eines Regelfelds
de.haumacher.ehome.runtime.RuleConstraint.Config.syntax = Syntax
de.haumacher.ehome.runtime.RuleConstraint.Config.syntax.tooltip = Ob die Prüfung die der Syntax ist (ein Fehler) statt der Ablehnungen des Controllers (eine Warnung).
de.haumacher.ehome.runtime.RuleConstraint.tooltip = <i>Prüfung</i> eines Feldes einer Regel oder eines Zeitplaneintrags (haumacher/ehome #57): Das Feld wird abgelehnt, wie der Controller es ablehnen würde (<code>RuleExport#fieldProblem(Object, String, Object, boolean)</code>). <p> Mit <i>„Syntax“</i> prüft sie, ob der Text ein Ausdruck oder Literal der Regelsprache ist, ein Fehler (ein Text, der sich nicht lesen lässt, wird nicht gespeichert); ohne meldet sie die Ablehnung durch den Lader des Controllers als Warnung (eine Regel darf halbfertig gespeichert werden). Die Prüfung hängt von jedem Feld des Objekts ab, zu dem das Feld gehört (ein Wert wird gegen den Datenpunkt seiner Aktion geprüft), sodass ein Formular ein Feld erneut prüft, wenn sich ein anderes Feld des Objekts ändert. </p> <p> Der Ausgang eines Zeitplaneintrags, den der Lader annimmt, wird außerdem abgelehnt, wenn er ein schreibbarer Anwendungsdatenpunkt ist (<code>ApplicationDatapoints#outputProblem(Object, Object)</code>): Der Controller lehnt Befehle an ihn ab. </p>
