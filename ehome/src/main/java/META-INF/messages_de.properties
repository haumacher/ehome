de.haumacher.ehome.monitor.MonitorSource.tooltip = Quelle des Kanals <code>state</code> des Gruppenmonitors (<code>projects/monitor.view.xml</code>): Solange die Ansicht angezeigt wird, veröffentlicht jede Änderung des Projektmonitors in der Sitzung (<i>Monitorsitzungen</i>) ihren Snapshot, wobei die Texte in der Sprache des Benutzers angezeigt werden, der die Ansicht aufruft. Ein Abonnement veröffentlicht den aktuellen Snapshot sofort, sodass eine erneut angezeigte Ansicht (oder eine erneut geladene Seite) den Monitor so zeigt, wie er gerade ist – unabhängig davon, ob er verbunden ist oder nicht. Der Kanal nimmt höchstens alle <code>update-interval</code> ms einen Wert an. <p> Der Monitor bleibt mit dem Bus verbunden, solange seine Seite geöffnet ist, auch wenn seine Registerkarte ausgeblendet ist. Wenn das letzte Fenster, in dem er angezeigt wurde, geschlossen wird, wird der Monitor vom Bus getrennt, sodass eine geschlossene Seite keine Tunnelverbindung zum Gateway aufrechterhält. Das geöffnete Fenster ist seine Untersitzung, wie in den <code>ChannelSource</code> Dokumenten der Engine beschrieben (TL #30088): Das erste Abonnement in einem Fenster bindet eine <i>Fensterbindung</i> an den Monitor, wodurch dieser verbunden bleibt, solange die Ansicht ausgeblendet ist, und dem die Untersitzung mitteilt, wann sie endet – das Fenster wurde geschlossen, die Seite wurde entladen und nicht wieder geladen, der Client blieb fern (TL #29869) oder die Sitzung wurde beendet. </p>
