de.haumacher.ehome.scan.InstallationBuilder.Action.UPDATED = Aktualisiert
de.haumacher.ehome.scan.InstallationBuilder.Action.UPDATED.tooltip = Ein Gerät mit dieser Adresse existierte bereits und führt dasselbe Programm aus; es wurde aktualisiert.
de.haumacher.ehome.scan.LedJob = Programmier-LED schalten
de.haumacher.ehome.scan.LedJob.Config.on = Ein
de.haumacher.ehome.scan.LedJob.Config.on.tooltip = Ob der Programmiermodus aktiviert (oder deaktiviert) werden soll.
de.haumacher.ehome.scan.LedJob.tooltip = Die Befehle „LED ein“ / „LED aus“ eines durch einen Scan gefundenen Geräts bewirken Folgendes: Sie schalten den Programmiermodus des Geräts um, sodass dessen Programmier-LED anzeigt, um welches Gerät der Anlage es sich handelt (haumacher/ehome #9). <p> Dies schreibt in das Gerät, daher läuft der Vorgang über <i>den Calimero-Writer</i>, der den Vorgang ablehnt, sofern das Schreiben für die Anwendung nicht aktiviert ist (<code>-Dehome.programming.writeEnabled=true</code>). Der Programmiermodus ist die Eigenschaft 54 des Geräteobjekts; ein Gerät der BCU 1 (Maske 001x) speichert ihn im Bit 0 des Speicherbytes 0060 mit gerader Parität in Bit 7, so wie <code>ManagementProcedures#setProgrammingMode</code> ihn schreibt. Der Zustand wird anschließend zurückgelesen. </p>
de.haumacher.ehome.scan.ReadBackJob = Konfiguration einlesen
de.haumacher.ehome.scan.ReadBackJob.tooltip = Die Funktionsweise des Befehls „Konfiguration lesen“ für ein durch einen Scan gefundenes Gerät (<code>&lt;start-job&gt;</code> von <code>projects/scan.view.xml</code>): Liest den Speicher des Geräts über das Gateway des Projekts mit <i>dem Calimero-Reader</i> aus (es wird nichts geschrieben), dekodiert ihn in einer Transaktion in das Gerät des Projekts (<i>zurücklesen</i>) und protokolliert, dass das Gerät den Zustand des Projekts enthält (wie bei einem Download: <code>loaded</code>, <code>lastDownload</code>, <code>downloadRevision</code>). <p> Der Vorgang wird mit der Zeile des Geräts gestartet (siehe <i>Scan-Zeilen</i>). Das Ergebnis ist ein <i>Programmierbericht</i>: Was wurde gelesen und dekodiert, und stimmt das zurückgelesene Abbild des Geräts mit dem gelesenen Speicher überein? </p>
de.haumacher.ehome.scan.ScanFunctions$Builder = Erzeuger
de.haumacher.ehome.scan.ScanFunctions$Builder.tooltip = Ersteller einer <i>Scan-Funktion</i>: Die <i>Funktion</i> mit dem angegebenen Namen wird registriert.
