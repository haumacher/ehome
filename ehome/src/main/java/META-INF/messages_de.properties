de.haumacher.ehome.runtime.BlockDiagnosticsAction = Diagnose eines virtuellen Geräts
de.haumacher.ehome.runtime.BlockDiagnosticsAction.tooltip = <i>View-Aktion</i>, die die Diagnose eines virtuellen Geräts (<code>ehome.runtime:BlockInstance</code>) vom Controller seines Projekts liest (<code>BlockDiagnostics#read(TLObject)</code>, haumacher/ehome #78). <p> Das Ergebnis ist ein Wörterbuch mit der Instanz (<code>block</code>) und dem Text (<code>text</code>), sodass eine Ansicht den Text nur zeigt, solange die Instanz ausgewählt ist, für die er gelesen wurde. </p>
de.haumacher.ehome.runtime.BlockFunctions$Builder = Erzeuger
de.haumacher.ehome.runtime.BlockFunctions$Builder.tooltip = Der Erzeuger einer Funktion von <i>BlockFunctions</i>.
de.haumacher.ehome.runtime.BlockFunctions$Function = Funktion
de.haumacher.ehome.runtime.BlockFunctions$Function.tooltip = Die Funktionen, benannt so, wie sie registriert sind.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockAdjustable = blockAdjustable
de.haumacher.ehome.runtime.BlockFunctions.Function.blockAdjustable.tooltip = <code>blockAdjustable(parameter)</code>: ob der Bewohner dies ändern darf.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockAggregated = blockAggregated
de.haumacher.ehome.runtime.BlockFunctions.Function.blockAggregated.tooltip = <code>blockAggregated(port)</code>: Gibt an, ob es sich um eine Eingabe handelt, die mehrere Datenpunkte bindet.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockAggregationOptions = blockAggregationOptions
de.haumacher.ehome.runtime.BlockFunctions.Function.blockAggregationOptions.tooltip = <code>blockAggregationOptions(port)</code>: die Bezeichnungen der Zusammenfassungen, die er erlaubt.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockAggregationValue = blockAggregationValue
de.haumacher.ehome.runtime.BlockFunctions.Function.blockAggregationValue.tooltip = <code>blockAggregationValue(port)</code>: die Bezeichnung der geltenden Zusammenfassung (gesetzt oder Vorgabe).
de.haumacher.ehome.runtime.BlockFunctions.Function.blockAllRoomInstances = blockAllRoomInstances
de.haumacher.ehome.runtime.BlockFunctions.Function.blockAllRoomInstances.tooltip = <code>blockAllRoomInstances(part)</code>: Die virtuellen Geräte eines Gebäudeteils und all seiner Unterteile, in der Reihenfolge des Projekts.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockApplyAggregation = blockApplyAggregation
de.haumacher.ehome.runtime.BlockFunctions.Function.blockApplyAggregation.tooltip = <code>blockApplyAggregation(port, label)</code>: setzt die Zusammenfassung der Bezeichnung (Seiteneffekte); die Vorgabe des Anschlusses oder eine leere Eingabe entfernt sie.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockApplyValue = blockApplyValue
de.haumacher.ehome.runtime.BlockFunctions.Function.blockApplyValue.tooltip = <code>blockApplyValue(parameter, value)</code>: setzt den eingegebenen Wert (Seiteneffekte); die Vorgabe des Typs oder eine leere Eingabe entfernt den Wert. Der Grund, aus dem er abgelehnt wird, <code>null</code>, wenn er übernommen wird.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockBind = blockBind
de.haumacher.ehome.runtime.BlockFunctions.Function.blockBind.tooltip = <code>blockBind(port, datapoint)</code>: Bindet den Datenpunkt an den Port (Nebenwirkungen).
de.haumacher.ehome.runtime.BlockFunctions.Function.blockBindingOptions = blockBindingOptions
de.haumacher.ehome.runtime.BlockFunctions.Function.blockBindingOptions.tooltip = <code>blockBindingOptions(port)</code>: Die Datenpunkte des Projekts, an die der Port gebunden werden kann: vom Typ „Eingabe“ (Eingabe) oder „Befehle“ (Ausgabe), nicht die der Instanz selbst, noch nicht gebunden.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockBindingUnit = blockBindingUnit
de.haumacher.ehome.runtime.BlockFunctions.Function.blockBindingUnit.tooltip = <code>blockBindingUnit(port, datapoint)</code>: die Einheit des Datenpunkts, mit einem Hinweis, wo er keine hat und der Anschluss eine.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockChoiceOptions = blockChoiceOptions
de.haumacher.ehome.runtime.BlockFunctions.Function.blockChoiceOptions.tooltip = <code>blockChoiceOptions(parameter)</code>: die Bezeichnungen seiner Auswahlwerte in der Reihenfolge des Manifests.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockCreate = blockCreate
de.haumacher.ehome.runtime.BlockFunctions.Function.blockCreate.tooltip = <code>blockCreate(project, key, room)</code>: ein neues virtuelles Gerät des Typs „im Raum“ (Nebenwirkungen).
de.haumacher.ehome.runtime.BlockFunctions.Function.blockDefault = blockDefault
de.haumacher.ehome.runtime.BlockFunctions.Function.blockDefault.tooltip = <code>blockDefault(parameter)</code>: Der Standardwert des Typs.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockEditValue = blockEditValue
de.haumacher.ehome.runtime.BlockFunctions.Function.blockEditValue.tooltip = <code>blockEditValue(parameter)</code>: der Wert, den seine Eingabe zeigt, der Wert des Abbilds (gesetzt oder Vorgabe) in der Form von <code>BlockValues#editValue</code>.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockEffective = blockEffective
de.haumacher.ehome.runtime.BlockFunctions.Function.blockEffective.tooltip = <code>blockEffective(parameter)</code>: Der Wert, den das Bild zuweist (festgelegt oder Standardwert).
de.haumacher.ehome.runtime.BlockFunctions.Function.blockHelp = Hilfetext eines Anschlusses oder Parameters
de.haumacher.ehome.runtime.BlockFunctions.Function.blockHelp.tooltip = <code>blockHelp(portOrParameter)</code>: Der Hilfetext in der Sprache des Benutzers (haumacher/ehome #101), wobei die Absätze durch eine Leerzeile voneinander getrennt sind; <code>null</code>, wenn E-Home keinen Hilfetext enthält.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockInputPorts = blockInputPorts
de.haumacher.ehome.runtime.BlockFunctions.Function.blockInputPorts.tooltip = <code>blockInputPorts(instance)</code>: seine Eingangsanschlüsse in der Reihenfolge, wie sie im Manifest aufgeführt sind.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockLabel = blockLabel
de.haumacher.ehome.runtime.BlockFunctions.Function.blockLabel.tooltip = <code>blockLabel(portOrParameter)</code>: die Bezeichnung in der Sprache des Benutzers.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockOutputPorts = blockOutputPorts
de.haumacher.ehome.runtime.BlockFunctions.Function.blockOutputPorts.tooltip = <code>blockOutputPorts(instance)</code>: seine Ausgabeports in der Reihenfolge, wie sie im Manifest aufgeführt sind.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockParameterKind = blockParameterKind
de.haumacher.ehome.runtime.BlockFunctions.Function.blockParameterKind.tooltip = <code>blockParameterKind(parameter)</code>: wie er eingegeben wird, <code>boolean</code>, <code>choice</code>, <code>duration</code>, <code>time</code> oder <code>number</code>.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockPortBindings = blockPortBindings
de.haumacher.ehome.runtime.BlockFunctions.Function.blockPortBindings.tooltip = <code>blockPortBindings(port)</code>: die IDs der zugehörigen Datenpunkte, wobei ein gelöschter Datenpunkt markiert ist.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockPortInfo = blockPortInfo
de.haumacher.ehome.runtime.BlockFunctions.Function.blockPortInfo.tooltip = <code>blockPortInfo(port)</code>: Richtung, Typ, Einheit, Anzahl der Datenpunkte und deren Aggregationen.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockProblem = blockProblem
de.haumacher.ehome.runtime.BlockFunctions.Function.blockProblem.tooltip = <code>blockProblem(instance)</code>: Was das Bild von der Instanz zurückweist, <code>null</code> für nichts.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockRange = blockRange
de.haumacher.ehome.runtime.BlockFunctions.Function.blockRange.tooltip = <code>blockRange(parameter)</code>: seine Grenzen oder Auswahlmöglichkeiten.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockRoomInstances = blockRoomInstances
de.haumacher.ehome.runtime.BlockFunctions.Function.blockRoomInstances.tooltip = <code>blockRoomInstances(part)</code>: Die virtuellen Geräte eines Gebäudeteils.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockTypeLabel = blockTypeLabel
de.haumacher.ehome.runtime.BlockFunctions.Function.blockTypeLabel.tooltip = <code>blockTypeLabel(key)</code>: Der Typ des Schlüssels in der Sprache des Benutzers mit der entsprechenden Version.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockTypeOptions = blockTypeOptions
de.haumacher.ehome.runtime.BlockFunctions.Function.blockTypeOptions.tooltip = <code>blockTypeOptions(obj)</code>: Die Schlüssel der Blocktypen, über die E-Home verfügt.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockUnit = blockUnit
de.haumacher.ehome.runtime.BlockFunctions.Function.blockUnit.tooltip = <code>blockUnit(parameter)</code>: die Einheit, in der sein Wert gezeigt und eingegeben wird, leer für keine.
de.haumacher.ehome.runtime.BlockFunctions.Function.blockValue = blockValue
de.haumacher.ehome.runtime.BlockFunctions.Function.blockValue.tooltip = <code>blockValue(parameter)</code>: der Wert, auf den der Parameter gesetzt ist, für den Benutzer (eine Auswahl mit ihrer Bezeichnung, eine Dauer in der Einheit des Manifests), <code>null</code>, wenn er nicht gesetzt ist.
de.haumacher.ehome.runtime.BlockInstances$UnitFit = Passende Einheit
de.haumacher.ehome.runtime.BlockInstances$UnitFit.tooltip = Wie die Einheit eines Datenpunkts zur Einheit des Ports passt, an den er gebunden werden soll (haumacher/ehome #78).
de.haumacher.ehome.runtime.BlockInstances.UnitFit.OTHER = Andere
de.haumacher.ehome.runtime.BlockInstances.UnitFit.OTHER.tooltip = Der Datenpunkt misst etwas anderes: eine andere Einheit oder gar keine, da er nichts misst (ein KNX-Subtyp ohne Einheit, wie z. B. eine Szenennummer, ein Zähler oder ein Modus; ein Port oder Parameter eines virtuellen Geräts ohne Einheit). Wird nicht angeboten.
de.haumacher.ehome.runtime.BlockInstances.UnitFit.SAME = Dieselbe
de.haumacher.ehome.runtime.BlockInstances.UnitFit.SAME.tooltip = Der Port hat keine Einheit, oder der Datenpunkt hat die Einheit des Ports.
de.haumacher.ehome.runtime.BlockInstances.UnitFit.UNKNOWN = Unbekannt
de.haumacher.ehome.runtime.BlockInstances.UnitFit.UNKNOWN.tooltip = Der Datenpunkt hat keine Einheit, aus der hervorgeht, was er misst (ein Anwendungsdatenpunkt oder ein Regelparameter ohne Einheit, eine Gruppenadresse ohne Datenpunkttyp oder nur mit einem Haupttyp): wird angeboten, mit dem Hinweis, dass der Benutzer dies überprüfen soll.
de.haumacher.ehome.runtime.BlockValues$Kind = Art
de.haumacher.ehome.runtime.BlockValues$Kind.tooltip = Wie ein Parameter eingegeben wird.
de.haumacher.ehome.runtime.BlockValues.Kind.BOOLEAN = Boolesch
de.haumacher.ehome.runtime.BlockValues.Kind.BOOLEAN.tooltip = Ein Wahrheitswert.
de.haumacher.ehome.runtime.BlockValues.Kind.CHOICE = Auswahl
de.haumacher.ehome.runtime.BlockValues.Kind.CHOICE.tooltip = Einer der Auswahlwerte, die der Typ deklariert, mit seiner Bezeichnung.
de.haumacher.ehome.runtime.BlockValues.Kind.DURATION = Dauer
de.haumacher.ehome.runtime.BlockValues.Kind.DURATION.tooltip = Eine Dauer in der Einheit des Manifests.
de.haumacher.ehome.runtime.BlockValues.Kind.NUMBER = Zahl
de.haumacher.ehome.runtime.BlockValues.Kind.NUMBER.tooltip = Eine Zahl in der Einheit des Manifests.
de.haumacher.ehome.runtime.BlockValues.Kind.TIME = Zeit
de.haumacher.ehome.runtime.BlockValues.Kind.TIME.tooltip = Eine Tageszeit.
de.haumacher.ehome.runtime.ControllerStatusAction = Controller-Status
de.haumacher.ehome.runtime.ControllerStatusAction.tooltip = <i>View-Aktion</i>, die liest, was ein Controller ausführt (<code>GET /api/status</code>). <p> Für ein Projekt (<code>ehome.project:Project</code>) ist das Ergebnis der Vergleich dessen, was sein Controller ausführt, mit der letzten Bereitstellung des Projekts (<code>ControllerStatus#drift(TLObject)</code>), für einen Controller (<code>ehome.runtime:Controller</code>) das, was er ausführt; in beiden Fällen ein Text. </p>
de.haumacher.ehome.runtime.CreateFunctionAction = Funktion anlegen
de.haumacher.ehome.runtime.CreateFunctionAction.tooltip = <i>View-Aktion</i>, die dem Eingabeprojekt (<code>ehome.project:Project</code>) eine neue Funktion hinzufügt (ein Licht ohne Datenpunkte), die der Benutzer dann bearbeitet; das Ergebnis ist die neue Funktion.
de.haumacher.ehome.runtime.DeleteFunctionAction = Funktion löschen
de.haumacher.ehome.runtime.DeleteFunctionAction.tooltip = <i>View-Aktion</i>, die die Eingabefunktion (<code>ehome.runtime:Function</code>) löscht und eine vorgeschlagene als verworfen vermerkt (haumacher/ehome #49, <code>FunctionProposal#dismiss(TLObject)</code>). <p> Das Ergebnis ist <code>null</code> (nichts mehr ausgewählt). Der Befehl trägt die Prüfungen der Modellzugriffsrechte: Die Aktion ändert das Projekt in Java. </p>
de.haumacher.ehome.runtime.DeployRuntimeImageAction = Laufzeitabbild bereitstellen
de.haumacher.ehome.runtime.DeployRuntimeImageAction.tooltip = <i>View-Aktion</i>, die das Laufzeitabbild des Eingabeprojekts (<code>ehome.project:Project</code>) in seinen Controller lädt, siehe <i>Deployer</i>. <p> Das Ergebnis ist die aufgezeichnete Bereitstellung (<code>ehome.runtime:Deployment</code>), angenommen oder nicht: Eine Ablehnung ist ein Ergebnis, das angezeigt wird, kein Fehler des Befehls. </p>
de.haumacher.ehome.runtime.DiscoverControllersAction = Controller suchen
de.haumacher.ehome.runtime.DiscoverControllersAction.Config.timeout = Zeitüberschreitung
de.haumacher.ehome.runtime.DiscoverControllersAction.Config.timeout.tooltip = Millisekunden, um die Antworten zu erfassen.
de.haumacher.ehome.runtime.DiscoverControllersAction.tooltip = <i>Aktion zum</i> Durchsuchen der lokalen Netzwerke nach HomeControl-Controllern (haumacher/ehome #42): die Instanzen des DNS-SD-Dienstes <code>"_homecontrol._tcp.local"</code>, die auf eine Multicast-DNS-Abfrage (<i>mdns-Browser</i>) antworten. <p> Die Eingabe ist entweder leer oder eine Map mit dem Eintrag <code>interface</code>: der Name der Netzwerkschnittstelle, auf der gesucht werden soll (einschließlich der Loopback-Schnittstelle); ohne diesen Eintrag wird die Suche auf allen Schnittstellen durchgeführt, die aktiv sind, Multicast unterstützen und keine Loopback-Schnittstelle sind. </p> <p> Das Ergebnis ist die Liste der gefundenen Controller, eine Map pro Controller mit den Schlüsseln <code>name</code> (der Hostname ohne <code>.local</code>, z. B. <code>homecontrol-a1b2c3</code>), <code>instance</code> (der Instanzname der Ankündigung), <code>hostName</code>, <code>host</code> (die IPv4-Adresse), <code>port</code> (der Web-API; <code>portText</code> ohne Tausendertrennzeichen geschrieben), <code>version</code> und <code>build</code> (die TXT-Attribute der Ankündigung, leer, falls nicht vorhanden), die als Zeilen einer Tabelle angezeigt und in einen Controller (<code>ehome.runtime:Controller</code>: Name, Host, Port) umgewandelt werden sollen. </p>
de.haumacher.ehome.runtime.ExportRuntimeImageAction = Laufzeitabbild exportieren
de.haumacher.ehome.runtime.ExportRuntimeImageAction.tooltip = <i>Zeigt den Vorgang</i> zum Exportieren des Laufzeit-Images des Eingabeprojekts (<code>ehome.project:Project</code>) zum Herunterladen <i>an</i>, nachdem es wie vom Controller geprüft wurde. <p> Das Image enthält die Revision, die bei der nächsten Bereitstellung verwendet würde. Das Ergebnis ist eine Zuordnung für einen Dialog: <code>file</code> (das Image als JSON-Datei, benannt nach dem Projekt; <code>null</code> für ein abgelehntes Image), <code>signature</code> (die isolierte Signatur <code>&lt;file&gt;.sig</code>, 128 Hexadezimalziffern und ein Zeilenende, erstellt mit dem Schlüssel, den der Controller des Projekts besitzt, siehe <code>InstallationKeys#signer(TLObject, TLObject)</code>; <code>null</code> für ein Projekt ohne Schlüssel oder ein abgelehntes Image), <code>summary</code> (ob das Image gültig ist; bei einem gültigen Image, was es enthält, siehe <code>#summary(RuntimeImage)</code>, und den Schlüssel, mit dem es signiert ist), <code>refusals</code> (eine Zuordnung pro Ablehnung mit <code>path</code>, <code>text</code> in der Sprache des Benutzers, <code>reason</code> auf Englisch, wie der Controller ihn angibt, und der <code>element</code> des Projekts, zu dem der Pfad führt) sowie <code>notes</code> (was beim Export ausgelassen wurde, jeweils eine Zeile). </p>
