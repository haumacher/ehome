de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationSetParameter.tooltip = <code>simulationSetParameter(project, key, value)</code>: Legt einen Parameter fest (<code>rule/parameter</code>).
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationSpeedVeto = Veto gegen die Geschwindigkeit der Simulationsuhr
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationSpeedVeto.tooltip = <code>simulationSpeedVeto(project, speed, state?)</code>: Warum die Uhr nicht mit der Geschwindigkeit laufen kann, <code>null</code>, wenn sie es kann.
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationStart = Simulation starten
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationStart.tooltip = <code>simulationStart(project, start?)</code>: Startet die Simulation; die Uhr wird auf das angegebene Datum gesetzt (bzw. auf den aktuellen Zeitpunkt, wenn das Feld leer ist).
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationStartVeto = Hinderungsgrund für den Start der Simulation
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationStartVeto.tooltip = <code>simulationStartVeto(project, state?)</code>: Warum keine Simulation gestartet werden kann, <code>null</code>, wenn eine gestartet werden kann.
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationState = Simulationszustand
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationState.tooltip = <code>simulationState(project, refresh?)</code>: <code>project</code>, <code>running</code>, <code>status</code> und – während der Ablauf läuft – die Momentaufnahme von <code>ProjectSimulation#snapshot()</code>.
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationStep = Simulationsschritt
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationStep.tooltip = <code>simulationStep(project)</code>: Lässt die Uhr bis zum nächsten Timer, bis zur nächsten planmäßigen Auslösung oder bis Mitternacht laufen.
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationStop = Simulation anhalten
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationStop.tooltip = <code>simulationStop(project)</code>: Hält die Simulation an.
de.haumacher.ehome.simulation.SimulationUpdatesElement = Aktualisierung der Simulation
de.haumacher.ehome.simulation.SimulationUpdatesElement.Config.project = Projekt
de.haumacher.ehome.simulation.SimulationUpdatesElement.Config.project.tooltip = Der Kanal mit dem Projekt, dessen Simulation angezeigt wird.
de.haumacher.ehome.simulation.SimulationUpdatesElement.Config.refresh = Aktualisierung
de.haumacher.ehome.simulation.SimulationUpdatesElement.Config.refresh.tooltip = Der Kanal, der bei jeder Änderung der Simulation geschrieben wird.
de.haumacher.ehome.simulation.SimulationUpdatesElement.tooltip = Zeigt seinen Inhalt an und hält, solange er angezeigt wird, eine Ansicht der Simulation eines Projekts aktuell (haumacher/ehome #62): Jede Änderung der Simulation (sie startet oder endet, ein Telegramm kommt an, die Uhr bewegt sich, eine Regel handelt) schreibt einen neuen Wert in den Kanal <code>refresh</code>, aus dem die Ansicht den Zustand der Simulation neu berechnet. Die Aktualisierungen kommen höchstens alle <code>500</code> ms (<i>Fensteraktualisierungen</i>), sodass eine Folge von Telegrammen oder eine Uhr mit 60-facher Echtzeit eine Aktualisierung pro Intervall ist. <p> Das Element hört auf die Simulation des Projekts im Kanal <code>project</code> (<code>Simulations#addListener(TLObject, Runnable)</code>), solange sein Inhalt angehängt (angezeigt) ist, folgt einer Änderung des Kanals und hört auf, wenn der Inhalt abgehängt oder verworfen wird. Wird er wieder angezeigt, aktualisiert er einmal. </p>
de.haumacher.ehome.simulation.Simulations = Simulationen
de.haumacher.ehome.simulation.Simulations.Config.directory = Verzeichnis
de.haumacher.ehome.simulation.Simulations.Config.directory.tooltip = Das Verzeichnis der Dateien der KNXnet/IP-Server der virtuellen Installationen; Aliase wie beispielsweise <code>%STORAGE_PATH%</code> werden aufgelöst.
de.haumacher.ehome.simulation.Simulations.tooltip = Die laufenden Simulationen der Anwendung: höchstens eine pro Projekt, die von allen gemeinsam genutzt wird, die das Projekt einsehen; alle werden beendet, wenn die Anwendung heruntergefahren wird. Eine Simulation ist vorübergehend: Nur ihre Parameterüberschreibungen werden mit dem Projekt gespeichert (<i>Überschreibungen</i>). <p> Wer eine Simulation anzeigt, registriert einen Listener für ihr Projekt (<code>#addListener(TLObject, Runnable)</code>): Er erfährt, wann die Simulation des Projekts startet oder endet, und von jeder Änderung der laufenden (<code>Simulation#setListener(Runnable)</code>), aus welchem Thread die Änderung auch kommt; er darf sie nur zur Kenntnis nehmen. </p> <p> Registriert in <code>WEB-INF/autoconf/ehome.simulation.config.xml</code>. </p>
de.haumacher.ehome.view.OptionOrderSelectControlProvider = Auswahl in gegebener Reihenfolge
de.haumacher.ehome.view.OptionOrderSelectControlProvider.tooltip = Eine Auswahl, die ihre Optionen in der gegebenen Reihenfolge zeigt, statt sie nach ihren Bezeichnungen zu sortieren – für Optionen, deren Reihenfolge zu ihrer Bedeutung gehört: die Wochentage, die Schrittweiten eines Dimmers. <pre> &lt;value-input inputs="target" options="t -&gt; $t['days']" value="day"&gt; &lt;input-control class="de.haumacher.ehome.view.OptionOrderSelectControlProvider"/&gt; &lt;/value-input&gt; </pre> <p> Workaround: Die Auswahl der Engine sortiert ihre Optionen immer nach ihren Bezeichnungen und hat keine Einstellung, die ihre Reihenfolge beibehält (8.0.0-alpha10, TL #29874, siehe <code>doc/tl-todo.md</code>). </p>
de.haumacher.ehome.view.RowOrderColumn = Spalte „Reihenfolge“
de.haumacher.ehome.view.RowOrderColumn.tooltip = Eine <code>&lt;computed-column&gt;</code>, die nicht sortiert werden kann, wird als <code>&lt;row-order-column&gt;</code> deklariert: Eine danach gruppierte Tabelle behält die Reihenfolge ihrer Gruppen so bei, wie die ersten Zeilen erscheinen. <p> Eine Tabelle ordnet ihre Gruppen nach dem Vergleichsoperator der Gruppierungsspalte (<code>ListRowSource</code>) an, wobei die Ansichtsebene für jede Art von Wert eine Spalte ableitet, die die Werte oder deren Anzeigetexte vergleicht; so listet eine nach den Seiten eines Programms gruppierte Tabelle die Seiten alphabetisch auf. Eine Spalte ohne Sortierfähigkeit behält die Gruppen in der Reihenfolge der Zeilen bei, was der Reihenfolge der Programmstruktur entspricht (haumacher/ehome #20). Die Ansichtsebene bietet keine Deklaration für eine Spalte, die nicht sortiert; daher entzieht diese Deklaration der von „a <code>&lt;computed-column&gt;</code> erstellten Spalte ihre Sortierfähigkeit. </p>
de.haumacher.ehome.view.ScriptLabelControlProvider = Anbieter für Skript-Label-Steuerelemente
de.haumacher.ehome.view.ScriptLabelControlProvider.Config.css-class = CSS-Klasse
de.haumacher.ehome.view.ScriptLabelControlProvider.Config.css-class.tooltip = Funktion, die anhand des Objekts eines Knotens dessen CSS-Klasse ermittelt; <code>null</code>, wenn keine vorhanden ist.
de.haumacher.ehome.view.ScriptLabelControlProvider.Config.label = Bezeichnung
de.haumacher.ehome.view.ScriptLabelControlProvider.Config.label.tooltip = Funktion, die die Beschriftung eines Knotens anhand seines Objekts berechnet; <code>null</code> für die eigene Beschriftung des Objekts. Nicht festgelegt: Jeder Knoten zeigt die Beschriftung seines Objekts an.
de.haumacher.ehome.view.ScriptLabelControlProvider.tooltip = Anzeige eines Knotens mit dem Wert <code>&lt;tree&gt;</code> (bzw. <code>nodeContent</code>) mit einer Beschriftung und einer CSS-Klasse, die durch TL-Script-Funktionen berechnet werden, für einen Baum, dessen Knoten eine andere Beschriftung benötigen als die, die ihre Objekte an allen anderen Stellen haben, oder eine Markierung. <p> Der Knoten zeigt das Symbol seines Objekts und die Bezeichnung an, die die Funktion aus dem Objekt berechnet; wenn die Funktion nichts liefert, wird die eigene Bezeichnung des Objekts angezeigt. Wie bei der Standardanzeige von Knoten ist der Knoten kein Link: Ein Klick markiert ihn. Die Werte der in <code>inputs</code> genannten Kanäle sind die ersten Argumente beider Funktionen, das Objekt ist das letzte. </p><pre> &lt;nodeContent class="de.haumacher.ehome.view.ScriptLabelControlProvider" label="x -&gt; if($x.instanceOf(`ehome.physical:Connection`), connectionLabel($x), null)"/&gt; &lt;nodeContent class="de.haumacher.ehome.view.ScriptLabelControlProvider" inputs="device" css-class="d -&gt; x -&gt; if(deviceChanged($d, $x), 'ehomeChanged', null)"/&gt; </pre> <p> Die Beschriftung und die Klasse werden bei der Anzeige des Knotens sowie bei jeder Änderung seines Objekts berechnet; eine von anderen Objekten abhängige Markierung erfordert einen Baum, der bei einer Änderung neu aufgebaut wird (ein Eingang des Baums, der sich mit der Markierung ändert). </p>
de.haumacher.ehome.zigbee.ReadZigbeeDevicesAction = Zigbee-Geräte lesen
de.haumacher.ehome.zigbee.ReadZigbeeDevicesAction.tooltip = <i>View-Aktion</i>, die die Zigbee-Geräte des Controllers des Eingabeprojekts in das Projekt liest (<code>GET /api/zigbee/export</code>, alle Seiten), siehe <code>ZigbeeController#read(TLObject)</code>. <p> Das Ergebnis ist der Satz, der sagt, was importiert wurde, gefolgt von den Hinweisen des Imports. </p>
de.haumacher.ehome.zigbee.ZigbeeFunctions$Builder = Erzeuger
de.haumacher.ehome.zigbee.ZigbeeFunctions$Builder.tooltip = Erzeuger einer <i>Zigbee-Funktion</i>: Die <i>Funktion</i>, unter deren Namen die Funktion registriert ist.
de.haumacher.ehome.zigbee.ZigbeeFunctions$Function = Funktion
de.haumacher.ehome.zigbee.ZigbeeFunctions$Function.tooltip = Die Funktionen, benannt so, wie sie registriert sind.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeBind = Datenpunkt an Zigbee-Funktion binden
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeBind.tooltip = <code>zigbeeBind(function, datapoint)</code>: Bindet den Anwendungsdatenpunkt an die Funktion (<code>ZigbeeBindings#bind(TLObject, TLObject)</code>); der Datenpunkt.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeBindVeto = Einwand gegen das Binden
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeBindVeto.tooltip = <code>zigbeeBindVeto(function)</code>: Warum für die Funktion kein Datenpunkt angelegt oder an sie gebunden werden kann, als Text; <code>null</code>, wenn es geht.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCandidates = Bindbare Datenpunkte
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCandidates.tooltip = <code>zigbeeCandidates(function)</code>: Die Anwendungsdatenpunkte des Projekts, die an die Funktion gebunden werden können: an keine Funktion gebunden, von einem passenden Werttyp.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCreateDatapoint = Datenpunkt für Zigbee-Funktion anlegen
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCreateDatapoint.tooltip = <code>zigbeeCreateDatapoint(function)</code>: Ein neuer Anwendungsdatenpunkt, an die Funktion gebunden (<code>ZigbeeBindings#createDatapoint(TLObject)</code>).
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeFunctionOptions = Bindbare Zigbee-Funktionen
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeFunctionOptions.tooltip = <code>zigbeeFunctionOptions(datapoint)</code>: Die Funktionen, an die ein Anwendungsdatenpunkt gebunden werden kann, die Auswahl seines Feldes.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeImport = Zigbee-Geräte importieren
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeImport.tooltip = <code>zigbeeImport(project, file)</code>: Importiert den hochgeladenen Export eines Controllers in das Projekt (<code>ZigbeeImport#importFile(TLObject, Object)</code>); der Satz, der sagt, was importiert wurde, gefolgt von den Hinweisen des Imports.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeUnbind = Zigbee-Bindung lösen
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeUnbind.tooltip = <code>zigbeeUnbind(function)</code>: Hebt die Bindungen der Funktion auf; ihre Datenpunkte bleiben als Datenpunkte der Anwendung erhalten.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeUnbindVeto = Einwand gegen das Lösen der Bindung
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeUnbindVeto.tooltip = <code>zigbeeUnbindVeto(function)</code>: Warum die Bindung der Funktion nicht gelöst werden kann, als Text; <code>null</code>, wenn es geht.
de.haumacher.ehome.zigbee.ZigbeePermitAction = Zigbee-Netz zum Koppeln öffnen
de.haumacher.ehome.zigbee.ZigbeePermitAction.Config.seconds = Sekunden
de.haumacher.ehome.zigbee.ZigbeePermitAction.Config.seconds.tooltip = Die Zeit in Sekunden, für die das Netzwerk geöffnet bleibt (1..254); bei 0 wird es geschlossen.
de.haumacher.ehome.zigbee.ZigbeePermitAction.tooltip = <i>View-Aktion</i>, die das Zigbee-Netz eines Controllers zum Koppeln öffnet (<code>POST /api/zigbee/permit</code>) oder schließt, siehe <code>ZigbeeController#permit(TLObject, int)</code>. <p> Die Eingabe ist ein Controller (<code>ehome.runtime:Controller</code>) oder ein Projekt, dessen Controller gemeint ist; das Ergebnis ist der Satz, der sagt, was der Controller getan hat. </p>
