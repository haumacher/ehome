de.haumacher.ehome.scan.ScanFunctions.Function.scanApplyVeto.tooltip = <code>scanApplyVeto(row)</code>: Warum das Gerät nicht angelegt oder aktualisiert werden kann.
de.haumacher.ehome.scan.ScanFunctions.Function.scanLedConfirmation = Bestätigung der Programmier-LED
de.haumacher.ehome.scan.ScanFunctions.Function.scanLedConfirmation.tooltip = <code>scanLedConfirmation(row, on)</code>: Die Frage vor dem Wechsel in den Programmiermodus.
de.haumacher.ehome.scan.ScanFunctions.Function.scanLedVeto = Grund gegen Programmier-LED
de.haumacher.ehome.scan.ScanFunctions.Function.scanLedVeto.tooltip = <code>scanLedVeto(row)</code>: Warum lässt sich der Programmiermodus nicht umschalten?
de.haumacher.ehome.scan.ScanFunctions.Function.scanReadVeto = Grund gegen Einlesen
de.haumacher.ehome.scan.ScanFunctions.Function.scanReadVeto.tooltip = <code>scanReadVeto(row)</code>: Warum die Konfiguration nicht zurückgelesen werden kann.
de.haumacher.ehome.scan.ScanFunctions.Function.scanRefresh = Scan aktualisieren
de.haumacher.ehome.scan.ScanFunctions.Function.scanRefresh.tooltip = <code>scanRefresh(rows)</code>: Die Zeilen, in denen der Status im Projekt neu berechnet wurde.
de.haumacher.ehome.scan.ScanFunctions.Function.scanRematch = Erneut zuordnen
de.haumacher.ehome.scan.ScanFunctions.Function.scanRematch.tooltip = <code>scanRematch(project)</code>: Das Ergebnis einer erneuten Zuordnung der nicht identifizierten Geräte des Projekts.
de.haumacher.ehome.scan.ScanFunctions.Function.scanVeto = Grund gegen Suche
de.haumacher.ehome.scan.ScanFunctions.Function.scanVeto.tooltip = <code>scanVeto(project, area, line, routers, gateway, programming)</code>: Warum der Scan abgelehnt wird.
de.haumacher.ehome.scan.ScanJob = Installation einlesen
de.haumacher.ehome.scan.ScanJob.tooltip = Die Funktion des Befehls „Installation auslesen“ (<code>&lt;start-job&gt;</code> von <code>projects/scan.view.xml</code>): Scannt den Bus hinter dem Gateway des Projekts mit <i>einem Busscanner</i> (es wird nichts geschrieben), gleicht jedes gefundene Gerät mit dem Katalog ab (<i>Katalogabgleich</i>) und behält die nicht identifizierten Geräte im Projekt (<code>InstallationBuilder#recordUnidentified(TLObject, FoundDevice, String)</code>). <p> Der Auftrag wird mit dem Projekt, dem Bereich und der zu scannenden Leitung (leer: keine Leitung) gestartet, wobei angegeben wird, ob nach Routern gesucht, das Gateway über die lokale Geräteverwaltung ausgelesen und nach Geräten im Programmiermodus gesucht werden soll. Das Ergebnis ist ein Wörterbuch: <code>summary</code>, <code>rows</code> (siehe <i>Scan-Zeilen</i>) und <code>notes</code> (was nicht gelesen werden konnte). </p>
