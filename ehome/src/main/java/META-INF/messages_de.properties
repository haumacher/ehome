de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeIdentifierProblem = Problem der Kennung
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeIdentifierProblem.tooltip = <code>runtimeIdentifierProblem(text)</code>: Warum der Text keine Kennung des Laufzeitabbilds ist; <code>null</code> für einen leeren Text oder eine Kennung.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeTimeMasterProblem = Problem des Zeitgebers
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeTimeMasterProblem.tooltip = <code>runtimeTimeMasterProblem(address, project, attribute)</code>: Die Prüfung der Adressen des Zeitgebers (<code>timeMasterTime</code>, <code>timeMasterDate</code>, <code>timeMasterDateTime</code>), siehe <code>#timeMasterConstraint(Object, Object, String)</code>.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeTimeZoneProblem = Problem der Zeitzone
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeTimeZoneProblem.tooltip = <code>runtimeTimeZoneProblem(text)</code>: Warum der Text keine POSIX-TZ-Angabe ist; <code>null</code> für einen leeren Text oder eine solche Angabe.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeUnitProblem = Problem der Einheit
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeUnitProblem.tooltip = <code>runtimeUnitProblem(text)</code>: Warum der Text nicht die Einheit eines Datenpunkts sein kann; <code>null</code> für einen leeren Text oder eine Einheit.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.unloadConfirmation = Bestätigung des Entladens
de.haumacher.ehome.runtime.RuntimeFunctions.Function.unloadConfirmation.tooltip = <code>unloadConfirmation(project)</code>: Die Frage vor dem Entladen des Abbilds aus dem Controller des Projekts, mit dem, was der Controller ausführt (<code>ControllerStatus#drift(TLObject)</code>).
de.haumacher.ehome.runtime.UnloadRuntimeImageAction = Laufzeitabbild entladen
de.haumacher.ehome.runtime.UnloadRuntimeImageAction.tooltip = <i>View-Aktion</i>, die das Laufzeitabbild entlädt, das der Controller des Eingabeprojekts (<code>ehome.project:Project</code>) ausführt (<code>DELETE /api/image</code>), siehe <code>Deployer#unload(TLObject, Instant)</code>. <p> Das Ergebnis ist das aufgezeichnete Entladen (eine als Entladen markierte <code>ehome.runtime:Deployment</code>), erfolgreich oder nicht: Eine Ablehnung ist ein Ergebnis, das angezeigt wird, kein Fehler des Befehls. </p>
