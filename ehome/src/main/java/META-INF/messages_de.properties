de.haumacher.ehome.simulation.SimulationSource = Simulationsquelle
de.haumacher.ehome.simulation.SimulationSource.tooltip = Quelle des Kanals <code>refresh</code> der Simulation eines Projekts (haumacher/ehome #62, <code>projects/simulation.view.xml</code>): Bei jeder Änderung der Simulation (Start oder Stopp der Simulation, Eingang eines Telegramms, Zeitablauf, Auslösung einer Regel) wird ein neuer Wert veröffentlicht, anhand dessen die Ansicht den Zustand der Simulation neu berechnet. Der Kanal nimmt höchstens alle 500 ms einen Wert an (sein Wert ist <code>update-interval</code>), sodass eine Telegrammflut oder eine Uhr, die mit der 60-fachen Echtzeit läuft, eine Aktualisierung pro Intervall darstellt. <p> Er überwacht die Simulation des Projekts auf Kanal <code>project</code> (<code>Simulations#addListener(TLObject, Runnable)</code>), solange die Ansicht angezeigt wird. </p>
de.haumacher.ehome.simulation.Simulations = Simulationen
de.haumacher.ehome.simulation.Simulations.Config.directory = Verzeichnis
de.haumacher.ehome.simulation.Simulations.Config.directory.tooltip = Das Verzeichnis der Dateien der KNXnet/IP-Server der virtuellen Installationen; Aliase wie beispielsweise <code>%STORAGE_PATH%</code> werden aufgelöst.
de.haumacher.ehome.simulation.Simulations.tooltip = Die laufenden Simulationen der Anwendung: höchstens eine pro Projekt, die von allen gemeinsam genutzt wird, die das Projekt aufrufen; alle werden beendet, wenn die Anwendung geschlossen wird. Eine Simulation ist vorübergehend: Nur ihre Parameterüberschreibungen werden mit dem Projekt gespeichert (<i>Überschreibungen</i>). Die Werte ihrer virtuellen Zigbee-Geräte bleiben bis zum Beenden der Anwendung im Speicher erhalten: Die nächste Simulation des Projekts beginnt mit diesen Werten, da echte Geräte ihren Zustand beibehalten, während der Controller neu gestartet wird. <p> Wer eine Simulation anzeigt, registriert einen Listener für sein Projekt (<code>#addListener(TLObject, Runnable)</code>): Er wird benachrichtigt, wenn die Simulation des Projekts startet oder stoppt, sowie über jede Änderung der laufenden Simulation (<code>Simulation#setListener(Runnable)</code>), unabhängig davon, in welchem Thread die Änderung stattfindet; er muss dies lediglich zur Kenntnis nehmen. </p> <p> Registriert in <code>WEB-INF/autoconf/ehome.simulation.config.xml</code>. </p>
