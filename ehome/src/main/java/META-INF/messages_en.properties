de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-multicast = Use multicast
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-multicast.tooltip = Whether to send the search request by multicast.
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-nat = Use nat
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-nat.tooltip = Whether to search through a NAT router.
de.haumacher.ehome.discover.DiscoverGatewaysAction.tooltip = <i>View action</i> searching the local networks for KNXnet/IP gateways. <p> The input is either nothing or a map with the search settings: <code>interface</code> (name of the network interface to search on, all interfaces if empty), <code>local-host</code> (local address to send from), <code>use-nat</code> and <code>use-multicast</code>; settings missing in the map are taken from the configuration. The result is the list of gateways that answered, one map per gateway (a gateway that answered several times is listed once) with the keys <code>name</code>, <code>address</code>, <code>endpoint</code>, <code>mac</code>, <code>serial</code> and <code>medium</code>, to be displayed as rows of a table. </p>
de.haumacher.ehome.discover.KnxNetworkInterfaces$Builder = Builder
de.haumacher.ehome.discover.KnxNetworkInterfaces$Builder.tooltip = Builder for <i>knx network interfaces</i>.
de.haumacher.ehome.etsImport.ImportEtsProjectJob = Import ets project job
de.haumacher.ehome.etsImport.ImportEtsProjectJob.tooltip = The work of the ETS import (<code>&lt;start-job&gt;</code> body of <code>projects/overview.view.xml</code> and <code>projects/import-password.view.xml</code>, haumacher/ehome #84): imports the uploaded ETS project files (<code>.knxproj</code>). <p> The job is started with the uploaded file, a collection of them, or the request of the password dialog (a dictionary with the uploaded file in <code>file</code>), and with the project password as a further text argument where one was entered. Each file is imported in a transaction of its own, in the phases of <code>ImportJobs#importFile</code>, with the progress by the entries of the file. The result is the report of the import, a dictionary: <code>project</code> is the project created by the last import (for a following <code>&lt;write-channel&gt;</code>), <code>messages</code> the warnings and errors the import reported (each a dictionary with <code>file</code>, <code>severity</code>, <code>level</code> and <code>message</code>), and <code>summary</code> a sentence naming the imported projects and the number of messages. The messages do not change the outcome: a file that cannot be imported fails the job. </p> <p> A single uploaded file whose project is protected by a password, uploaded without one, is not imported: the result is a dictionary with <code>passwordRequired</code> set to <code>true</code>, the file in <code>file</code> and the reason in <code>message</code>, so that the view can ask for the password and import the file again (a failing job would end the command instead). A wrong password, or none in the request of the password dialog, fails the job with the reason, before anything is imported. </p> <p> A cancelled job imports nothing of the file it is at; of a multi-file upload, the files imported before stay. </p>
de.haumacher.ehome.etsImport.ImportProductDataJob = Import product data job
de.haumacher.ehome.etsImport.ImportProductDataJob.tooltip = The work of the product data import of the catalog (<code>&lt;start-job&gt;</code> body of <code>catalogs.view.xml</code>, haumacher/ehome #84): imports the uploaded product files of manufacturers (<code>.knxprod</code>) into the catalog. <p> The job is started with the uploaded file, or a collection of them. Each file is imported in a transaction of its own, in the phases of <code>ImportJobs#importFile</code>, with the mapping of the project import (see <code>Importer#importProductData</code>): the manufacturers, catalogs, products and application programs the catalog already holds are reused by their IDs, an application program already known is skipped. The result is the report of the import, a dictionary like the one of <i>import ets project job</i>: <code>manufacturer</code> is the manufacturer of the file imported last, <code>summary</code> a sentence naming for each file the manufacturers, products and application programs imported and those already known (or that it holds none), the number of files of the manufacturer imported and those replaced by a newer version (haumacher/ehome #154), and the number of messages, <code>messages</code> the warnings and errors the import reported. A file that cannot be imported (a project file, a file with encrypted entries) fails the job with the reason. A cancelled job imports nothing of the file it is at. </p>
de.haumacher.ehome.etsImport.ImportProjectFileJob = Import project file job
de.haumacher.ehome.etsImport.ImportProjectFileJob.tooltip = The work of the import of project files (<code>&lt;name&gt;.ehome</code>, haumacher/ehome #117; <code>&lt;start-job&gt;</code> body of <code>projects/overview.view.xml</code>): each file becomes a new project. <p> The job is started with the uploaded file or a collection of them. A file is read and checked first (a file of another format or of a newer major version of the format is refused before anything is imported); then its <code>.knxproj</code> is imported as the ETS import does, in the phases of <code>ImportJobs#importFile</code>, and in the same transaction the E-Home part is added to the project it created (<i>project file import</i>). The result is the report of <i>import ets project job</i>: the messages of both steps, among them that the controllers have to be paired again and, where the installation has a project with the same ID, that both would deploy to the same controllers. </p>
de.haumacher.ehome.etsImport.UpdateFromEtsJob = Update from ets job
de.haumacher.ehome.etsImport.UpdateFromEtsJob.tooltip = The work of the command "Update from ETS" (<code>&lt;start-job&gt;</code> body of <code>projects/overview.view.xml</code> and <code>projects/update-password.view.xml</code>, haumacher/ehome #125): updates a project from a new export of the same project in ETS, keeping what E-Home alone holds (<i>project update</i>). <p> The job is started with the uploaded file and the project to update, or with the request of the password dialog (a dictionary with the file in <code>file</code> and the project in <code>project</code>) and the project password. The file is imported as the ETS import does, in the phases of <code>ImportJobs#importFile</code>, into a project of its own, which the update merges into the project and deletes, in the same transaction: a refused update (another project, objects the file removes that E-Home uses, …) fails the job with the reasons and changes nothing; so does a cancelled one. The result is the report of <i>import ets project job</i>, with the project updated in <code>project</code> and the changes per kind among the messages; a project protected by a password, uploaded without one, gives the result of <i>import ets project job</i> asking for the password, with the project in <code>project</code>. </p>
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat = Enumeration format
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat.Config.default-value = Default value
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat.Config.type = Type
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat.tooltip = Format reading a classifier of an enumeration by its name. <p> A value that is no identifier is matched with its letters, digits and underscores only, so that the classifier <code>DPT9</code> reads the ETS value <code>DPT 9</code>. </p>
de.haumacher.ehome.etsImport.importer.format.TLEnumerationSetFormat = Enumeration set format
de.haumacher.ehome.etsImport.importer.format.TLEnumerationSetFormat.Config.type = Type
de.haumacher.ehome.etsImport.importer.format.TLEnumerationSetFormat.Config.type.tooltip = The qualified name of the enumeration.
de.haumacher.ehome.etsImport.importer.format.TLEnumerationSetFormat.tooltip = Format reading a list of classifiers of an enumeration from their names separated by spaces (an XML Schema list, e.g. <code>remote local1</code>), for a multiple reference to an enumeration.
de.haumacher.ehome.exporter.ExportKnxprojAction = Export knxproj action
de.haumacher.ehome.exporter.ExportKnxprojAction.tooltip = <i>View action</i> exporting the input project (<code>ehome.project:Project</code>) as an ETS project archive with <i>knxproj exporter</i>. <p> The result is the archive as binary data named after the project (<code>&lt;name&gt;.knxproj</code>), for a dialog offering it for download. The archive is not signed, so ETS does not import it. </p>
de.haumacher.ehome.importer.CompleteModules = Complete modules
de.haumacher.ehome.importer.CompleteModules.Config.allocators = Allocators
de.haumacher.ehome.importer.CompleteModules.Config.allocators.tooltip = The handler reading the allocators of the program (the element <code>Allocators</code>).
de.haumacher.ehome.importer.CompleteModules.Config.calculations = Calculations
de.haumacher.ehome.importer.CompleteModules.Config.calculations.tooltip = The handler reading the calculations (the content of the element <code>ParameterCalculations</code>) into a program or module definition.
de.haumacher.ehome.importer.CompleteModules.Config.module = Module
de.haumacher.ehome.importer.CompleteModules.Config.module-defs = Module defs
de.haumacher.ehome.importer.CompleteModules.Config.module-defs.tooltip = The handler reading the module definitions (the element <code>ModuleDefs</code>).
de.haumacher.ehome.importer.CompleteModules.Config.module.tooltip = The handler reading a placement of a module (the element <code>Module</code>) into a structure element.
de.haumacher.ehome.importer.CompleteModules.Config.repeat = Repeat
de.haumacher.ehome.importer.CompleteModules.Config.repeat.tooltip = The handler reading a repeated part (the element <code>Repeat</code>) into a structure element.
de.haumacher.ehome.importer.CompleteModules.Config.validations = Validations
de.haumacher.ehome.importer.CompleteModules.Config.validations.tooltip = The handler reading the validations (the content of the element <code>ParameterValidations</code>) into a program or module definition.
de.haumacher.ehome.importer.CompleteModules.tooltip = Completes a known application program (the <code>this</code> of an <code>&lt;update&gt;</code> of <code>&lt;unless-known&gt;</code>) that an earlier import left without its dynamic modules (haumacher/ehome #119), if the scan of the file planned it (see <i>module completion</i>), or without its parameter calculations (haumacher/ehome #123, <code>calculationsRead</code> not set) or without its parameter validations (haumacher/ehome #124, <code>validationsRead</code> not set); otherwise applies its content handlers (the update of a known program). <p> The completion reads what the earlier import skipped; the rest of the program exists: the allocators of the program (<i>Allocators</i>), its module definitions (<i>Module defs</i>), and each <code>Module</code> and <code>Repeat</code> of the dynamic part (not nested in another one, <i>Module</i>, <i>Repeat</i>) into the structure element its plan names, moved to its position there. Then the mark <code>usesModules</code> is removed, and the import reports the completion. The calculations of the program and of its module definitions (<i>Calculations</i>) and their scripts are read into the program and its module definitions (those the module completion creates read their calculations themselves), and <code>calculationsRead</code> is set. Likewise the validations (<i>Validations</i>), and <code>validationsRead</code> is set. </p>
de.haumacher.ehome.importer.DeviceModuleInstances = Device module instances
de.haumacher.ehome.importer.DeviceModuleInstances.tooltip = Reads the module instances a device of a project file lists with their arguments (ETS: <code>DeviceInstance/ModuleInstances</code>, haumacher/ehome #119) for the comparison with the instances E-Home computes (see <i>module import</i>): the instances themselves are E-Home's.
