de.haumacher.ehome.view.ScriptLabelControlProvider = Script label control provider
de.haumacher.ehome.view.ScriptLabelControlProvider.Config.css-class = Css class
de.haumacher.ehome.view.ScriptLabelControlProvider.Config.css-class.tooltip = Expression computing the CSS class of a node from its object (the variable <code>$value</code>); <code>null</code> for none.
de.haumacher.ehome.view.ScriptLabelControlProvider.Config.label = Label
de.haumacher.ehome.view.ScriptLabelControlProvider.Config.label.tooltip = Expression computing the label of a node from its object (the variable <code>$value</code>); <code>null</code> for the object's own label. Unset, every node shows the label of its object.
de.haumacher.ehome.view.ScriptLabelControlProvider.tooltip = Display of a node of a <code>&lt;tree&gt;</code> (its <code>nodeContent</code>) with a label and a CSS class computed by TL-Script functions, for a tree whose nodes need another label than the one their objects have everywhere else, or a mark. <p> The node shows the icon of its object and the label the function computes from the object; where the function gives nothing, the object's own label. Like the default node display, the node is no link: a click selects it. Both expressions see the values of the channels named in <code>inputs</code> as variables named after the channels, and the object as <code>$value</code>. </p> <pre> &lt;nodeContent class="de.haumacher.ehome.view.ScriptLabelControlProvider" label="if($value.instanceOf(`ehome.physical:Connection`), connectionLabel($value), null)"/&gt; &lt;nodeContent class="de.haumacher.ehome.view.ScriptLabelControlProvider" inputs="device" css-class="if(deviceChanged($device, $value), 'ehomeChanged', null)"/&gt; </pre> <p> The label and the class are computed when the node is displayed and whenever its object changes; a mark depending on other objects needs a tree that is built anew when it changes (an input of the tree that changes with the mark). </p>
de.haumacher.ehome.zigbee.CatalogTypeConstraint = Catalog type constraint
de.haumacher.ehome.zigbee.CatalogTypeConstraint.tooltip = Constraint of the recommended datapoint type of a function entry of the Zigbee catalog (<code>ehome.zigbee.catalog:ZigbeeFunctionEntry#type</code>): it must fit the value type the function carries (<code>ZigbeeBindings#fits(String, String)</code>), as a binding must; a function key E-Home does not know (a newer controller's) takes any type.
de.haumacher.ehome.zigbee.ReadZigbeeDevicesAction = Read zigbee devices action
de.haumacher.ehome.zigbee.ReadZigbeeDevicesAction.tooltip = <i>View action</i> reading the Zigbee devices of the input project's controller into the project (<code>GET /api/zigbee/export</code>, all pages), see <code>ZigbeeController#read(TLObject)</code>. <p> The result is the sentence saying what was imported, followed by the notes of the import. </p>
de.haumacher.ehome.zigbee.ReportingConstraint = Reporting constraint
de.haumacher.ehome.zigbee.ReportingConstraint.tooltip = Constraint of the installer's reporting override of a Zigbee function (<code>ehome.zigbee:ZigbeeFunction#reportingMin</code>, <code>reportingMax</code>, <code>reportingChange</code>): refuses what the controller's loader refuses, with its reason in the user's language (<code>ZigbeeReporting#check(TLObject)</code>, the check the image validator makes). <p> The refusal is reported at the field of the member it concerns; one that concerns the override as a whole (the function takes none) at every field that has a value. The three fields depend on each other (a maximum below the minimum), so each is checked again when another one changes. </p>
de.haumacher.ehome.zigbee.ZigbeeCatalogJson$Mode = Mode
de.haumacher.ehome.zigbee.ZigbeeCatalogJson$Mode.tooltip = How the import treats a type the catalog knows already.
de.haumacher.ehome.zigbee.ZigbeeCatalogJson.Mode.KEEP = Keep
de.haumacher.ehome.zigbee.ZigbeeCatalogJson.Mode.KEEP.tooltip = It stays as it is: the device types E-Home ships are seeded.
de.haumacher.ehome.zigbee.ZigbeeCatalogJson.Mode.UPDATE = Update
de.haumacher.ehome.zigbee.ZigbeeCatalogJson.Mode.UPDATE.tooltip = It takes the file's content: the user imports a file.
de.haumacher.ehome.zigbee.ZigbeeCatalogSeed = Zigbee catalog seed
de.haumacher.ehome.zigbee.ZigbeeCatalogSeed.tooltip = Seeds the Zigbee catalog (<i>zigbee catalog</i>) with the device types E-Home ships: the catalog files (<code>.json</code>, <i>zigbee catalog JSON</i>) in <code>WEB-INF/zigbee-catalog/</code>, each once per database, as the engine loads its initial data (the start hook <code>InitialDataSetup</code>, which reads only its own XML format). <p> A file is loaded at the first start that finds it, and marked as loaded in the database's properties (<code>ehome.zigbee-catalog.&lt;file&gt;</code>): a type the user deletes afterwards does not come back with the next start, and a file a later release adds is loaded once. Loading creates only the types the catalog does not know (by manufacturer and model); a known type stays as the user keeps it. A file that cannot be read or is refused is logged with the reason and not marked, so the next start tries again. </p>
de.haumacher.ehome.zigbee.ZigbeeFunctions$Builder = Builder
de.haumacher.ehome.zigbee.ZigbeeFunctions$Builder.tooltip = Builder of a <i>zigbee functions</i> function: the <i>function</i> named as the function is registered.
de.haumacher.ehome.zigbee.ZigbeeFunctions$Function = Function
de.haumacher.ehome.zigbee.ZigbeeFunctions$Function.tooltip = The functions, named as they are registered.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeBind = Zigbee bind
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeBind.tooltip = <code>zigbeeBind(function, datapoint)</code>: binds the application datapoint to the function (<code>ZigbeeBindings#bind(TLObject, TLObject)</code>); the datapoint.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeBindVeto = Zigbee bind veto
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeBindVeto.tooltip = <code>zigbeeBindVeto(function)</code>: why no datapoint can be created for or bound to the function, as text; <code>null</code> if one can.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCandidates = Zigbee candidates
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCandidates.tooltip = <code>zigbeeCandidates(function)</code>: the application datapoints of the project that can be bound to the function: bound to no function, of a fitting value type.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCatalogExport = Zigbee catalog export
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCatalogExport.tooltip = <code>zigbeeCatalogExport(types)</code>: the device types (one or a list) as a catalog file to download (<code>ZigbeeCatalogJson#export(java.util.Collection)</code>).
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCatalogImport = Zigbee catalog import
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCatalogImport.tooltip = <code>zigbeeCatalogImport(catalog, file)</code>: imports the uploaded catalog file into the catalog (<code>ZigbeeCatalogJson#importFile(TLObject, Object)</code>); the sentence saying what was imported.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCreateDatapoint = Zigbee create datapoint
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCreateDatapoint.tooltip = <code>zigbeeCreateDatapoint(function)</code>: a new application datapoint bound to the function (<code>ZigbeeBindings#createDatapoint(TLObject)</code>).
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCreateDatapoints = Zigbee create datapoints
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCreateDatapoints.tooltip = <code>zigbeeCreateDatapoints(device)</code>: creates a datapoint for every function of the device that is exported, unbound and not hidden (<code>ZigbeeBindings#createDatapoints(TLObject)</code>); the sentence naming them; refused with the reason when there is none.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCreateDatapointsVeto = Zigbee create datapoints veto
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeCreateDatapointsVeto.tooltip = <code>zigbeeCreateDatapointsVeto(device)</code>: why there is no datapoint to create for the device, as text; <code>null</code> if there is.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeDeviceState = Zigbee device state
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeDeviceState.tooltip = <code>zigbeeDeviceState(device)</code>: the state of the device, live from the controller's events or as the last export said (<code>ZigbeeStatus#deviceState(TLObject)</code>).
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeDeviceType = Zigbee device type
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeDeviceType.tooltip = <code>zigbeeDeviceType(device)</code>: the type of the Zigbee catalog the device is, by its manufacturer and model (<code>ZigbeeCatalog#type(TLObject)</code>); <code>null</code> for an unknown device.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeFunctionHidden = Zigbee function hidden
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeFunctionHidden.tooltip = <code>zigbeeFunctionHidden(function)</code>: whether the device's type in the catalog hides the function (<code>ZigbeeCatalog#hidden(TLObject)</code>).
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeFunctionLabel = Zigbee function label
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeFunctionLabel.tooltip = <code>zigbeeFunctionLabel(function)</code>: the name of the function in the user's language (<code>ZigbeeStatus#functionLabel(TLObject)</code>); an unknown key as it is.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeFunctionOptions = Zigbee function options
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeFunctionOptions.tooltip = <code>zigbeeFunctionOptions(datapoint)</code>: the functions an application datapoint may be bound to, the options of its field.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeImport = Zigbee import
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeImport.tooltip = <code>zigbeeImport(project, file)</code>: imports the uploaded export of a controller into the project (<code>ZigbeeImport#importFile(TLObject, Object)</code>); the sentence saying what was imported, followed by the notes of the import.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeLiveProblem = Zigbee live problem
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeLiveProblem.tooltip = <code>zigbeeLiveProblem(project, refresh)</code>: why the last live import failed (<code>ZigbeeStatus#liveProblem(TLObject)</code>); <code>null</code> if it did not.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeNetworkState = Zigbee network state
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeNetworkState.tooltip = <code>zigbeeNetworkState(project, refresh)</code>: the network of the project's controller with the permit countdown (<code>ZigbeeStatus#networkState(TLObject, java.time.Instant)</code>); the second argument only makes the caller compute it again.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeReadState = Zigbee read state
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeReadState.tooltip = <code>zigbeeReadState(project, refresh)</code>: when the devices were last read, live or on request (<code>ZigbeeStatus#readState(TLObject)</code>); <code>null</code> before the first read.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeRemoveAbsent = Zigbee remove absent
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeRemoveAbsent.tooltip = <code>zigbeeRemoveAbsent(device)</code>: deletes the absent functions of the device no datapoint is bound to (<code>ZigbeeStatus#removeAbsent(TLObject)</code>); the sentence saying what was removed and kept.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeRemoveAbsentVeto = Zigbee remove absent veto
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeRemoveAbsentVeto.tooltip = <code>zigbeeRemoveAbsentVeto(device)</code>: why the device has no absent function to remove, as text; <code>null</code> if it has.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeReporting = Zigbee reporting
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeReporting.tooltip = <code>zigbeeReporting(function)</code>: what the controller does with the reporting of the function, for the user (<code>ZigbeeReporting#summary(TLObject)</code>).
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeUnbind = Zigbee unbind
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeUnbind.tooltip = <code>zigbeeUnbind(function)</code>: removes the bindings of the function; its datapoints stay as datapoints of the application.
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeUnbindVeto = Zigbee unbind veto
de.haumacher.ehome.zigbee.ZigbeeFunctions.Function.zigbeeUnbindVeto.tooltip = <code>zigbeeUnbindVeto(function)</code>: why the function cannot be unbound, as text; <code>null</code> if it can.
de.haumacher.ehome.zigbee.ZigbeeLive$DeviceState = Device state
de.haumacher.ehome.zigbee.ZigbeeLive$DeviceState.tooltip = The live state of a device, as the controller's events tell it.
de.haumacher.ehome.zigbee.ZigbeeLive.DeviceState.INTERVIEWING = Interviewing
de.haumacher.ehome.zigbee.ZigbeeLive.DeviceState.INTERVIEWING.tooltip = The device joined, or the controller interviews it.
de.haumacher.ehome.zigbee.ZigbeeLive.DeviceState.INTERVIEW_FAILED = Interview failed
de.haumacher.ehome.zigbee.ZigbeeLive.DeviceState.INTERVIEW_FAILED.tooltip = The interview failed; the controller tries again when it hears the device.
de.haumacher.ehome.zigbee.ZigbeeLive.DeviceState.LEFT = Left
de.haumacher.ehome.zigbee.ZigbeeLive.DeviceState.LEFT.tooltip = The device announced its leave; rejoining restores it.
de.haumacher.ehome.zigbee.ZigbeePermitAction = Zigbee permit action
de.haumacher.ehome.zigbee.ZigbeePermitAction.Config.seconds = Seconds
de.haumacher.ehome.zigbee.ZigbeePermitAction.Config.seconds.tooltip = The time in seconds the network is opened for (1..254); 0 closes it.
de.haumacher.ehome.zigbee.ZigbeePermitAction.tooltip = <i>View action</i> opening the Zigbee network of a controller for pairing (<code>POST /api/zigbee/permit</code>), or closing it, see <code>ZigbeeController#permit(TLObject, int)</code>. <p> The input is a controller (<code>ehome.runtime:Controller</code>) or a project, whose controller is meant; the result is the sentence saying what the controller did. </p>
de.haumacher.ehome.zigbee.ZigbeeReporting$ChangeKind = Change kind
de.haumacher.ehome.zigbee.ZigbeeReporting$ChangeKind.tooltip = How a function's reportable change relates to the datapoint's unit.
de.haumacher.ehome.zigbee.ZigbeeReporting$Member = Member
de.haumacher.ehome.zigbee.ZigbeeReporting$Member.tooltip = The member of an override a refusal concerns.
de.haumacher.ehome.zigbee.ZigbeeReporting.ChangeKind.FIXED = Fixed
de.haumacher.ehome.zigbee.ZigbeeReporting.ChangeKind.FIXED.tooltip = The controller's fixed attribute step, which has no fixed step in the datapoint's unit (<code>illuminance</code>, <code>color_temperature</code>).
de.haumacher.ehome.zigbee.ZigbeeReporting.ChangeKind.NONE = None
de.haumacher.ehome.zigbee.ZigbeeReporting.ChangeKind.NONE.tooltip = None: a discrete value reports every change (<code>on_off</code>, <code>occupancy</code>).
de.haumacher.ehome.zigbee.ZigbeeReporting.ChangeKind.UNIT = Unit
de.haumacher.ehome.zigbee.ZigbeeReporting.ChangeKind.UNIT.tooltip = A number in the datapoint's unit, which an override may set.
de.haumacher.ehome.zigbee.ZigbeeReporting.Member.CHANGE = Change
de.haumacher.ehome.zigbee.ZigbeeReporting.Member.CHANGE.tooltip = The reportable change.
de.haumacher.ehome.zigbee.ZigbeeReporting.Member.MAX = Maximum
de.haumacher.ehome.zigbee.ZigbeeReporting.Member.MAX.tooltip = The maximum interval.
de.haumacher.ehome.zigbee.ZigbeeReporting.Member.MIN = Minimum
de.haumacher.ehome.zigbee.ZigbeeReporting.Member.MIN.tooltip = The minimum interval.
de.haumacher.ehome.zigbee.ZigbeeReporting.Member.WHOLE = Whole
de.haumacher.ehome.zigbee.ZigbeeReporting.Member.WHOLE.tooltip = The override as a whole: the function takes none.
de.haumacher.ehome.zigbee.ZigbeeSource = Zigbee source
de.haumacher.ehome.zigbee.ZigbeeSource.tooltip = Source of the <code>refresh</code> channel of the Zigbee tab of a project (haumacher/ehome #64, <code>projects/zigbee.view.xml</code>): every change of the live state of the project's controller (<i>zigbee live</i>: an event, a live import done or failed) publishes a new value, from which the view computes what it shows again; while the network is open for joining, <i>zigbee live</i> ticks once a second, so the permit countdown moves. The channel takes a value at most once a second (its <code>update-interval</code>). <p> A live import commits on another thread; before a change is published, the knowledge base is refetched, so that the view computes from the state the import left. </p>
