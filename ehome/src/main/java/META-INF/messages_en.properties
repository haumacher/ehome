de.haumacher.ehome.discover.DiscoverGatewaysAction = Discover gateways action
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.timeout = Timeout
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.timeout.tooltip = Seconds to wait for answers.
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-multicast = Use multicast
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-multicast.tooltip = Whether to send the search request by multicast.
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-nat = Use nat
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-nat.tooltip = Whether to search through a NAT router.
de.haumacher.ehome.discover.DiscoverGatewaysAction.tooltip = <i>View action</i> searching the local networks for KNXnet/IP gateways. <p> The input is either nothing or a map with the search settings: <code>interface</code> (name of the network interface to search on, all interfaces if empty), <code>local-host</code> (local address to send from), <code>use-nat</code> and <code>use-multicast</code>; settings missing in the map are taken from the configuration. The result is the list of gateways that answered, one map per gateway (a gateway that answered several times is listed once) with the keys <code>name</code>, <code>address</code>, <code>endpoint</code>, <code>mac</code>, <code>serial</code> and <code>medium</code>, to be displayed as rows of a table. </p>
de.haumacher.ehome.discover.KnxNetworkInterfaces$Builder = Builder
de.haumacher.ehome.discover.KnxNetworkInterfaces$Builder.tooltip = Builder for <i>knx network interfaces</i>.
de.haumacher.ehome.etsImport.ImportEtsProjectAction = Import ets project action
de.haumacher.ehome.etsImport.ImportEtsProjectAction.tooltip = <i>View action</i> importing the uploaded ETS project files (<code>.knxproj</code>). <p> The input is the uploaded file, a collection of them, or a dictionary with the uploaded file in <code>file</code> and the project password in <code>password</code>. Each file is imported in a transaction of its own. The result is the report of the import, a dictionary: <code>project</code> is the project created by the last import (for a following <code>&lt;write-channel&gt;</code>), <code>messages</code> the warnings and errors the import reported (each a dictionary with <code>file</code>, <code>severity</code>, <code>level</code> and <code>message</code>), and <code>summary</code> a sentence naming the imported projects and the number of messages. The messages do not change the outcome: a file that cannot be imported fails the action. </p> <p> A single file whose project is protected by a password, uploaded without one, is not imported: the result is a dictionary with <code>passwordRequired</code> set to <code>true</code>, the file in <code>file</code> and the reason in <code>message</code>, so that the view can ask for the password and import the file again. A wrong password fails the action with the reason. </p>
de.haumacher.ehome.etsImport.ImportProductDataAction = Import product data action
de.haumacher.ehome.etsImport.ImportProductDataAction.tooltip = <i>View action</i> importing the uploaded product files of manufacturers (<code>.knxprod</code>) into the catalog. <p> The input is the uploaded file, or a collection of them. Each file is imported in a transaction of its own, with the mapping of the project import (see <code>Importer#importProductData</code>): the manufacturers, catalogs, products and application programs the catalog already holds are reused by their IDs, an application program already known is skipped. The result is the report of the import, a dictionary like the one of <i>import ets project action</i>: <code>manufacturer</code> is the manufacturer of the file imported last, <code>summary</code> a sentence naming for each file the manufacturers, products and application programs imported and those already known, and the number of messages, <code>messages</code> the warnings and errors the import reported. A file that cannot be imported (a project file, a file with baggage or encrypted entries) fails the action with the reason. </p>
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat = Enumeration format
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat.Config.default-value = Default value
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat.Config.type = Type
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat.tooltip = Format reading a classifier of an enumeration by its name. <p> A value that is no identifier is matched with its letters, digits and underscores only, so that the classifier <code>DPT9</code> reads the ETS value <code>DPT 9</code>. </p>
de.haumacher.ehome.etsImport.importer.format.TLEnumerationSetFormat = Enumeration set format
de.haumacher.ehome.etsImport.importer.format.TLEnumerationSetFormat.Config.type = Type
de.haumacher.ehome.etsImport.importer.format.TLEnumerationSetFormat.Config.type.tooltip = The qualified name of the enumeration.
de.haumacher.ehome.etsImport.importer.format.TLEnumerationSetFormat.tooltip = Format reading a list of classifiers of an enumeration from their names separated by spaces (an XML Schema list, e.g. <code>remote local1</code>), for a multiple reference to an enumeration.
de.haumacher.ehome.exporter.ExportKnxprojAction = Export knxproj action
de.haumacher.ehome.exporter.ExportKnxprojAction.tooltip = <i>View action</i> exporting the input project (<code>ehome.project:Project</code>) as an ETS project archive with <i>knxproj exporter</i>. <p> The result is the archive as binary data named after the project (<code>&lt;name&gt;.knxproj</code>), for a dialog offering it for download. The archive is not signed, so ETS does not import it. </p>
de.haumacher.ehome.importer.DefaultLanguage = Default language
de.haumacher.ehome.importer.DefaultLanguage.Config.contents = Contents
de.haumacher.ehome.importer.DefaultLanguage.Config.contents.tooltip = The handlers importing the element.
de.haumacher.ehome.importer.DefaultLanguage.Config.xml-attribute = XML attribute
de.haumacher.ehome.importer.DefaultLanguage.Config.xml-attribute.tooltip = The XML attribute naming the language.
de.haumacher.ehome.importer.DefaultLanguage.tooltip = Imports an element with the language its texts are written in: the element's <code>DefaultLanguage</code>, made available to <i>internationalization property import</i> in the variable <code>"language"</code>.
de.haumacher.ehome.importer.DeviceScope = Device scope
de.haumacher.ehome.importer.DeviceScope.Config.contents = Contents
de.haumacher.ehome.importer.DeviceScope.Config.contents.tooltip = The handlers importing the content of the device.
de.haumacher.ehome.importer.DeviceScope.tooltip = Imports the content of a device (ETS: <code>DeviceInstance</code>) with the scopes that the short IDs of newer ETS versions are relative to. <p> Since ETS 5, a device names its communication objects by IDs relative to its application program (<code>O-2_R-1</code> for <code>M-0083_A-0028-38-DB99_O-2_R-1</code>), and since ETS 5.7 the group addresses it is linked to by IDs relative to its installation (<code>GA-1</code> for <code>P-047E-0_GA-1</code>). The program is the one of the device's program assignment (<code>Hardware2ProgramRefId</code>); the installation is the scope of the device's own ID. Both are made available in the variables <code>"programId"</code> and <code>"installationId"</code> for <i>program reference</i> and <i>group links</i>. </p>
de.haumacher.ehome.importer.GroupLinks = Group links
de.haumacher.ehome.importer.GroupLinks.Config.xml-attribute = XML attribute
de.haumacher.ehome.importer.GroupLinks.Config.xml-attribute.tooltip = The XML attribute holding the links.
de.haumacher.ehome.importer.GroupLinks.tooltip = Imports the group addresses a communication object of a device is linked to, as ETS 5.7 and later write them: the attribute <code>Links</code> of a <code>ComObjectInstanceRef</code>, a list of group address IDs separated by spaces, relative to the installation (see <i>device scope</i>). <p> The first address is the one the object sends to, the others are those it receives from; each becomes a connection (<code>ehome.physical:Connection</code>) of the object, as the <code>Connectors</code> of ETS 4 do. </p>
de.haumacher.ehome.importer.I18NPropertyImport = Internationalization property import
de.haumacher.ehome.importer.I18NPropertyImport.Config.name = Name
de.haumacher.ehome.importer.I18NPropertyImport.Config.name.tooltip = The model attribute to fill.
de.haumacher.ehome.importer.I18NPropertyImport.Config.xml-attribute = XML attribute
de.haumacher.ehome.importer.I18NPropertyImport.Config.xml-attribute.tooltip = The XML attribute holding the text.
de.haumacher.ehome.importer.I18NPropertyImport.tooltip = Imports an XML attribute into an internationalized attribute (<code>tl.model.i18n:I18NString</code>) of the current object, as the text of the element's language (see <i>default language</i>). <p> Without a known language, the text is filed under the application's fallback language. Texts of other languages come from the translations of the file (see <i>translations import</i>). </p>
de.haumacher.ehome.importer.MasterDataVersion = Master data version
de.haumacher.ehome.importer.MasterDataVersion.Config.contents = Contents
de.haumacher.ehome.importer.MasterDataVersion.Config.contents.tooltip = The handlers importing the master data.
de.haumacher.ehome.importer.MasterDataVersion.Config.xml-attribute = XML attribute
de.haumacher.ehome.importer.MasterDataVersion.Config.xml-attribute.tooltip = The XML attribute holding the version.
de.haumacher.ehome.importer.MasterDataVersion.tooltip = Imports the master data of a project file (<code>MasterData</code>) with their version (<code>MasterData@Version</code>, 92 in the ETS 4 samples, 198 in the ETS 6 sample), made available to <i>versioned master data</i> in the variable <code>"masterDataVersion"</code>. <p> The variable is <code>null</code> if the master data name no version. </p>
de.haumacher.ehome.importer.ModulesNotImported = Modules not imported
de.haumacher.ehome.importer.ModulesNotImported.tooltip = Handles the dynamic modules of an application program (ETS 5.6 and later: <code>ModuleDefs</code>), which E-Home does not import. <p> The parameters and communication objects of the modules are missing in the program, so a download would be incomplete: the program is marked (<code>ehome.operational:Program#usesModules</code>), which makes the download refuse it, and the import reports a warning naming the program. The module definitions are skipped. </p>
de.haumacher.ehome.importer.NamedValuesImport = Named values import
de.haumacher.ehome.importer.NamedValuesImport.tooltip = Imports the named values of a datapoint subtype from its encoding (ETS 5.5 and later: <code>DatapointSubtype/Format</code>) into <code>ehome.datapoint:DatapointSubtype#values</code>. <p> Read are the values of a subtype whose value is an enumeration: a <code>Format</code> consisting of one <code>Enumeration</code> (20.102 HVAC mode: 0 "Auto", 1 "Comfort", ...). An enumeration that is one field of a composed value (the day of 10.001 time of day, the fields of 219.001) names the values of that field, not of the subtype; the model has no fields of a datapoint type, so these are not read. A value known from an earlier import (by its ID) is reused, its text updated. </p>
de.haumacher.ehome.importer.PlaceReference = Place reference
de.haumacher.ehome.importer.PlaceReference.Config.id-attribute = ID attribute
de.haumacher.ehome.importer.PlaceReference.Config.id-attribute.tooltip = The XML attribute holding the ID of the placed reference.
de.haumacher.ehome.importer.PlaceReference.tooltip = Places a parameter or communication object reference (ETS: <code>ParameterRefRef</code>, <code>ComObjectRefRef</code>) in the structure element being imported. <p> The first place of a reference owns it (<code>ehome.operational:ConfigFragment#contents</code>). ETS 6 places one reference in several cases of a switch; every further place gets an <code>ehome.operational:SharedPlacement</code> referring to it, so that the reference keeps one identity: its ID, its default, and the device settings referring to it. </p>
de.haumacher.ehome.importer.ProgramReference = Program reference
de.haumacher.ehome.importer.ProgramReference.tooltip = Imports a reference from a device to a part of its application program, given by a full ID (ETS 4) or by an ID relative to the program (ETS 5 and later: <code>O-2_R-1</code>), see <i>device scope</i>.
de.haumacher.ehome.importer.TranslationsImport = Translations import
de.haumacher.ehome.importer.TranslationsImport$Mapping = Mapping
de.haumacher.ehome.importer.TranslationsImport$Mapping.tooltip = Maps the translations of an XML attribute of objects of a model type to a model attribute.
de.haumacher.ehome.importer.TranslationsImport.Config.mappings = Mappings
de.haumacher.ehome.importer.TranslationsImport.Config.mappings.tooltip = Which model attribute the translations of an XML attribute go to, per model type.
de.haumacher.ehome.importer.TranslationsImport.Mapping.attribute = Attribute
de.haumacher.ehome.importer.TranslationsImport.Mapping.attribute.tooltip = The internationalized model attribute receiving the translations.
de.haumacher.ehome.importer.TranslationsImport.Mapping.type = Type
de.haumacher.ehome.importer.TranslationsImport.Mapping.type.tooltip = The model type of the objects (including its specializations).
de.haumacher.ehome.importer.TranslationsImport.Mapping.xml-attribute = XML attribute
de.haumacher.ehome.importer.TranslationsImport.Mapping.xml-attribute.tooltip = The XML attribute whose translations are mapped.
de.haumacher.ehome.importer.TranslationsImport.tooltip = Imports the <code>Languages</code> section of an ETS file: the texts of the file's objects in further languages. <pre> &lt;Language Identifier="de-DE"&gt; &lt;TranslationUnit RefId="..."&gt; &lt;TranslationElement RefId="(object ID)"&gt; &lt;Translation AttributeName="Text" Text="..."/&gt; </pre> <p> The object is looked up by its ID among the objects of this import and the shared objects known from earlier imports. The mappings say which model attribute an XML attribute of an object of a given type is imported into; translations of other attributes are ignored. </p> <p> The translations of an application program of the import (a translation unit named by its ID) record their languages in the program; those of a known program set only the texts of the languages it lacks, see <i>program languages</i>. </p>
de.haumacher.ehome.importer.TypedValueImport = Typed value import
de.haumacher.ehome.importer.TypedValueImport.Config.xml-attribute = XML attribute
de.haumacher.ehome.importer.TypedValueImport.Config.xml-attribute.tooltip = The XML attribute holding the value.
de.haumacher.ehome.importer.TypedValueImport.tooltip = Imports a parameter value as ETS writes it into the typed value of the current object (a parameter, parameter reference or parameter setting), decoded according to the object's parameter type, see <code>ParameterValues#decode(TLObject, String)</code>. <p> The type is read from the object's references, so they must be imported before this handler runs. ETS files define the parameter types before the parameters, and the programs before the projects using them, so the references are resolved at this point. A value that cannot be decoded for its type is kept as text and reported as a warning naming the parameter, with its location (see <code>Importer#getMessages()</code>). </p>
de.haumacher.ehome.importer.UnlessKnown = Unless known
de.haumacher.ehome.importer.UnlessKnown.Config.contents = Contents
de.haumacher.ehome.importer.UnlessKnown.Config.contents.tooltip = The handlers importing the element if its object is not known yet.
de.haumacher.ehome.importer.UnlessKnown.Config.id-attribute = ID attribute
de.haumacher.ehome.importer.UnlessKnown.Config.id-attribute.tooltip = The XML attribute holding the ID of the element.
de.haumacher.ehome.importer.UnlessKnown.Config.texts = Texts
de.haumacher.ehome.importer.UnlessKnown.Config.texts.tooltip = The ID of the <i>translations import</i> whose mappings name the texts of the element, which is an application program recording the languages of its texts; without, the languages are not recorded, and a known element is skipped.
de.haumacher.ehome.importer.UnlessKnown.tooltip = Imports an element only if the object its ID names is not known yet, and skips it otherwise. <p> Used for data that never changes under the same ID, such as an application program, whose ID includes its version: an import that finds the program already in the database (see <i>importer</i>) skips it with all its content instead of creating it again. </p> <p> With texts, the element is an application program, which records the languages of its texts (see <i>program languages</i>): ETS writes the same program in the language of the installation that exports it. A new program records the base language of the element (<code>DefaultLanguage</code>); a known one that lacks it gets the texts of the element in that language. </p>
de.haumacher.ehome.importer.VersionedMasterData = Versioned master data
de.haumacher.ehome.importer.VersionedMasterData.Config.contents = Contents
de.haumacher.ehome.importer.VersionedMasterData.Config.contents.tooltip = The handlers creating the object.
de.haumacher.ehome.importer.VersionedMasterData.Config.id-attribute = ID attribute
de.haumacher.ehome.importer.VersionedMasterData.Config.id-attribute.tooltip = The XML attribute holding the ID of the element.
de.haumacher.ehome.importer.VersionedMasterData.Config.version-attribute = Version attribute
de.haumacher.ehome.importer.VersionedMasterData.Config.version-attribute.tooltip = The attribute of the object recording the version of the master data it comes from.
de.haumacher.ehome.importer.VersionedMasterData.tooltip = Imports an object of the master data that exists only once and records the version of the master data it comes from (see <i>master data version</i>). <p> An object not known yet is created by the contents and gets the ID the element names. For an object already known (see <i>importer</i>), the contents create a transient candidate without an ID, which <i>master data updates</i> compares with the known object at the end of the import: master data of a higher version than the known object's update it in place, other master data keep it and report a warning if they define it differently. References to the ID always resolve to the known object. </p> <p> The contents must create the object anonymously (without <code>id-attribute</code>), and nothing outside the object may refer to its parts: an update replaces them. </p>
