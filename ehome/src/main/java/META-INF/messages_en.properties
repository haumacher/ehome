de.haumacher.ehome.runtime.IdRenames = ID renames
de.haumacher.ehome.runtime.IdRenames.tooltip = Follows a renamed id in the expressions of the project (haumacher/ehome #111): when the id of a rule parameter, a timer, a state or an application datapoint, or the id of the datapoint of a group address (its identifier, else its address, haumacher/ehome #130) changes, the expressions of the project's rules that name it are rewritten in the same transaction (<i>expression renames</i>). An expression entered or changed that names a group address with an identifier by its address (<code>@"1/2/3"</code>) is written with the identifier (<code>@kueche.licht</code>), the name of its datapoint in the image. <p> A <i>modification listener</i> of the knowledge base: it sees every commit, whichever code changed the id (a form, a table, an import in Java), compares the id of each updated object with its value before the transaction and rewrites the expressions in the <i>modification</i> it returns, which the knowledge base runs within the commit, before the commit checks. A commit refused by them (an id the model's constraints refuse, such as a parameter id outside the characters of haumacher/ehome #110) rolls the rewrite back with the rename. Objects created in the transaction have no id to follow; an object deleted and created again is no rename. </p> <p> After the commit succeeded, the user is told how many expressions were adjusted and, for a renamed parameter, that the value set on the controller is lost (homecontrol <code>spec/rules.md</code> 8.4, D5), for a renamed datapoint with a persisted value or a history that the controller loses them with the next deployment, since it keeps them by id (homecontrol <code>spec/runtime-image.md</code> 3.3): an after-commit action of the transaction (<i>commit actions</i>) shows them through the <i>info service</i> of the interaction, which the view layer shows in the window that saved (outside a window, e.g. in a job, nothing is shown). </p> <p> Registered in <code>WEB-INF/autoconf/ehome.runtime.config.xml</code>. </p>
