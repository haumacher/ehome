de.haumacher.ehome.monitor.MonitorSource = Monitor source
de.haumacher.ehome.monitor.MonitorSource.Config.project = Project
de.haumacher.ehome.monitor.MonitorSource.Config.project.tooltip = The channel holding the project whose monitor is shown.
de.haumacher.ehome.monitor.MonitorSource.tooltip = Source of the <code>state</code> channel of the group monitor (<code>projects/monitor.view.xml</code>): while the view is displayed, every change of the monitor of the project in the session (<i>monitor sessions</i>) publishes its snapshot, with the texts in the language of the user who displays it. A subscription publishes the current snapshot right away, so that a view displayed again (or a page loaded again) shows the monitor as it is, connected or not. The channel takes a value at most every <code>update-interval</code> ms. <p> The monitor stays attached to the bus while its page is open, also while its tab is hidden. When the last window that showed it is gone, the monitor is detached from the bus, so that a closed page does not keep a tunnelling connection of the gateway. The open window is its sub-session, as the engine's <code>ChannelSource</code> documents (TL #30088): the first subscription in a window binds a <i>window hold</i> to the monitor, which keeps it attached while the view is hidden, and which the sub-session tells when it ends - the window closed, its page unloaded and not come back, its client stayed away (TL #29869), or the session ended. </p>
