de.haumacher.ehome.importer.DeviceScope.Config.contents = Contents
de.haumacher.ehome.importer.DeviceScope.Config.contents.tooltip = The handlers importing the content of the device.
de.haumacher.ehome.importer.DeviceScope.tooltip = Imports the content of a device (ETS: <code>DeviceInstance</code>) with the scopes that the short IDs of newer ETS versions are relative to. <p> Since ETS 5, a device names its communication objects by IDs relative to its application program (<code>O-2_R-1</code> for <code>M-0083_A-0028-38-DB99_O-2_R-1</code>), and since ETS 5.7 the group addresses it is linked to by IDs relative to its installation (<code>GA-1</code> for <code>P-047E-0_GA-1</code>). The program is the one of the device's program assignment (<code>Hardware2ProgramRefId</code>); the installation is the scope of the device's own ID. Both are made available in the variables <code>"programId"</code> and <code>"installationId"</code> for <i>program reference</i> and <i>group links</i>. </p>
de.haumacher.ehome.importer.GroupLinks = Group links
de.haumacher.ehome.importer.GroupLinks.Config.xml-attribute = XML attribute
de.haumacher.ehome.importer.GroupLinks.Config.xml-attribute.tooltip = The XML attribute holding the links.
de.haumacher.ehome.importer.GroupLinks.tooltip = Imports the group addresses a communication object of a device is linked to, as ETS 5.7 and later write them: the attribute <code>Links</code> of a <code>ComObjectInstanceRef</code>, a list of group address IDs separated by spaces, relative to the installation (see <i>device scope</i>). <p> The first address is the one the object sends to, the others are those it receives from; each becomes a connection (<code>ehome.physical:Connection</code>) of the object, as the <code>Connectors</code> of ETS 4 do. </p>
de.haumacher.ehome.importer.KnownProgramTexts = Known program texts
de.haumacher.ehome.importer.KnownProgramTexts.tooltip = Updates a known application program (the <code>this</code> of an <code>&lt;update&gt;</code> of <code>&lt;unless-known&gt;</code>) with the texts of the file's language, if the program lacks it (haumacher/ehome #38). <p> An application program never changes under its ID, which includes its version, so a known one is not imported again. But a program records the languages of its texts (see <i>program languages</i>), and ETS writes the same program in the language of the installation that exports it. If the stored program lacks the language of the element (the variable <code>"language"</code>, bound to its <code>DefaultLanguage</code>), the content handlers set the texts (the text groups of the program's elements, applied to its known descendants by <code>&lt;update-known&gt;</code>), and the language is recorded; otherwise the element is skipped. Either way the program is known to the translations of the file, which add only the languages it lacked before the import. </p> <p> The decision and the record are the app's: the engine's <code>condition</code> of <code>&lt;update&gt;</code> could decide, but not record what the import added. </p>
de.haumacher.ehome.importer.ModuleOrder = Module order
de.haumacher.ehome.importer.ModuleOrder.tooltip = Sets the position of the current <code>Module</code> or <code>Repeat</code> element in its document (ETS: XmlOrder, see <code>ModuleScan#getOrder(String)</code>) as the <code>order</code> of the placement or repeat it creates (haumacher/ehome #119). <p> It reads nothing of the element. </p>
de.haumacher.ehome.importer.NamedValuesImport = Named values import
de.haumacher.ehome.importer.NamedValuesImport.tooltip = Imports the named values of a datapoint subtype from its encoding (ETS 5.5 and later: <code>DatapointSubtype/Format</code>) into <code>ehome.datapoint:DatapointSubtype#values</code>. <p> Read are the values of a subtype whose value is an enumeration: a <code>Format</code> consisting of one <code>Enumeration</code> (20.102 HVAC mode: 0 "Auto", 1 "Comfort", ...). An enumeration that is one field of a composed value (the day of 10.001 time of day, the fields of 219.001) names the values of that field, not of the subtype; the model has no fields of a datapoint type, so these are not read. A value known from an earlier import (by its ID) is reused, its text updated. </p>
de.haumacher.ehome.importer.PlaceReference = Place reference
de.haumacher.ehome.importer.PlaceReference.Config.id-attribute = ID attribute
de.haumacher.ehome.importer.PlaceReference.Config.id-attribute.tooltip = The XML attribute holding the ID of the placed reference.
de.haumacher.ehome.importer.PlaceReference.tooltip = Places a parameter or communication object reference (ETS: <code>ParameterRefRef</code>, <code>ComObjectRefRef</code>) in the structure element being imported. <p> The first place of a reference owns it (<code>ehome.operational:ConfigFragment#contents</code>). ETS 6 places one reference in several cases of a switch; every further place gets an <code>ehome.operational:SharedPlacement</code> referring to it, so that the reference keeps one identity: its ID, its default, and the device settings referring to it. </p>
de.haumacher.ehome.importer.ProgramImported = Program imported
de.haumacher.ehome.importer.ProgramImported.tooltip = Concludes the import of a new application program (the <code>this</code> of its <code>&lt;object&gt;</code>, as its last handler, after the handlers reading its element): records the language of its texts (see <i>program languages</i>), and reports the warnings about values of the program held back until the access of their parameters is known (see <i>hidden program values</i>). <p> It reads nothing of the element. </p>
de.haumacher.ehome.importer.ProgramReference = Program reference
de.haumacher.ehome.importer.ProgramReference.tooltip = Imports a reference from a device to a part of its application program, given by a full ID (ETS 4) or by an ID relative to the program (ETS 5 and later: <code>O-2_R-1</code>), see <i>device scope</i>.
de.haumacher.ehome.importer.ReadModules = Read modules
de.haumacher.ehome.importer.ReadModules.Config.definitions = Definitions
de.haumacher.ehome.importer.ReadModules.Config.definitions.tooltip = Whether the element is the module definitions of the program (else a placement or repeat).
de.haumacher.ehome.importer.ReadModules.tooltip = Reads the dynamic modules of an application program (haumacher/ehome #119) with its content handlers: the module definitions (<code>ModuleDefs</code>), or a placement of a module (<code>Module</code>) or a repeated part (<code>Repeat</code>) of the structure, unless the program uses a construct the import cannot interpret (see <code>ModuleScan#getRefusal(String)</code>). <p> Then the element is skipped: for the module definitions, the program is marked (<code>ehome.operational:Program#usesModules</code>), which makes the download refuse it, and the import reports a warning naming the program and the construct; a placement or repeat is skipped without a further message. The device's settings and objects of instances of its modules are left out with a warning per device (<code>Importer</code>). </p>
de.haumacher.ehome.importer.TranslationsImport = Translations import
de.haumacher.ehome.importer.TranslationsImport$Mapping = Mapping
de.haumacher.ehome.importer.TranslationsImport$Mapping.tooltip = Maps the translations of an XML attribute of objects of a model type to a model attribute.
de.haumacher.ehome.importer.TranslationsImport.Config.mappings = Mappings
de.haumacher.ehome.importer.TranslationsImport.Config.mappings.tooltip = Which model attribute the translations of an XML attribute go to, per model type.
de.haumacher.ehome.importer.TranslationsImport.Mapping.attribute = Attribute
de.haumacher.ehome.importer.TranslationsImport.Mapping.attribute.tooltip = The internationalized model attribute receiving the translations.
de.haumacher.ehome.importer.TranslationsImport.Mapping.type = Type
de.haumacher.ehome.importer.TranslationsImport.Mapping.type.tooltip = The model type of the objects (including its specializations).
de.haumacher.ehome.importer.TranslationsImport.Mapping.xml-attribute = XML attribute
de.haumacher.ehome.importer.TranslationsImport.Mapping.xml-attribute.tooltip = The XML attribute whose translations are mapped.
de.haumacher.ehome.importer.TranslationsImport.tooltip = Imports the <code>Languages</code> section of an ETS file: the texts of the file's objects in further languages. <pre> &lt;Language Identifier="de-DE"&gt; &lt;TranslationUnit RefId="..."&gt; &lt;TranslationElement RefId="(object ID)"&gt; &lt;Translation AttributeName="Text" Text="..."/&gt; </pre> <p> The object is looked up by its ID among the objects of this import and the shared objects known from earlier imports. The mappings say which model attribute an XML attribute of an object of a given type is imported into; translations of other attributes are ignored. </p> <p> The translations of an application program of the import (a translation unit named by its ID) record their languages in the program; those of a known program set only the texts of the languages it lacks, see <i>program languages</i>, and the texts of the parts the import added to it (see <i>complete modules</i>). </p>
de.haumacher.ehome.importer.TypedValueImport = Typed value import
de.haumacher.ehome.importer.TypedValueImport.Config.xml-attribute = XML attribute
de.haumacher.ehome.importer.TypedValueImport.Config.xml-attribute.tooltip = The XML attribute holding the value.
de.haumacher.ehome.importer.TypedValueImport.tooltip = Imports a parameter value as ETS writes it into the typed value of the current object (a parameter, parameter reference or parameter setting), decoded according to the object's parameter type, see <code>ParameterValues#decode(TLObject, String)</code>. <p> The type is read from the object's references, so they must be imported before this handler runs. ETS files define the parameter types before the parameters, and the programs before the projects using them, so the references are resolved at this point. A value that cannot be decoded for its type is kept as text and reported as a warning naming the parameter, with its location (see <code>Importer#getMessages()</code>). </p> <p> A value of the application program itself (of a parameter or a parameter reference) is reported only if the parameter is visible, see <i>hidden program values</i>. A value of the project (a parameter setting) is always reported. </p>
de.haumacher.ehome.importer.VersionedMasterData = Versioned master data
de.haumacher.ehome.importer.VersionedMasterData.Config.contents = Contents
de.haumacher.ehome.importer.VersionedMasterData.Config.contents.tooltip = The handlers creating the object.
de.haumacher.ehome.importer.VersionedMasterData.Config.id-attribute = ID attribute
de.haumacher.ehome.importer.VersionedMasterData.Config.id-attribute.tooltip = The XML attribute holding the ID of the element.
de.haumacher.ehome.importer.VersionedMasterData.Config.version-attribute = Version attribute
de.haumacher.ehome.importer.VersionedMasterData.Config.version-attribute.tooltip = The attribute of the object recording the version of the master data it comes from.
de.haumacher.ehome.importer.VersionedMasterData.tooltip = Imports an object of the master data that exists only once and records the version of the master data it comes from: <code>MasterData@Version</code> (92 in the ETS 4 samples, 198 in the ETS 6 sample), bound by <code>&lt;with-var&gt;</code> in <code>etsImporter.xml</code> to the variable <code>"masterDataVersion"</code>. <p> An object not known yet is created by the contents and gets the ID the element names. For an object already known (found by <code>&lt;resolve-existing&gt;</code>), the contents create a transient candidate without an ID, which <i>master data updates</i> compares with the known object at the end of the import: master data of a higher version than the known object's update it in place, other master data keep it and report a warning if they define it differently. References to the ID always resolve to the known object. </p> <p> The contents must create the object anonymously (without <code>id-attribute</code>), and nothing outside the object may refer to its parts: an update replaces them. </p>
