de.haumacher.ehome.connection.CreateEnrollmentCodeAction = Create enrollment code action
de.haumacher.ehome.connection.CreateEnrollmentCodeAction.tooltip = <i>View action</i> creating an enrollment code for the input project (haumacher/ehome #54, <code>Enrollment#createCode(TLObject, com.top_logic.knowledge.wrap.person.Person, Instant)</code>), replacing an open one. <p> The result is the sentence naming the code, the time it expires and the minutes it stays valid, for a dialog (the only place the code is shown besides the project's hidden attribute). </p>
de.haumacher.ehome.connection.CreateInstallationKeyAction = Create installation key action
de.haumacher.ehome.connection.CreateInstallationKeyAction.tooltip = <i>View action</i> creating the installation key of the input project (homecontrol issue #35, <code>InstallationKeys#create(TLObject)</code>), which has none: a new Ed25519 key pair, offered to the project's connected controllers at once and to the others at their next connection. <p> The result is the sentence naming the fingerprint of the new key, which the owner compares with the one the controller's Settings page shows before accepting it. </p>
de.haumacher.ehome.connection.ForgetControllerAction = Forget controller action
de.haumacher.ehome.connection.ForgetControllerAction.tooltip = <i>View action</i> forgetting the input controller (<code>ehome.runtime:Controller</code>, haumacher/ehome #54): deletes it (<code>Controllers#forget(TLObject)</code>) and closes its connection, which is refused from now on. A later enrollment of the same device is a new controller. <p> The result is the sentence saying so. </p>
de.haumacher.ehome.connection.RenewInstallationKeyAction = Renew installation key action
de.haumacher.ehome.connection.RenewInstallationKeyAction.tooltip = <i>View action</i> renewing the installation key of the input project (homecontrol issue #35, <code>InstallationKeys#renew(TLObject)</code>): a new Ed25519 key pair is offered to the controllers, and the old key stays the signing key until they accept the new one. <p> The result is the sentence naming the fingerprint of the new key, which the owner compares with the one the controller's Settings page shows before accepting it. </p>
de.haumacher.ehome.discover.DiscoverGatewaysAction = Discover gateways action
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.timeout = Timeout
