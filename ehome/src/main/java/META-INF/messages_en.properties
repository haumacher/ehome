de.haumacher.ehome.knx.WithinGroupRange = Within group range
de.haumacher.ehome.knx.WithinGroupRange.tooltip = Constraint keeping group addresses and group ranges within the range of the group range that contains them, and a range's start before its end. <p> Annotated to <code>GroupAddress#address</code>, <code>GroupRange#rangeStart</code> and <code>GroupRange#rangeEnd</code>. An object that is not (yet) contained in a group range is only checked for the order of its own bounds. </p>
