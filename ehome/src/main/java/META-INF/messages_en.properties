de.haumacher.ehome.monitor.ConnectMonitorAction.Config.state.tooltip = The channel receiving the snapshots of the monitor.
de.haumacher.ehome.monitor.ConnectMonitorAction.Source.CONTROLLER = Controller
de.haumacher.ehome.monitor.ConnectMonitorAction.Source.CONTROLLER.tooltip = The monitor stream of the project's HomeControl controller.
de.haumacher.ehome.monitor.ConnectMonitorAction.Source.GATEWAY = Gateway
de.haumacher.ehome.monitor.ConnectMonitorAction.Source.GATEWAY.tooltip = The KNXnet/IP gateway of the project.
de.haumacher.ehome.monitor.ConnectMonitorAction.tooltip = <i>View action</i> attaching the group monitor of a project to the bus through the project's gateway (<code>ehome.project:Project#gateway</code>) or, with <code>source="controller"</code>, through the monitor stream of a HomeControl controller (<i>controller bus link</i>), and the view to the monitor. <p> The input is the project. With <code>source="controller"</code> it may instead be a dictionary naming the controller (haumacher/ehome #56, <code>ControllerTarget#of</code>): <code>project</code>, <code>controller</code> (a registered controller), <code>host</code>, <code>port</code> and <code>token</code> (one entered ad hoc, or a token entered for the registered one); a project alone stands for its own controller. The monitor is the one of the project in the session (<i>monitor sessions</i>); one that is still connected to the same gateway or controller is not connected again, one connected to the other source is reconnected. From now on every change of the monitor writes its <code>GroupMonitor#snapshot()</code> to the configured channel (<i>window publisher</i>); the result is the current snapshot. </p>
