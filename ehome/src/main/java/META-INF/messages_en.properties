de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationStop.tooltip = <code>simulationStop(project)</code>: stops the simulation.
de.haumacher.ehome.simulation.SimulationSource = Simulation source
de.haumacher.ehome.simulation.SimulationSource.tooltip = Source of the <code>refresh</code> channel of the simulation of a project (haumacher/ehome #62, <code>projects/simulation.view.xml</code>): every change of the simulation (it starts or stops, a telegram arrives, the clock moves, a rule acts) publishes a new value, from which the view computes the state of the simulation again. The channel takes a value at most every 500 ms (its <code>update-interval</code>), so a burst of telegrams or a clock running at 60 times real time is one update per interval. <p> It listens to the simulation of the project on the <code>project</code> channel (<code>Simulations#addListener(TLObject, Runnable)</code>) while the view is displayed. </p>
de.haumacher.ehome.simulation.Simulations = Simulations
de.haumacher.ehome.simulation.Simulations.Config.directory = Directory
de.haumacher.ehome.simulation.Simulations.Config.directory.tooltip = The directory of the files of the KNXnet/IP servers of the virtual installations; aliases such as <code>%STORAGE_PATH%</code> are expanded.
de.haumacher.ehome.simulation.Simulations.tooltip = The running simulations of the application: at most one per project, shared by everybody who looks at the project, all stopped when the application shuts down. A simulation is transient: only its parameter overrides are kept with the project (<i>overrides</i>). The values of its virtual Zigbee devices are kept in memory until the application stops: the next simulation of the project starts with them, as real devices keep their state while the controller restarts. <p> Whoever shows a simulation registers a listener for its project (<code>#addListener(TLObject, Runnable)</code>): it is told when the simulation of the project starts or stops and about every change of the running one (<code>Simulation#setListener(Runnable)</code>), from whatever thread the change happens on; it must only take note. </p> <p> Registered in <code>WEB-INF/autoconf/ehome.simulation.config.xml</code>. </p>
