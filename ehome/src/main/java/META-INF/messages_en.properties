de.haumacher.ehome.runtime.RuleFunctions.Function.ruleMoveVeto = Rule move veto
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleMoveVeto.tooltip = <code>ruleMoveVeto(part, delta)</code>: why the part cannot be moved so far, <code>null</code> if it can.
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleOptionLabel = Rule option label
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleOptionLabel.tooltip = <code>ruleOptionLabel(option, kind)</code>: the label of an option of a reference of the given kind, with the id the image names it by (<code>RuleReferences#optionLabel(Object, String)</code>).
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleOptions = Rule options
