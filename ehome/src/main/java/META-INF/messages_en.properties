de.haumacher.ehome.runtime.RuntimeFunctions.Function.nextImageRevision = Next image revision
de.haumacher.ehome.runtime.RuntimeFunctions.Function.nextImageRevision.tooltip = <code>nextImageRevision(project)</code>: the revision the next deployment carries.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeBuildingParts = Runtime building parts
