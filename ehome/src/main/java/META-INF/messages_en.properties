de.haumacher.ehome.runtime.StateDatapoints = State datapoints
de.haumacher.ehome.runtime.StateDatapoints.tooltip = Gives every rule its state datapoint (haumacher/ehome #140, homecontrol <code>spec/rules.md</code> 8.8): the part <code>ehome.runtime:Rule#stateDatapoint</code>, an <code>ehome.runtime:RuleStateDatapoint</code>, which a trigger, a virtual device or a control page names for the datapoint <code>rule/&lt;id&gt;/state</code>. The image has that datapoint while the rule has states; a reference to it of a rule without states is refused there, at its field. <p> A <i>modification listener</i> of the knowledge base: whichever code creates a rule or a state of a rule (a form, the import of rules, a project file, an agent through the model), the commit gets the rule's state datapoint in the <i>modification</i> it returns, which the knowledge base runs within the commit. At the start, the rules stored without one (before haumacher/ehome #140) get theirs in a transaction of its own. </p> <p> Registered in <code>WEB-INF/autoconf/ehome.runtime.config.xml</code>. </p>
de.haumacher.ehome.runtime.UnloadRuntimeImageAction = Unload runtime image action
de.haumacher.ehome.runtime.UnloadRuntimeImageAction.tooltip = <i>View action</i> unloading the runtime image the controller of the input project (<code>ehome.project:Project</code>) runs (<code>DELETE /api/image</code>), see <code>Deployer#unload(TLObject, Instant)</code>. <p> The result is the recorded unload (an <code>ehome.runtime:Deployment</code> marked as an unload), done or not: a refusal is an outcome to show, not a failure of the command. </p>
