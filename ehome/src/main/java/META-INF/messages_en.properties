de.haumacher.ehome.runtime.RuleTextNormalizer.tooltip = <i>Value normalizer</i> of a text of the rule language (haumacher/ehome #60): a form stores an entered expression or literal in its canonical form (<code>RuleNormalization#canonical(TLObject, String, String)</code>), the form the image carries.
