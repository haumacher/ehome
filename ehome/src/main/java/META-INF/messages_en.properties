de.haumacher.ehome.rules.Values.Status.INVALID.tooltip = Out of its range (25:00, a level of 256, a string longer than 28 bytes).
de.haumacher.ehome.rules.Values.Status.MALFORMED = Malformed
de.haumacher.ehome.rules.Values.Status.MALFORMED.tooltip = Wrong JSON kind or members.
de.haumacher.ehome.rules.Values.Status.OK = Ok
de.haumacher.ehome.rules.Values.Status.OK.tooltip = Read.
de.haumacher.ehome.runtime.ControllerStatusAction = Controller status action
de.haumacher.ehome.runtime.ControllerStatusAction.tooltip = <i>View action</i> reading what a controller runs (<code>GET /api/status</code>). <p> For a project (<code>ehome.project:Project</code>) the result is the comparison of what its controller runs with the project's last deployment (<code>ControllerStatus#drift(TLObject)</code>), for a controller (<code>ehome.runtime:Controller</code>) what it runs; a text either way. </p>
de.haumacher.ehome.runtime.CreateFunctionAction = Create function action
de.haumacher.ehome.runtime.CreateFunctionAction.tooltip = <i>View action</i> adding a new function (a light without datapoints) to the input project (<code>ehome.project:Project</code>), for the user to edit; the result is the new function.
de.haumacher.ehome.runtime.DeleteFunctionAction = Delete function action
de.haumacher.ehome.runtime.DeleteFunctionAction.tooltip = <i>View action</i> deleting the input function (<code>ehome.runtime:Function</code>) and, for a proposed one, remembering the proposal as dismissed (haumacher/ehome #49, <code>FunctionProposal#dismiss(TLObject)</code>). <p> The result is <code>null</code> (nothing selected any more). The command carries the model access checks: the action changes the project in Java. </p>
de.haumacher.ehome.runtime.DeployRuntimeImageAction = Deploy runtime image action
de.haumacher.ehome.runtime.DeployRuntimeImageAction.tooltip = <i>View action</i> deploying the runtime image of the input project (<code>ehome.project:Project</code>) to its controller, see <i>deployer</i>. <p> The result is the recorded deployment (<code>ehome.runtime:Deployment</code>), accepted or not: a refusal is an outcome to show, not a failure of the command. </p>
de.haumacher.ehome.runtime.DiscoverControllersAction = Discover controllers action
de.haumacher.ehome.runtime.DiscoverControllersAction.Config.timeout = Timeout
de.haumacher.ehome.runtime.DiscoverControllersAction.Config.timeout.tooltip = Milliseconds to collect answers.
de.haumacher.ehome.runtime.DiscoverControllersAction.tooltip = <i>View action</i> searching the local networks for HomeControl controllers (haumacher/ehome #42): the instances of the DNS-SD service <code>"_homecontrol._tcp.local"</code> that answer a multicast DNS query (<i>mdns browser</i>). <p> The input is either nothing or a map with the entry <code>interface</code>: the name of the network interface to search on (the loopback interface too); without it, the search runs on all interfaces that are up, support multicast and are no loopback interface. </p> <p> The result is the list of controllers found, one map per controller with the keys <code>name</code> (the host name without <code>.local</code>, e.g. <code>homecontrol-a1b2c3</code>), <code>instance</code> (the instance name of the announcement), <code>hostName</code>, <code>host</code> (the IPv4 address), <code>port</code> (of the web API; <code>portText</code> written without thousands separator), <code>version</code> and <code>build</code> (the TXT attributes of the announcement, empty if missing), to be displayed as rows of a table and turned into a controller (<code>ehome.runtime:Controller</code>: name, host, port). </p>
de.haumacher.ehome.runtime.ExportRuntimeImageAction = Export runtime image action
de.haumacher.ehome.runtime.ExportRuntimeImageAction.tooltip = <i>View action</i> exporting the runtime image of the input project (<code>ehome.project:Project</code>) for download, after checking it as the controller would. <p> The image carries the revision the next deployment would carry. The result is a map for a dialog: <code>file</code> (the image as JSON file named after the project, <code>null</code> for a refused image), <code>summary</code> (whether the image is valid; for a valid one what it holds, see <code>#summary(RuntimeImage)</code>), <code>refusals</code> (one map per refusal with <code>path</code>, <code>reason</code> and the <code>element</code> of the project the path leads to) and <code>notes</code> (what the export left out, one line each). </p>
de.haumacher.ehome.runtime.ImageComparison$State = State
de.haumacher.ehome.runtime.ImageComparison$State.tooltip = How the stored image relates to the image to deploy.
de.haumacher.ehome.runtime.ImageComparison.State.DIFFERENT = Different
de.haumacher.ehome.runtime.ImageComparison.State.DIFFERENT.tooltip = The controller stores another image: of another state of the project, or of another project.
de.haumacher.ehome.runtime.ImageComparison.State.IDENTICAL = Identical
de.haumacher.ehome.runtime.ImageComparison.State.IDENTICAL.tooltip = The controller stores the image of the project as it is now.
de.haumacher.ehome.runtime.ImageComparison.State.NONE = None
de.haumacher.ehome.runtime.ImageComparison.State.NONE.tooltip = The controller stores no image.
de.haumacher.ehome.runtime.ImageComparison.State.UNKNOWN = Unknown
de.haumacher.ehome.runtime.ImageComparison.State.UNKNOWN.tooltip = The controller could not be asked or did not answer with an image.
de.haumacher.ehome.runtime.ImageReport$Kind = Kind
de.haumacher.ehome.runtime.ImageReport$Kind.tooltip = The kinds of refusals, named as the conformance cases name them.
de.haumacher.ehome.runtime.ImageReport.Kind.INVALID = Invalid
de.haumacher.ehome.runtime.ImageReport.Kind.INVALID.tooltip = Everything else the document says wrong (<code>image.invalid</code>).
de.haumacher.ehome.runtime.ImageReport.Kind.NONE = None
de.haumacher.ehome.runtime.ImageReport.Kind.NONE.tooltip = Valid.
de.haumacher.ehome.runtime.ImageReport.Kind.SYNTAX = Syntax
de.haumacher.ehome.runtime.ImageReport.Kind.SYNTAX.tooltip = Not JSON (<code>image.bad_json</code>).
de.haumacher.ehome.runtime.ImageReport.Kind.TOO_LARGE = Too large
de.haumacher.ehome.runtime.ImageReport.Kind.TOO_LARGE.tooltip = More than the limit of bytes (<code>image.too_large</code>).
de.haumacher.ehome.runtime.ImageReport.Kind.VERSION = Version
de.haumacher.ehome.runtime.ImageReport.Kind.VERSION.tooltip = A newer major version of the schema (<code>image.version</code>).
de.haumacher.ehome.runtime.ProposeFunctionsAction = Propose functions action
de.haumacher.ehome.runtime.ProposeFunctionsAction.tooltip = <i>View action</i> adding the functions <i>function proposal</i> proposes for the input project (<code>ehome.project:Project</code>) and the project lacks. <p> The result is a sentence saying how many functions were added, for a notification. </p>
de.haumacher.ehome.runtime.RuleConstraint = Rule constraint
de.haumacher.ehome.runtime.RuleConstraint.Config.syntax = Syntax
de.haumacher.ehome.runtime.RuleConstraint.Config.syntax.tooltip = Whether the check is the one of the syntax (an error) instead of the controller's refusals (a warning).
de.haumacher.ehome.runtime.RuleConstraint.tooltip = <i>Constraint check</i> of a field of a rule or schedule entry (haumacher/ehome #57): the field is refused as the controller would refuse it (<code>RuleExport#fieldProblem(Object, String, Object, boolean)</code>). <p> With <i>Syntax</i> it checks that the text is an expression or literal of the rule language, an error (a text that does not parse is not stored); without, it reports the refusal of the controller's loader as a warning (a rule may be saved half-done). The check depends on every field of the object it belongs to (a value is checked against the datapoint of its action), so a form checks a field again when another field of the object changes. </p> <p> The output of a schedule entry that the loader accepts is also refused when it is a writable application datapoint (<code>ApplicationDatapoints#outputProblem(Object, Object)</code>): the controller refuses commands to it. </p>
de.haumacher.ehome.runtime.RuleFunctions$Builder = Builder
de.haumacher.ehome.runtime.RuleFunctions$Builder.tooltip = Builder of a <i>rule functions</i> function: the <i>function</i> named as the function is registered.
de.haumacher.ehome.runtime.RuleFunctions$Function = Function
de.haumacher.ehome.runtime.RuleFunctions$Function.tooltip = The functions, named as they are registered.
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleCreate = Rule create
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleCreate.tooltip = <code>ruleCreate(owner, reference, type)</code>: a new part of the given type, added at the end of the given reference of the owner, with an id of its own and the defaults of its kind.
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleDatapoints = Rule datapoints
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleDatapoints.tooltip = <code>ruleDatapoints(project)</code>: the datapoints of the project's image the rules may name, each a map with <code>id</code>, <code>label</code>, <code>type</code>, <code>writable</code> and <code>binding</code> (<code>RuleFunctions#datapoints(TLObject)</code>).
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleImportImage = Rule import image
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleImportImage.tooltip = <code>ruleImportImage(project, file)</code>: adds the rules and schedule entries of the uploaded runtime image (JSON) to the project (<code>RuleImport#importImage(TLObject, String)</code>); the sentence saying what was imported, followed by what the import did not keep.
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleList = Rule list
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleList.tooltip = <code>ruleList(owner, reference)</code>: the parts in the given reference of the owner.
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleMove = Rule move
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleMove.tooltip = <code>ruleMove(part, delta)</code>: moves the part by the given number of positions within the list that holds it.
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleMoveVeto = Rule move veto
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleMoveVeto.tooltip = <code>ruleMoveVeto(part, delta)</code>: why the part cannot be moved so far, <code>null</code> if it can.
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleNormalize = Rule normalize
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleNormalize.tooltip = <code>ruleNormalize(obj)</code>: stores the canonical form of the texts of the rule language the part of a rule or schedule entry holds (<i>rule normalization</i>); the object.
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleSummary = Rule summary
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleSummary.tooltip = <code>ruleSummary(obj)</code>: a line describing a reaction, trigger, action or schedule entry.
de.haumacher.ehome.runtime.RuntimeFunctions$Builder = Builder
de.haumacher.ehome.runtime.RuntimeFunctions$Builder.tooltip = Builder of a <i>runtime functions</i> function: the <i>function</i> named as the function is registered.
de.haumacher.ehome.runtime.RuntimeFunctions$Function = Function
de.haumacher.ehome.runtime.RuntimeFunctions$Function.tooltip = The functions, named as they are registered.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.controllerAddress = Controller address
de.haumacher.ehome.runtime.RuntimeFunctions.Function.controllerAddress.tooltip = <code>controllerAddress(controller)</code>: <code>host:port</code>.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.controllerTokenHint = Controller token hint
de.haumacher.ehome.runtime.RuntimeFunctions.Function.controllerTokenHint.tooltip = <code>controllerTokenHint(controller)</code>: whether the controller has a token, without the token itself.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointFlagsSource = Datapoint flags source
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointFlagsSource.tooltip = <code>datapointFlagsSource(address)</code>: where the flags writable and read on start come from, as text (<code>DatapointSettings#flagsSource(TLObject)</code>).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointReadOnStart = Datapoint read on start
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointReadOnStart.tooltip = <code>datapointReadOnStart(address)</code>: whether the datapoint of the group address is read on start (<code>DatapointSettings#readOnStart(TLObject)</code>).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointUnit = Datapoint unit
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointUnit.tooltip = <code>datapointUnit(address)</code>: the unit of the datapoint of the group address (<code>DatapointSettings#unit(TLObject)</code>).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointWritable = Datapoint writable
de.haumacher.ehome.runtime.RuntimeFunctions.Function.datapointWritable.tooltip = <code>datapointWritable(address)</code>: whether the datapoint of the group address is writable in the runtime image (<code>DatapointSettings#writable(TLObject)</code>).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.deploymentConfirmation = Deployment confirmation
de.haumacher.ehome.runtime.RuntimeFunctions.Function.deploymentConfirmation.tooltip = <code>deploymentConfirmation(project)</code>: the question asked before the project is deployed, with what differs from the image its controller stores (<code>ImageComparison#confirmation(TLObject, Instant)</code>).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.deploymentVeto = Deployment veto
de.haumacher.ehome.runtime.RuntimeFunctions.Function.deploymentVeto.tooltip = <code>deploymentVeto(project)</code>: why the project cannot be deployed now, as text; <code>null</code> if it can (<code>Deployer#veto(TLObject)</code>).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.nextImageRevision = Next image revision
de.haumacher.ehome.runtime.RuntimeFunctions.Function.nextImageRevision.tooltip = <code>nextImageRevision(project)</code>: the revision the next deployment carries.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeBuildingParts = Runtime building parts
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeBuildingParts.tooltip = <code>runtimeBuildingParts(obj)</code>: the parts of the buildings of the project of the given object, the options of a function's room.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeDatapointIdProblem = Runtime datapoint ID problem
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeDatapointIdProblem.tooltip = <code>runtimeDatapointIdProblem(text, datapoint)</code>: why the text cannot be the id of the application datapoint (<code>ApplicationDatapoints#idProblem(Object, Object)</code>); <code>null</code> if it can.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeDatapoints = Runtime datapoints
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeDatapoints.tooltip = <code>runtimeDatapoints(obj)</code>: the datapoints of the project of the given object (a function), the options of a function's roles (haumacher/ehome #61): its group addresses by their address, then its application datapoints in their order.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeGroupAddresses = Runtime group addresses
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeGroupAddresses.tooltip = <code>runtimeGroupAddresses(obj)</code>: the group addresses of the project of the given object (a project, a function), by their address: the options of a function's roles and of the time master.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeHistoryProblem = Runtime history problem
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeHistoryProblem.tooltip = <code>runtimeHistoryProblem(datapoint)</code>: what is wrong with the history settings of the group address or application datapoint; <code>null</code> if they fit (<code>DatapointSettings#historyProblem</code>).
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeHostNameProblem = Runtime host name problem
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeHostNameProblem.tooltip = <code>runtimeHostNameProblem(text)</code>: why the text is no host name; <code>null</code> for an empty text or one that is.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeIdentifierProblem = Runtime identifier problem
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeIdentifierProblem.tooltip = <code>runtimeIdentifierProblem(text)</code>: why the text is no identifier of the runtime image; <code>null</code> for an empty text or one that is.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeTimeMasterProblem = Runtime time master problem
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeTimeMasterProblem.tooltip = <code>runtimeTimeMasterProblem(address, project, attribute)</code>: the constraint of the time master's addresses (<code>timeMasterTime</code>, <code>timeMasterDate</code>, <code>timeMasterDateTime</code>), see <code>#timeMasterConstraint(Object, Object, String)</code>.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeTimeZoneProblem = Runtime time zone problem
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeTimeZoneProblem.tooltip = <code>runtimeTimeZoneProblem(text)</code>: why the text is no POSIX TZ string; <code>null</code> for an empty text or one that is.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeUnitProblem = Runtime unit problem
de.haumacher.ehome.runtime.RuntimeFunctions.Function.runtimeUnitProblem.tooltip = <code>runtimeUnitProblem(text)</code>: why the text cannot be the unit of a datapoint; <code>null</code> for an empty text or one that can.
de.haumacher.ehome.runtime.RuntimeFunctions.Function.unloadConfirmation = Unload confirmation
de.haumacher.ehome.runtime.RuntimeFunctions.Function.unloadConfirmation.tooltip = <code>unloadConfirmation(project)</code>: the question asked before the image of the project's controller is unloaded, with what the controller runs (<code>ControllerStatus#drift(TLObject)</code>).
de.haumacher.ehome.runtime.UnloadRuntimeImageAction = Unload runtime image action
de.haumacher.ehome.runtime.UnloadRuntimeImageAction.tooltip = <i>View action</i> unloading the runtime image the controller of the input project (<code>ehome.project:Project</code>) runs (<code>DELETE /api/image</code>), see <code>Deployer#unload(TLObject, Instant)</code>. <p> The result is the recorded unload (an <code>ehome.runtime:Deployment</code> marked as an unload), done or not: a refusal is an outcome to show, not a failure of the command. </p>
de.haumacher.ehome.scan.CatalogMatch$Kind = Kind
de.haumacher.ehome.scan.CatalogMatch$Kind.tooltip = The kind of a match.
de.haumacher.ehome.scan.CatalogMatch.Kind.CHOICE = Choice
de.haumacher.ehome.scan.CatalogMatch.Kind.CHOICE.tooltip = Several candidates, the user chooses.
de.haumacher.ehome.scan.CatalogMatch.Kind.UNIDENTIFIED = Unidentified
de.haumacher.ehome.scan.CatalogMatch.Kind.UNIDENTIFIED.tooltip = No candidate.
de.haumacher.ehome.scan.CatalogMatch.Kind.UNIQUE = Unique
de.haumacher.ehome.scan.CatalogMatch.Kind.UNIQUE.tooltip = Exactly one candidate.
de.haumacher.ehome.scan.FoundDevice$Source = Source
de.haumacher.ehome.scan.FoundDevice$Source.tooltip = How a device was reached.
de.haumacher.ehome.scan.FoundDevice.Source.BUS = Bus
de.haumacher.ehome.scan.FoundDevice.Source.BUS.tooltip = Point to point over the bus (management connection).
de.haumacher.ehome.scan.FoundDevice.Source.LOCAL = Local
de.haumacher.ehome.scan.FoundDevice.Source.LOCAL.tooltip = The gateway itself through KNXnet/IP local device management.
de.haumacher.ehome.scan.InstallationBuilder$Action = Action
de.haumacher.ehome.scan.InstallationBuilder$Action.tooltip = What happened to a device.
de.haumacher.ehome.scan.InstallationBuilder.Action.CONFLICT = Conflict
de.haumacher.ehome.scan.InstallationBuilder.Action.CONFLICT.tooltip = A device with the address exists with another program; nothing was changed.
de.haumacher.ehome.scan.InstallationBuilder.Action.CREATED = Created
de.haumacher.ehome.scan.InstallationBuilder.Action.CREATED.tooltip = The device was created.
de.haumacher.ehome.scan.InstallationBuilder.Action.UPDATED = Updated
de.haumacher.ehome.scan.InstallationBuilder.Action.UPDATED.tooltip = A device with the address existed and runs the same program; it was updated.
de.haumacher.ehome.scan.LedJob = Led job
de.haumacher.ehome.scan.LedJob.Config.on = On
de.haumacher.ehome.scan.LedJob.Config.on.tooltip = Whether to switch the programming mode on (or off).
de.haumacher.ehome.scan.LedJob.tooltip = The work of the commands "LED on" / "LED off" of a device found by a scan: switches the programming mode of the device, so that its programming LED shows which device of the installation it is (haumacher/ehome #9). <p> This writes into the device, so it goes through <i>calimero writer</i>, which refuses unless writing is switched on for the application (<code>-Dehome.programming.writeEnabled=true</code>). The programming mode is property 54 of the device object; a device of BCU 1 (mask 001x) keeps it in bit 0 of the memory byte 0060 with an even parity in bit 7, as Calimero's <code>ManagementProcedures#setProgrammingMode</code> writes it. The state is read back afterwards. </p>
de.haumacher.ehome.scan.ReadBackJob = Read back job
de.haumacher.ehome.scan.ReadBackJob.tooltip = The work of the command "Read the configuration" of a device found by a scan (<code>&lt;start-job&gt;</code> body of <code>projects/scan.view.xml</code>): reads the device's memory through the project's gateway with <i>calimero reader</i> (nothing is written), decodes it into the project's device (<i>read back</i>) in a transaction, and records that the device holds the project's state (as a download would: <code>loaded</code>, <code>lastDownload</code>, <code>downloadRevision</code>). <p> The job is started with the row of the device (see <i>scan rows</i>). The result is a <i>programming report</i>: what was read and decoded, and whether the image of the device as read back equals the memory read. </p>
de.haumacher.ehome.scan.ScanFunctions$Builder = Builder
de.haumacher.ehome.scan.ScanFunctions$Builder.tooltip = Builder of a <i>scan functions</i> function: the <i>function</i> named as the function is registered.
de.haumacher.ehome.scan.ScanFunctions$Function = Function
de.haumacher.ehome.scan.ScanFunctions$Function.tooltip = The functions, named as they are registered.
de.haumacher.ehome.scan.ScanFunctions.Function.scanApply = Scan apply
de.haumacher.ehome.scan.ScanFunctions.Function.scanApply.tooltip = <code>scanApply(row, candidate)</code>: creates or updates the device; the candidate row may be empty for a unique match.
de.haumacher.ehome.scan.ScanFunctions.Function.scanApplyVeto = Scan apply veto
de.haumacher.ehome.scan.ScanFunctions.Function.scanApplyVeto.tooltip = <code>scanApplyVeto(row)</code>: why the device cannot be created or updated.
de.haumacher.ehome.scan.ScanFunctions.Function.scanLedConfirmation = Scan led confirmation
de.haumacher.ehome.scan.ScanFunctions.Function.scanLedConfirmation.tooltip = <code>scanLedConfirmation(row, on)</code>: the question before switching the programming mode.
de.haumacher.ehome.scan.ScanFunctions.Function.scanLedVeto = Scan led veto
de.haumacher.ehome.scan.ScanFunctions.Function.scanLedVeto.tooltip = <code>scanLedVeto(row)</code>: why the programming mode cannot be switched.
de.haumacher.ehome.scan.ScanFunctions.Function.scanReadVeto = Scan read veto
de.haumacher.ehome.scan.ScanFunctions.Function.scanReadVeto.tooltip = <code>scanReadVeto(row)</code>: why the configuration cannot be read back.
de.haumacher.ehome.scan.ScanFunctions.Function.scanRefresh = Scan refresh
de.haumacher.ehome.scan.ScanFunctions.Function.scanRefresh.tooltip = <code>scanRefresh(rows)</code>: the rows with the state in the project computed anew.
de.haumacher.ehome.scan.ScanFunctions.Function.scanRematch = Scan rematch
de.haumacher.ehome.scan.ScanFunctions.Function.scanRematch.tooltip = <code>scanRematch(project)</code>: the result of matching the project's unidentified devices again.
de.haumacher.ehome.scan.ScanFunctions.Function.scanVeto = Scan veto
de.haumacher.ehome.scan.ScanFunctions.Function.scanVeto.tooltip = <code>scanVeto(project, area, line, routers, gateway, programming)</code>: why the scan is refused.
de.haumacher.ehome.scan.ScanJob = Scan job
de.haumacher.ehome.scan.ScanJob.tooltip = The work of the command "Read the installation" (<code>&lt;start-job&gt;</code> body of <code>projects/scan.view.xml</code>): scans the bus behind the project's gateway with <i>bus scanner</i> (nothing is written), matches every device found against the catalog (<i>catalog match</i>) and keeps the unidentified ones in the project (<code>InstallationBuilder#recordUnidentified(TLObject, FoundDevice, String)</code>). <p> The job is started with the project, the area and the line to scan (empty: no line), and whether to scan for routers, to read the gateway through local device management and to look for the devices in programming mode. Its result is a dictionary: <code>summary</code>, <code>rows</code> (see <i>scan rows</i>) and <code>notes</code> (what could not be read). </p>
de.haumacher.ehome.simulation.Simulation$Kind = Kind
de.haumacher.ehome.simulation.Simulation$Kind.tooltip = The kind of an entry of the <code>Simulation#timeline()</code>.
de.haumacher.ehome.simulation.Simulation.Kind.CLOCK = Clock
de.haumacher.ehome.simulation.Simulation.Kind.CLOCK.tooltip = The clock moved, the simulation started or stopped.
de.haumacher.ehome.simulation.Simulation.Kind.COMMAND = Command
de.haumacher.ehome.simulation.Simulation.Kind.COMMAND.tooltip = A rule commanded a datapoint.
de.haumacher.ehome.simulation.Simulation.Kind.PARAMETER = Parameter
de.haumacher.ehome.simulation.Simulation.Kind.PARAMETER.tooltip = A parameter of a rule changed its value.
de.haumacher.ehome.simulation.Simulation.Kind.PROBLEM = Problem
de.haumacher.ehome.simulation.Simulation.Kind.PROBLEM.tooltip = A telegram changed nothing, a command was refused, the bus failed.
de.haumacher.ehome.simulation.Simulation.Kind.RECEIVED = Received
de.haumacher.ehome.simulation.Simulation.Kind.RECEIVED.tooltip = A group telegram received from the bus.
de.haumacher.ehome.simulation.Simulation.Kind.RULE = Rule
de.haumacher.ehome.simulation.Simulation.Kind.RULE.tooltip = A log entry of a rule (<code>spec/rules.md</code> 9.2).
de.haumacher.ehome.simulation.Simulation.Kind.SCHEDULE = Schedule
de.haumacher.ehome.simulation.Simulation.Kind.SCHEDULE.tooltip = A log line of the scheduler.
de.haumacher.ehome.simulation.Simulation.Kind.SENT = Sent
de.haumacher.ehome.simulation.Simulation.Kind.SENT.tooltip = A group telegram the simulation sent.
de.haumacher.ehome.simulation.SimulationFunctions$Builder = Builder
de.haumacher.ehome.simulation.SimulationFunctions$Builder.tooltip = Builder of a <i>simulation functions</i> function: the <i>function</i> named as the function is registered.
de.haumacher.ehome.simulation.SimulationFunctions$Function = Function
de.haumacher.ehome.simulation.SimulationFunctions$Function.tooltip = The functions, named as they are registered.
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationAdvance = Simulation advance
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationAdvance.tooltip = <code>simulationAdvance(project, duration)</code>: runs the clock forward by the duration (<code>30min</code>).
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationCommand = Simulation command
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationCommand.tooltip = <code>simulationCommand(project, datapoint, value)</code>: commands the datapoint as a controller's UI does.
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationFollowerOptions = Simulation follower options
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationFollowerOptions.tooltip = <code>simulationFollowerOptions(follower)</code>: the devices of the project of an object follower (<code>ehome.runtime:ObjectFollower#device</code>).
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationPause = Simulation pause
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationPause.tooltip = <code>simulationPause(project)</code>: stops the clock running by itself.
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationPauseVeto = Simulation pause veto
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationPauseVeto.tooltip = <code>simulationPauseVeto(project, state?)</code>: why there is no clock to pause, <code>null</code> if it runs by itself.
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationResetParameter = Simulation reset parameter
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationResetParameter.tooltip = <code>simulationResetParameter(project, key)</code>: removes the override of a parameter.
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationRun = Simulation run
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationRun.tooltip = <code>simulationRun(project, speed)</code>: lets the clock run by itself at 1, 10 or 60 times real time.
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationRunVeto = Simulation run veto
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationRunVeto.tooltip = <code>simulationRunVeto(project, state?)</code>: why there is no simulation to work with, <code>null</code> if one runs.
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationSend = Simulation send
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationSend.tooltip = <code>simulationSend(project, datapoint, value)</code>: a device of the installation sends the value.
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationSetParameter = Simulation set parameter
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationSetParameter.tooltip = <code>simulationSetParameter(project, key, value)</code>: sets a parameter (<code>rule/parameter</code>).
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationSpeedVeto = Simulation speed veto
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationSpeedVeto.tooltip = <code>simulationSpeedVeto(project, speed, state?)</code>: why the clock cannot run at the speed, <code>null</code> if it can.
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationStart = Simulation start
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationStart.tooltip = <code>simulationStart(project, start?)</code>: starts the simulation, its clock at the given date (now if empty).
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationStartVeto = Simulation start veto
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationStartVeto.tooltip = <code>simulationStartVeto(project, state?)</code>: why no simulation can start, <code>null</code> if one can.
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationState = Simulation state
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationState.tooltip = <code>simulationState(project, refresh?)</code>: <code>project</code>, <code>running</code>, <code>status</code> and, while it runs, the snapshot of <code>ProjectSimulation#snapshot()</code>.
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationStep = Simulation step
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationStep.tooltip = <code>simulationStep(project)</code>: runs the clock to the next timer, schedule firing or midnight.
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationStop = Simulation stop
de.haumacher.ehome.simulation.SimulationFunctions.Function.simulationStop.tooltip = <code>simulationStop(project)</code>: stops the simulation.
de.haumacher.ehome.simulation.SimulationUpdatesElement = Simulation updates element
de.haumacher.ehome.simulation.SimulationUpdatesElement.Config.project = Project
de.haumacher.ehome.simulation.SimulationUpdatesElement.Config.project.tooltip = The channel holding the project whose simulation is shown.
de.haumacher.ehome.simulation.SimulationUpdatesElement.Config.refresh = Refresh
de.haumacher.ehome.simulation.SimulationUpdatesElement.Config.refresh.tooltip = The channel written on every change of the simulation.
de.haumacher.ehome.simulation.SimulationUpdatesElement.tooltip = Shows its content and, while it is displayed, keeps a view of the simulation of a project up to date (haumacher/ehome #62): every change of the simulation (it starts or stops, a telegram arrives, the clock moves, a rule acts) writes a new value to the <code>refresh</code> channel, from which the view computes the state of the simulation again. The updates come at most every <code>500</code> ms (<i>window updates</i>), so a burst of telegrams or a clock running at 60 times real time is one update per interval. <p> The element listens to the simulation of the project on the <code>project</code> channel (<code>Simulations#addListener(TLObject, Runnable)</code>) while its content is attached (displayed), follows a change of the channel, and stops listening when the content is detached or disposed. When it is displayed again, it updates once. </p>
de.haumacher.ehome.simulation.Simulations = Simulations
de.haumacher.ehome.simulation.Simulations.Config.directory = Directory
de.haumacher.ehome.simulation.Simulations.Config.directory.tooltip = The directory of the files of the KNXnet/IP servers of the virtual installations; aliases such as <code>%STORAGE_PATH%</code> are expanded.
de.haumacher.ehome.simulation.Simulations.tooltip = The running simulations of the application: at most one per project, shared by everybody who looks at the project, all stopped when the application shuts down. A simulation is transient: only its parameter overrides are kept with the project (<i>overrides</i>). <p> Whoever shows a simulation registers a listener for its project (<code>#addListener(TLObject, Runnable)</code>): it is told when the simulation of the project starts or stops and about every change of the running one (<code>Simulation#setListener(Runnable)</code>), from whatever thread the change happens on; it must only take note. </p> <p> Registered in <code>WEB-INF/autoconf/ehome.simulation.config.xml</code>. </p>
de.haumacher.ehome.view.OptionOrderSelectControlProvider = Option order select control provider
de.haumacher.ehome.view.OptionOrderSelectControlProvider.tooltip = <i>Select control provider</i> offering the options in the order they are given instead of sorted by their labels, for options whose order is part of their meaning: the days of the week, the step sizes of a dimmer. <pre> &lt;value-input inputs="target" options="t -> $t['days']" value="day"&gt; &lt;input-control class="de.haumacher.ehome.view.OptionOrderSelectControlProvider"/&gt; &lt;/value-input&gt; </pre> <p> Workaround: the engine's <i>select control provider</i> always sorts the options by their labels and has no setting to keep their order (8.0.0-alpha10, TL #29874, see <code>doc/tl-todo.md</code>). </p>
de.haumacher.ehome.view.RowOrderColumn = Row order column
de.haumacher.ehome.view.RowOrderColumn.tooltip = A <code>&lt;computed-column&gt;</code> that cannot be sorted, declared as <code>&lt;row-order-column&gt;</code>: a table grouped by it keeps its groups in the order their first rows appear in. <p> A table orders its groups by the comparator of the grouping column (<code>ListRowSource</code>), which for every kind of value the view layer derives a column for compares the values or their display texts, so a table grouped by the page of a program lists the pages alphabetically. A column without sort capability keeps the groups in the order of the rows, which is the order of the program's structure (haumacher/ehome #20). The view layer offers no declaration of a column that does not sort, so this declaration takes the column a <code>&lt;computed-column&gt;</code> builds and removes its sort capability. </p>
de.haumacher.ehome.view.ScriptLabelControlProvider = Script label control provider
de.haumacher.ehome.view.ScriptLabelControlProvider.Config.css-class = Css class
de.haumacher.ehome.view.ScriptLabelControlProvider.Config.css-class.tooltip = Function computing the CSS class of a node from its object; <code>null</code> for none.
de.haumacher.ehome.view.ScriptLabelControlProvider.Config.label = Label
de.haumacher.ehome.view.ScriptLabelControlProvider.Config.label.tooltip = Function computing the label of a node from its object; <code>null</code> for the object's own label. Unset, every node shows the label of its object.
de.haumacher.ehome.view.ScriptLabelControlProvider.tooltip = Display of a node of a <code>&lt;tree&gt;</code> (its <code>nodeContent</code>) with a label and a CSS class computed by TL-Script functions, for a tree whose nodes need another label than the one their objects have everywhere else, or a mark. <p> The node shows the icon of its object and the label the function computes from the object; where the function gives nothing, the object's own label. Like the default node display, the node is no link: a click selects it. The values of the channels named in <code>inputs</code> are the leading arguments of both functions, the object the last one. </p> <pre> &lt;nodeContent class="de.haumacher.ehome.view.ScriptLabelControlProvider" label="x -> if($x.instanceOf(`ehome.physical:Connection`), connectionLabel($x), null)"/&gt; &lt;nodeContent class="de.haumacher.ehome.view.ScriptLabelControlProvider" inputs="device" css-class="d -> x -> if(deviceChanged($d, $x), 'ehomeChanged', null)"/&gt; </pre> <p> The label and the class are computed when the node is displayed and whenever its object changes; a mark depending on other objects needs a tree that is built anew when it changes (an input of the tree that changes with the mark). </p>
