de.haumacher.ehome.knx.GAControlProvider = GA control provider
de.haumacher.ehome.knx.GAControlProvider.tooltip = Input control of the model type <code>ehome.logical:GA</code>: a text field showing the group address in its notation and reading what the user types in that notation. <p> The notation is the one of the current value. A field without a value takes it from the attribute's storage (<code>GroupAddressStorage#getStyle(com.top_logic.model.TLObject)</code>); if that yields none either (e.g. a new address not yet added to its project), every notation is accepted. </p>
de.haumacher.ehome.knx.GAStorageMapping = GA storage mapping
de.haumacher.ehome.knx.GAStorageMapping.tooltip = Storage mapping of the model type <code>ehome.logical:GA</code>: the database keeps the plain group address number, the application sees a <i>ga</i>. <p> A mapping only sees the stored value, so the <i>ga</i> it creates carries no notation. The attribute storage <i>group address storage</i> adds the notation of the owning object. Writing accepts a <i>ga</i> as well as a plain number, e.g. from an import. </p>
de.haumacher.ehome.knx.GAStyle = GA style
de.haumacher.ehome.knx.GAStyle.style = Style
de.haumacher.ehome.knx.GAStyle.style.tooltip = Function computing the <i>group address style</i> from the object the annotated attribute is defined on.
de.haumacher.ehome.knx.GAStyle.tooltip = Annotation of an attribute of type <code>ehome.logical:GA</code> stating the notation its group addresses are written in. <p> The expression receives the object the attribute is defined on and yields a classifier of <code>ehome.logical:GroupAddressStyle</code> (or its name). Without the annotation, or when the expression yields nothing, addresses are written in <code>GroupAddressStyle#DEFAULT</code>. </p> <pre> &lt;property name="address" type="ehome.logical:GA"&gt; &lt;annotations&gt; &lt;ga-style style="ga -&gt; ..."/&gt; &lt;/annotations&gt; &lt;/property&gt; </pre>
de.haumacher.ehome.knx.GroupAddressStorage = Group address storage
de.haumacher.ehome.knx.GroupAddressStorage.tooltip = Attribute storage of the model type <code>ehome.logical:GA</code>. <p> Stores the plain group address number like any primitive attribute and, when reading, attaches the notation of the owning object to the <i>ga</i>: the attribute's <i>GA style</i> expression evaluated on that object. The storage is declared on the type, so every attribute of the type uses it without declaring anything. </p>
