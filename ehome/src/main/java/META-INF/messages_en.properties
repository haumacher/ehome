de.haumacher.ehome.runtime.RuleFunctions.Function.ruleSuggestions = Rule suggestions
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleSuggestions.tooltip = <code>ruleSuggestions(obj, text, caret)</code>: what a reference, a parameter, a timer, a state or a function name left unfinished before the caret may name, as far as the field of obj may name it, as suggestions of a text field (<code>RuleFunctions#suggestions(TLObject, String, int)</code>); obj is the edited part of a rule (or the form's overlay of it, or the draft of a create dialog).
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleSummary = Rule summary
de.haumacher.ehome.runtime.RuleFunctions.Function.ruleSummary.tooltip = <code>ruleSummary(obj)</code>: a line describing a reaction, trigger, action or schedule entry.
