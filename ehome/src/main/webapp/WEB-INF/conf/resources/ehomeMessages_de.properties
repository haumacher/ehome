commandGroup.ManageMembers = Mitglieder verwalten
commandGroup.ManageMembers.tooltip = Fügt Konten zu einem Projekt hinzu, ändert ihre Rollen und entfernt sie: das Recht der Eigentümer des Projekts.
commandGroup.EHomeAdministration = E-Home-Verwaltung
commandGroup.EHomeAdministration.tooltip = Verwaltet, wer Installateur und wer E-Home-Administrator ist, und die Controller ohne Projekt: das Recht der E-Home-Administratoren.
role.description.ehome.Administrator = E-Home-Administrator: alles, was ein Installateur tut; schreibt außerdem die Gerätevorlagen und ihre Voreinstellungen, liest jedes Projekt, verwaltet seine Mitglieder und löscht es (ohne es zu bearbeiten), ordnet die Controller ohne Projekt zu oder löscht sie und verwaltet, wer Installateur und wer E-Home-Administrator ist.
role.description.ehome.Collaborator = Auf den Konten, die ein Projekt mit dem Benutzer teilen, und für einen E-Home-Administrator auf den Mitgliedern jedes Projekts und der Gruppen von E-Home: liest ihren Namen und ihre Mail-Adresse, sonst nichts.
role.description.ehome.Editor = Bearbeitet ein Projekt: ändert es, importiert hinein, programmiert seine Geräte und spielt auf seine Controller auf.
role.description.ehome.GroupReader = Für die E-Home-Administratoren auf den Gruppen ehome.installers und ehome.administrators: liest sie mit ihren Mitgliedern.
role.description.ehome.Installer = Legt Projekte an, importiert sie und pflegt die gemeinsamen Kataloge und Applikationsprogramme; sieht nur die Projekte, in denen das Konto eine Rolle hat.
role.description.ehome.Owner = Besitzt ein Projekt: alles, was ein Bearbeiter tut, verwaltet seine Mitglieder und darf es löschen.
role.description.ehome.Viewer = Liest ein Projekt mit seinen Controllern, ohne etwas zu ändern.
role.name.ehome.Administrator = E-Home-Administrator
role.name.ehome.Collaborator = Mitarbeiter
role.name.ehome.Editor = Projektbearbeiter
role.name.ehome.GroupReader = Leser der Gruppen von E-Home
role.name.ehome.Installer = Installateur
role.name.ehome.Owner = Projekteigentümer
role.name.ehome.Viewer = Projektbetrachter
tl.title = E-Home
