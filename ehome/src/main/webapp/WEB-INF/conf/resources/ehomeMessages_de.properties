commandGroup.ManageMembers = Mitglieder verwalten
commandGroup.ManageMembers.tooltip = Fügt Konten zu einem Projekt hinzu, ändert ihre Rollen und entfernt sie: das Recht der Eigentümer des Projekts.
role.description.ehome.Collaborator = Auf den Konten, die ein Projekt mit dem Benutzer teilen: liest ihren Namen und ihre Mail-Adresse, sonst nichts.
role.description.ehome.Editor = Bearbeitet ein Projekt: ändert es, importiert hinein, programmiert seine Geräte und spielt auf seine Controller auf.
role.description.ehome.Installer = Legt Projekte an, importiert sie und pflegt die gemeinsamen Kataloge und Applikationsprogramme; sieht nur die Projekte, in denen das Konto eine Rolle hat.
role.description.ehome.Owner = Besitzt ein Projekt: alles, was ein Bearbeiter tut, verwaltet seine Mitglieder und darf es löschen.
role.description.ehome.Viewer = Liest ein Projekt mit seinen Controllern, ohne etwas zu ändern.
role.name.ehome.Collaborator = Mitarbeiter
role.name.ehome.Editor = Projektbearbeiter
role.name.ehome.Installer = Installateur
role.name.ehome.Owner = Projekteigentümer
role.name.ehome.Viewer = Projektbetrachter
tl.title = E-Home
