commandGroup.ManageMembers = Manage members
commandGroup.ManageMembers.tooltip = Adds accounts to a project, changes their roles and removes them: the right of the project's owners.
role.description.ehome.Collaborator = Held on the accounts that share a project with the user: reads their name and mail address, nothing else.
role.description.ehome.Editor = Edits a project: changes it, imports into it, programs its devices and deploys to its controllers.
role.description.ehome.Installer = Creates and imports projects and maintains the shared catalogs and application programs; sees only the projects in which the account holds a role.
role.description.ehome.Owner = Owns a project: everything an editor does, manages its members and may delete it.
role.description.ehome.Viewer = Reads a project with its controllers without changing anything.
role.name.ehome.Collaborator = Collaborator
role.name.ehome.Editor = Project editor
role.name.ehome.Installer = Installer
role.name.ehome.Owner = Project owner
role.name.ehome.Viewer = Project viewer
