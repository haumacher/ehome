commandGroup.ManageMembers = Manage members
commandGroup.ManageMembers.tooltip = Adds accounts to a project, changes their roles and removes them: the right of the project's owners.
commandGroup.EHomeAdministration = E-Home administration
commandGroup.EHomeAdministration.tooltip = Manages who is an installer and who is an E-Home administrator, and the controllers without a project: the right of the E-Home administrators.
role.description.ehome.Administrator = E-Home administrator: everything an installer does; also writes the device templates and their presets, reads every project, manages its members and deletes it (without editing it), assigns or deletes the controllers without a project and manages who is an installer and who is an E-Home administrator.
role.description.ehome.Collaborator = Held on the accounts that share a project with the user, and by an E-Home administrator on the members of every project and of the groups of E-Home: reads their name and mail address, nothing else.
role.description.ehome.Editor = Edits a project: changes it, imports into it, programs its devices and deploys to its controllers.
role.description.ehome.GroupReader = Held by the E-Home administrators on the groups ehome.installers and ehome.administrators: reads them with their members.
role.description.ehome.Installer = Creates and imports projects and maintains the shared catalogs and application programs; sees only the projects in which the account holds a role.
role.description.ehome.Owner = Owns a project: everything an editor does, manages its members and may delete it.
role.description.ehome.Viewer = Reads a project with its controllers without changing anything.
