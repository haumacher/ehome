model.ehome.logical.GroupAddress.historyEffective = Verlauf im Image
model.ehome.logical.GroupAddress.historyEffective.tooltip = Der Verlauf, den der Controller vom Datenpunkt führt: die Speicher, die seine Aufzeichnung verlangt, mit den Bytes an RAM und Flash, die sie belegen.
model.ehome.logical.GroupAddress.identifier = Bezeichner
model.ehome.logical.GroupAddress.identifier.tooltip = Die lesbare Id des Datenpunkts der Adresse im Laufzeitabbild, mit der Regeln ihn nennen (@kueche.licht statt @"1/2/3"): Teile aus Buchstaben, Ziffern und Unterstrichen, durch Punkte verbunden, höchstens 63 Bytes, eindeutig unter den Datenpunkten des Projekts. Leer: Die Adresse nennt den Datenpunkt.
model.ehome.logical.GroupAddress.meter = Zählerstand
model.ehome.logical.GroupAddress.meter.tooltip = Ob der Datenpunkt ein Zählerstand ist (Energie, Wasser, Gas), als Verbrauchsbalken gezeichnet. Leer: aus dem Datenpunkttyp (12.x, 13.010 bis 13.016).
model.ehome.logical.GroupAddress.recording = Aufzeichnung
model.ehome.logical.GroupAddress.recording.tooltip = Wie weit der Controller den Datenpunkt zurück aufzeichnet: keine, 6 Stunden bis 10 Jahre. Daraus folgen seine Speicher; die Diagramme der Bedienseiten zeigen, was aufgezeichnet wird.
model.ehome.logical.GroupAddress.runtimeFlagsSource = Herkunft der Flags
model.ehome.logical.GroupAddress.runtimeFlagsSource.tooltip = Woher die Laufzeit-Flags stammen: aus den verbundenen Objekten abgeleitet oder für die Adresse eingestellt.
model.ehome.logical.GroupAddress.runtimePersist = Über Neustarts behalten
