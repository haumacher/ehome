model.ehome.logical.GroupAddress.runtimeReadable = Lesbar
model.ehome.logical.GroupAddress.runtimeReadable.tooltip = Ob der Controller eine Leseanfrage auf der Adresse mit dem Wert des Datenpunkts beantwortet.
model.ehome.logical.GroupAddress.runtimeUnit = Einheit (Einstellung)
model.ehome.logical.GroupAddress.runtimeUnit.tooltip = Die Einheit, die der Controller anzeigt (höchstens 15 Bytes); leer: die Einheit des Datenpunkttyps.
model.ehome.logical.GroupAddress.runtimeWritable = Beschreibbar (Einstellung)
model.ehome.logical.GroupAddress.runtimeWritable.tooltip = Ob Regeln, die Oberfläche und die API den Datenpunkt steuern dürfen; leer: aus den verbundenen Objekten abgeleitet.
