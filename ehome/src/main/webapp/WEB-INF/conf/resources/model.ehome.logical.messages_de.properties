model.ehome.logical.GroupAddress.effectiveMeter = Zählerstand wirksam
model.ehome.logical.GroupAddress.effectiveMeter.tooltip = Ob der Datenpunkt im Laufzeitabbild ein Zählerstand ist: die Einstellung, sonst der Datenpunkttyp.
model.ehome.logical.GroupAddress.effectiveReadOnStart = Beim Start lesen
model.ehome.logical.GroupAddress.effectiveReadOnStart.tooltip = Ob der Datenpunkt im Laufzeitabbild beim Start gelesen wird: die Einstellung, sonst die Ableitung.
model.ehome.logical.GroupAddress.effectiveUnit = Einheit
