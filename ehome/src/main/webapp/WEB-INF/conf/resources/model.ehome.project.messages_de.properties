model.ehome.project = Projekte
model.ehome.project.Project = Projekt
model.ehome.project.Project.applicationDatapoints = Anwendungsdatenpunkte
model.ehome.project.Project.applicationDatapoints.tooltip = Die Datenpunkte des Laufzeitabbilds, die keine Technik besitzt: Werte der Anwendung und die Ausgänge von Zeitplaneinträgen.
model.ehome.project.Project.areas = Bereiche
model.ehome.project.Project.buildings = Gebäude
model.ehome.project.Project.controller = HomeControl-Controller
model.ehome.project.Project.controller.tooltip = Der HomeControl-Controller, in den das Laufzeitabbild des Projekts geladen wird.
model.ehome.project.Project.controllers = Angemeldete Controller
model.ehome.project.Project.controllers.tooltip = Die mit einem Anmeldecode für das Projekt angemeldeten Controller; sie verbinden sich selbst mit E-Home.
model.ehome.project.Project.deployments = Bereitstellungen
model.ehome.project.Project.deployments.tooltip = Die Bereitstellungen des Laufzeitabbilds, die neueste zuerst.
model.ehome.project.Project.dismissedProposals = Verworfene Vorschläge
model.ehome.project.Project.dismissedProposals.tooltip = Die vorgeschlagenen Funktionen, die gelöscht wurden und nicht wieder vorgeschlagen werden.
model.ehome.project.Project.elevation = Höhe (m)
model.ehome.project.Project.elevation.tooltip = Die Höhe der Anlage in Metern.
model.ehome.project.Project.enrollmentCode = Anmeldecode
model.ehome.project.Project.enrollmentCode.tooltip = Der offene Anmeldecode des Projekts: Ein Controller, der ihn vor seinem Ablauf vorlegt, wird für das Projekt angemeldet.
model.ehome.project.Project.enrollmentCreatedBy = Anmeldecode erzeugt von
model.ehome.project.Project.enrollmentCreatedBy.tooltip = Wer den offenen Anmeldecode erzeugt hat.
model.ehome.project.Project.enrollmentExpires = Anmeldecode gültig bis
model.ehome.project.Project.enrollmentExpires.tooltip = Wann der offene Anmeldecode abläuft.
model.ehome.project.Project.functions = Funktionen
model.ehome.project.Project.functions.tooltip = Was der Bewohner bedient: die Funktionen des Laufzeitabbilds.
model.ehome.project.Project.gateway = KNX-Gateway
model.ehome.project.Project.gateway.tooltip = Das KNXnet/IP-Gateway, über das die Geräte des Projekts programmiert und gelesen werden: eine Adresse, wahlweise mit Port (z. B. 192.168.178.81 oder 192.168.178.81:3671).
model.ehome.project.Project.groupAddressStyle = Gruppenadressen-Schreibweise
model.ehome.project.Project.groupAddressStyle.tooltip = Wie die Gruppenadressen dieses Projekts geschrieben werden, wie in der ETS gewählt.
model.ehome.project.Project.groupAddresses = Gruppenadressen\ 
model.ehome.project.Project.historyBudget = Verlaufsbudget (Bytes)
model.ehome.project.Project.historyBudget.tooltip = Der Speicher in Bytes, den die Verläufe der Datenpunkte auf dem Controller belegen dürfen (höchstens 65536); leer: was die Verläufe brauchen.
model.ehome.project.Project.imageRevision = Abbild-Revision
model.ehome.project.Project.imageRevision.tooltip = Die Revision des Laufzeitabbilds, die ein Controller zuletzt geladen hat; die nächste Bereitstellung trägt die nächste.
model.ehome.project.Project.installationKey = Installationsschlüssel
model.ehome.project.Project.installationKey.tooltip = Der private Schlüssel der Installation (Ed25519), mit dem jedes Laufzeitabbild signiert wird; wird nie angezeigt und verlässt E-Home nie.
model.ehome.project.Project.installationPublicKey = Öffentlicher Installationsschlüssel
model.ehome.project.Project.installationPublicKey.tooltip = Der öffentliche Schlüssel des Installationsschlüssels, den die Controller bei der Anmeldung erhalten.
model.ehome.project.Project.latitude = Breitengrad
model.ehome.project.Project.latitude.tooltip = Der Breitengrad der Anlage in Grad (Nord positiv), für die Sonnenzeiten astronomischer Zeitpläne.
model.ehome.project.Project.longitude = Längengrad
model.ehome.project.Project.longitude.tooltip = Der Längengrad der Anlage in Grad (Ost positiv), für die Sonnenzeiten astronomischer Zeitpläne.
model.ehome.project.Project.name = Name
model.ehome.project.Project.newInstallationKey = Neuer Installationsschlüssel
model.ehome.project.Project.newInstallationKey.tooltip = Der neue private Schlüssel eines Schlüsselwechsels, den Controllern angeboten, bis sie ihn annehmen; wird nie angezeigt.
model.ehome.project.Project.newInstallationPublicKey = Neuer öffentlicher Installationsschlüssel
model.ehome.project.Project.newInstallationPublicKey.tooltip = Der öffentliche Schlüssel des neuen Installationsschlüssels eines Schlüsselwechsels.
model.ehome.project.Project.ntpServer = NTP-Server
model.ehome.project.Project.ntpServer.tooltip = Der Hostname des NTP-Servers, mit dem der Controller seine Uhr abgleicht; leer: der Controller behält seinen eigenen.
model.ehome.project.Project.pages = Seiten
model.ehome.project.Project.pages.tooltip = Die Bedienseiten der Oberfläche des Controllers, in der Reihenfolge seiner Navigation; keine: die vom Controller erzeugte Raumübersicht.
model.ehome.project.Project.recordings = Aufzeichnungen
model.ehome.project.Project.recordings.tooltip = Die Aufzeichnungen des Gruppenmonitors.
model.ehome.project.Project.rules = Regeln
model.ehome.project.Project.rules.tooltip = Die Regeln des Laufzeitabbilds, geordnet nach ihrer Reihenfolge.
model.ehome.project.Project.schedules = Zeitplan
model.ehome.project.Project.schedules.tooltip = Die Einträge des Zeitplans des Laufzeitabbilds, in der Reihenfolge des Abbilds.
model.ehome.project.Project.simulationFollowers = Objektfolgen
model.ehome.project.Project.simulationFollowers.tooltip = In der Simulation: welches Objekt eines Geräts welchem folgt.
model.ehome.project.Project.timeMasterAtMidnight = Auch um Mitternacht
model.ehome.project.Project.timeMasterAtMidnight.tooltip = Ob der Zeitgeber auch direkt nach Mitternacht (Ortszeit) sendet; leer: ja.
model.ehome.project.Project.timeMasterDate = Adresse des Datums
model.ehome.project.Project.timeMasterDate.tooltip = Die Gruppenadresse, auf der der Controller als KNX-Zeitgeber das Datum sendet (DPT 11.001).
model.ehome.project.Project.timeMasterDateTime = Adresse von Datum und Uhrzeit
model.ehome.project.Project.timeMasterDateTime.tooltip = Die Gruppenadresse, auf der der Controller als KNX-Zeitgeber Datum und Uhrzeit sendet (DPT 19.001).
model.ehome.project.Project.timeMasterInterval = Intervall (s)
model.ehome.project.Project.timeMasterInterval.tooltip = Der Abstand der Sendungen des Zeitgebers in Sekunden (60 bis 86400); leer: 600.
model.ehome.project.Project.timeMasterOnSynchronized = Auch bei Synchronisierung
model.ehome.project.Project.timeMasterOnSynchronized.tooltip = Ob der Zeitgeber auch sendet, sobald die Uhr des Controllers synchronisiert ist; leer: ja.
model.ehome.project.Project.timeMasterTime = Adresse der Uhrzeit
model.ehome.project.Project.timeMasterTime.tooltip = Die Gruppenadresse, auf der der Controller als KNX-Zeitgeber die Uhrzeit sendet (DPT 10.001).
model.ehome.project.Project.timeZone = Zeitzone
model.ehome.project.Project.timeZone.tooltip = Die Zeitzone des Controllers als POSIX-TZ-Angabe, z. B. CET-1CEST,M3.5.0,M10.5.0/3 für Mitteleuropa; leer: der Controller behält seine eigene.
model.ehome.project.Project.unassignedDevices = Nicht zugeordnete Geräte
model.ehome.project.Project.unassignedDevices.tooltip = Geräte des Projekts, die noch keiner Linie zugeordnet sind.
model.ehome.project.Project.unidentifiedDevices = Nicht identifizierte Geräte
model.ehome.project.Project.unidentifiedDevices.tooltip = Geräte, die das Einlesen der Installation gefunden hat und die der Katalog nicht identifiziert; nach einem Import von Produktdaten erneut zugeordnet.
model.ehome.project.Project.zigbeeDevices = Zigbee-Geräte
model.ehome.project.Project.zigbeeDevices.tooltip = Die Zigbee-Geräte des Projekts, importiert aus dem Export eines Controllers.
model.ehome.project.UnidentifiedDevice = Nicht identifiziertes Gerät
model.ehome.project.UnidentifiedDevice.address = Adresswert
model.ehome.project.UnidentifiedDevice.descriptor = Gerätebeschreibung
model.ehome.project.UnidentifiedDevice.hardwareType = Hardware-Typ
model.ehome.project.UnidentifiedDevice.lastSeen = Zuletzt gesehen
model.ehome.project.UnidentifiedDevice.manufacturerId = Hersteller-ID
model.ehome.project.UnidentifiedDevice.name = Physikalische Adresse
model.ehome.project.UnidentifiedDevice.orderInfo = Bestellinformation
model.ehome.project.UnidentifiedDevice.programVersion = Programmversion
model.ehome.project.UnidentifiedDevice.reason = Grund
model.ehome.project.UnidentifiedDevice.serialNumber = Seriennummer
