model.ehome.project.Project.dismissedProposals.tooltip = The proposed functions that were deleted and are not proposed again.
model.ehome.project.Project.elevation = Elevation (m)
model.ehome.project.Project.elevation.tooltip = The elevation of the installation in metres.
model.ehome.project.Project.enrollmentCode = Enrollment code
model.ehome.project.Project.enrollmentCode.tooltip = The open enrollment code of the project: a controller presenting it before it expires is enrolled for the project.
model.ehome.project.Project.enrollmentCreatedBy = Enrollment code created by
