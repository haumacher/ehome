model.ehome.project.Project.enrollmentExpires = Enrollment code expires
model.ehome.project.Project.enrollmentExpires.tooltip = When the open enrollment code expires.
model.ehome.project.Project.functions = Functions
model.ehome.project.Project.functions.tooltip = What the inhabitant operates: the functions of the runtime image.
model.ehome.project.Project.gateway = KNX gateway
model.ehome.project.Project.gateway.tooltip = The KNXnet/IP gateway the devices of the project are programmed and read through: an address, optionally with the port (e.g. 192.168.178.81 or 192.168.178.81:3671).
model.ehome.project.Project.groupAddressStyle = Group address notation
model.ehome.project.Project.groupAddressStyle.tooltip = How the group addresses of this project are written, as chosen in ETS.
model.ehome.project.Project.groupAddresses = Group addresses
model.ehome.project.Project.historyBudget = History budget (bytes)
model.ehome.project.Project.historyBudget.tooltip = The RAM in bytes the histories of the datapoints (the raw rings and the archives' open slots) may use on the controller (at most 65536); empty: what they need. The archives' closed slots are on the controller's flash, which allows at most 65536 bytes for them.
model.ehome.project.Project.historyUsage = History memory
model.ehome.project.Project.historyUsage.tooltip = The RAM the histories of the datapoints take against the budget and the controller's cap, and the flash their archives take against the controller's cap.
model.ehome.project.Project.imageRevision = Image revision
model.ehome.project.Project.imageRevision.tooltip = The revision of the runtime image a controller last loaded; the next deployment carries the next one.
model.ehome.project.Project.installationKey = Installation key
model.ehome.project.Project.installationKey.tooltip = The private key of the installation (Ed25519) every runtime image is signed with; never displayed, it never leaves E-Home.
model.ehome.project.Project.installationPublicKey = Installation public key
model.ehome.project.Project.installationPublicKey.tooltip = The public key of the installation key, sent to the controllers at the enrollment.
model.ehome.project.Project.latitude = Latitude
model.ehome.project.Project.latitude.tooltip = The latitude of the installation in degrees (north positive), for the sun times of astronomical schedules.
model.ehome.project.Project.longitude = Longitude
model.ehome.project.Project.longitude.tooltip = The longitude of the installation in degrees (east positive), for the sun times of astronomical schedules.
model.ehome.project.Project.name = Name
model.ehome.project.Project.newInstallationKey = New installation key
model.ehome.project.Project.newInstallationKey.tooltip = The new private key of a key rotation, offered to the controllers until they accept it; never displayed.
model.ehome.project.Project.newInstallationPublicKey = New installation public key
model.ehome.project.Project.newInstallationPublicKey.tooltip = The public key of the new installation key of a key rotation.
model.ehome.project.Project.ntpServer = NTP server
model.ehome.project.Project.ntpServer.tooltip = The host name of the NTP server the controller synchronizes its clock with; empty: the controller keeps its own.
model.ehome.project.Project.pages = Pages
model.ehome.project.Project.pages.tooltip = The control pages of the controller's user interface, in the order of its navigation; none: the controller's generated room overview.
model.ehome.project.Project.recordings = Recordings
model.ehome.project.Project.recordings.tooltip = The recordings of the group monitor.
model.ehome.project.Project.rules = Rules
model.ehome.project.Project.rules.tooltip = The rules of the runtime image, ordered by their attribute order.
model.ehome.project.Project.schedules = Schedule
model.ehome.project.Project.schedules.tooltip = The entries of the schedule of the runtime image, in the image order.
model.ehome.project.Project.simulationFollowers = Object followers
model.ehome.project.Project.simulationFollowers.tooltip = In the simulation: which object of a device follows which.
model.ehome.project.Project.timeMasterAtMidnight = Also at midnight
model.ehome.project.Project.timeMasterAtMidnight.tooltip = Whether the time master also sends right after local midnight; empty: yes.
model.ehome.project.Project.timeMasterDate = Date address
model.ehome.project.Project.timeMasterDate.tooltip = The group address the controller sends the date on as KNX time master (DPT 11.001).
model.ehome.project.Project.timeMasterDateTime = Date and time address
model.ehome.project.Project.timeMasterDateTime.tooltip = The group address the controller sends date and time on as KNX time master (DPT 19.001).
model.ehome.project.Project.timeMasterInterval = Interval (s)
model.ehome.project.Project.timeMasterInterval.tooltip = The period of the time master's broadcasts in seconds (60 to 86400); empty: 600.
model.ehome.project.Project.timeMasterOnSynchronized = Also when synchronized
model.ehome.project.Project.timeMasterOnSynchronized.tooltip = Whether the time master also sends when the controller's clock becomes synchronized; empty: yes.
model.ehome.project.Project.timeMasterTime = Time address
model.ehome.project.Project.timeMasterTime.tooltip = The group address the controller sends the time of day on as KNX time master (DPT 10.001).
model.ehome.project.Project.timeZone = Time zone
model.ehome.project.Project.timeZone.tooltip = The time zone of the controller as POSIX TZ string, e.g. CET-1CEST,M3.5.0,M10.5.0/3 for Central Europe; empty: the controller keeps its own.
model.ehome.project.Project.unassignedDevices = Unassigned devices
model.ehome.project.Project.unassignedDevices.tooltip = Devices of the project not placed in a line yet.
model.ehome.project.Project.unidentifiedDevices = Unidentified devices
model.ehome.project.Project.unidentifiedDevices.tooltip = Devices a scan of the installation found that the catalog could not identify; matched again after an import of product data.
model.ehome.project.Project.zigbeeDevices = Zigbee devices
model.ehome.project.Project.zigbeeDevices.tooltip = The Zigbee devices of the project, imported from the export of a controller.
