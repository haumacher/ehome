model.ehome.zigbee.catalog = Zigbee-Katalog
model.ehome.zigbee.catalog.ZigbeeCatalog = Zigbee-Katalog
model.ehome.zigbee.catalog.ZigbeeCatalog.tooltip = Der Katalog: die Gerätetypen, die die Installation kennt.
model.ehome.zigbee.catalog.ZigbeeCatalog.types = Gerätetypen
model.ehome.zigbee.catalog.ZigbeeCatalog.types.tooltip = Die Gerätetypen, jeder durch Hersteller und Modell bestimmt.
model.ehome.zigbee.catalog.ZigbeeDeviceType = Zigbee-Gerätetyp
model.ehome.zigbee.catalog.ZigbeeDeviceType.description = Beschreibung
model.ehome.zigbee.catalog.ZigbeeDeviceType.description.tooltip = Was der Installateur über den Gerätetyp wissen sollte.
model.ehome.zigbee.catalog.ZigbeeDeviceType.functions = Funktionen
model.ehome.zigbee.catalog.ZigbeeDeviceType.functions.tooltip = Die Funktionen des Geräts, zu denen der Katalog etwas sagt.
model.ehome.zigbee.catalog.ZigbeeDeviceType.manufacturer = Hersteller
model.ehome.zigbee.catalog.ZigbeeDeviceType.manufacturer.tooltip = Der Hersteller, wie ihn das Gerät meldet (Basic-Cluster), genau verglichen.
model.ehome.zigbee.catalog.ZigbeeDeviceType.model = Modell
model.ehome.zigbee.catalog.ZigbeeDeviceType.model.tooltip = Die Modellkennung, wie sie das Gerät meldet (Basic-Cluster), genau verglichen; Hersteller und Modell bestimmen den Typ.
model.ehome.zigbee.catalog.ZigbeeDeviceType.name = Name
model.ehome.zigbee.catalog.ZigbeeDeviceType.name.tooltip = Der Name des Gerätetyps für den Installateur („Hue Bewegungsmelder“).
model.ehome.zigbee.catalog.ZigbeeDeviceType.tooltip = Was ein Gerät eines Herstellers und Modells ist und was seine Funktionen bedeuten.
model.ehome.zigbee.catalog.ZigbeeFunctionEntry = Funktion eines Gerätetyps
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.endpoint = Endpunkt
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.endpoint.tooltip = Der Endpunkt der Funktion (1..240).
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.function = Schlüssel
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.function.tooltip = Der Schlüssel der Funktionstabelle des Controllers (temperature, occupancy, on_off, action, ...); ein Typ führt jede Funktion eines Endpunkts einmal auf.
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.hidden = Ausgeblendet
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.hidden.tooltip = Ob die Funktion für den Installateur nichts bedeutet (eine Eigenheit des Geräts, etwa ein Controller-Endpunkt, der keine Taste ist): in der Funktionstabelle des Geräts zunächst ausgeblendet und von „Datenpunkte anlegen“ ausgelassen.
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.name = Name
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.name.tooltip = Der Name der Funktion für den Installateur („Bewegung“): ihre Bezeichnung in der Funktionstabelle des Geräts und der letzte Teil des Namens eines für sie angelegten Datenpunkts.
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.reportingChange = Berichtenswerte Änderung
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.reportingChange.tooltip = Die empfohlene berichtenswerte Änderung in der Einheit des Datenpunkts (°C, %); nicht für on_off, occupancy, illuminance und color_temperature.
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.reportingMax = Höchstintervall (s)
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.reportingMax.tooltip = Das empfohlene Höchstintervall der Berichte in Sekunden (0..65535, nicht unter dem Mindestintervall; 0: keine regelmäßigen Berichte, 65535: keine Berichte).
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.reportingMin = Mindestintervall (s)
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.reportingMin.tooltip = Das empfohlene Mindestintervall der Berichte in Sekunden (0..65534), abgelehnt, wie der Controller eine Vorgabe ablehnt; es wird zur Vorgabe der Funktion, wenn für sie ein Datenpunkt aus dem Katalog angelegt wird.
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.tooltip = Was eine Funktion des Geräts (Endpunkt und Funktionsschlüssel) für den Installateur bedeutet.
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.type = Datenpunkttyp
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.type.tooltip = Der für die Funktion empfohlene Datenpunkttyp; er muss zum Werttyp der Funktion passen. Leer: der Werttyp der Funktion.
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.unit = Einheit
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.unit.tooltip = Die für den Datenpunkt empfohlene Einheit. Leer: die Einheit der Funktion.
