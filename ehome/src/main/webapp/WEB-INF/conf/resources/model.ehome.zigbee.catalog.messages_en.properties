model.ehome.zigbee.catalog.ZigbeeDeviceType.description = Description
model.ehome.zigbee.catalog.ZigbeeDeviceType.description.tooltip = What the installer should know of the device type.
model.ehome.zigbee.catalog.ZigbeeDeviceType.functions = Functions
model.ehome.zigbee.catalog.ZigbeeDeviceType.functions.tooltip = The functions of the device the catalog says something about.
model.ehome.zigbee.catalog.ZigbeeDeviceType.manufacturer = Manufacturer
model.ehome.zigbee.catalog.ZigbeeDeviceType.manufacturer.tooltip = The manufacturer as the device reports it (Basic cluster), matched exactly.
model.ehome.zigbee.catalog.ZigbeeDeviceType.model = Model
model.ehome.zigbee.catalog.ZigbeeDeviceType.model.tooltip = The model identifier as the device reports it (Basic cluster), matched exactly; manufacturer and model identify the type.
model.ehome.zigbee.catalog.ZigbeeDeviceType.name = Name
model.ehome.zigbee.catalog.ZigbeeDeviceType.name.tooltip = The name of the device type for the installer ("Hue motion sensor").
model.ehome.zigbee.catalog.ZigbeeDeviceType.tooltip = What a device of a manufacturer and model is, and what its functions mean.
model.ehome.zigbee.catalog.ZigbeeFunctionEntry = Function of a device type
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.endpoint = Endpoint
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.endpoint.tooltip = The endpoint of the function (1..240).
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.function = Key
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.function.tooltip = The key of the controller's function table (temperature, occupancy, on_off, action, ...); a type lists each function of an endpoint once.
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.hidden = Hidden
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.hidden.tooltip = Whether the function means nothing to the installer (a quirk of the device, such as a controller endpoint that is no button): hidden in the device's function table by default and left out by "Create datapoints".
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.name = Name
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.name.tooltip = The name of the function for the installer ("Motion"): its label in the device's function table and the last part of the name of a datapoint created for it.
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.reportingChange = Reportable change
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.reportingChange.tooltip = The recommended reportable change in the datapoint's unit (°C, %); not for on_off, occupancy, illuminance and color_temperature.
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.reportingMax = Maximum interval (s)
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.reportingMax.tooltip = The recommended maximum reporting interval in seconds (0..65535, not below the minimum; 0: no periodic reports, 65535: no reports).
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.reportingMin = Minimum interval (s)
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.reportingMin.tooltip = The recommended minimum reporting interval in seconds (0..65534), refused as the controller refuses an override; it becomes the function's override when a datapoint is created for it from the catalog.
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.tooltip = What a function of the device (endpoint and function key) means to the installer.
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.type = Datapoint type
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.type.tooltip = The datapoint type recommended for the function; it must fit the value type the function carries. Empty: the function's value type.
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.unit = Unit
model.ehome.zigbee.catalog.ZigbeeFunctionEntry.unit.tooltip = The unit recommended for the datapoint. Empty: the function's unit.
