model.ehome.zigbee = Zigbee
model.ehome.zigbee.ZigbeeDevice = Zigbee-Gerät
model.ehome.zigbee.ZigbeeDevice.controllerName = Controller
model.ehome.zigbee.ZigbeeDevice.controllerName.tooltip = Der Controller, dessen Export das Gerät zuletzt beschrieben hat.
model.ehome.zigbee.ZigbeeDevice.endpoints = Endpunkte
model.ehome.zigbee.ZigbeeDevice.endpoints.tooltip = Die Endpunkte der Abfrage, in der Reihenfolge des Exports.
model.ehome.zigbee.ZigbeeDevice.functions = Funktionen
model.ehome.zigbee.ZigbeeDevice.functions.tooltip = Die Funktionen, die der Controller aus den Endpunkten ableitet, in der Reihenfolge des Exports.
model.ehome.zigbee.ZigbeeDevice.ieee = IEEE-Adresse
model.ehome.zigbee.ZigbeeDevice.ieee.tooltip = Die IEEE-Adresse: 16 Hexziffern in Kleinbuchstaben; die Identität des Geräts über Importe hinweg.
model.ehome.zigbee.ZigbeeDevice.interviewed = Abgefragt
model.ehome.zigbee.ZigbeeDevice.interviewed.tooltip = Ob die Abfrage des Geräts durch den Controller abgeschlossen ist (seine Endpunkte bekannt sind).
model.ehome.zigbee.ZigbeeDevice.label = Bezeichnung im Controller
model.ehome.zigbee.ZigbeeDevice.label.tooltip = Die Bezeichnung, die der Controller dem Gerät gibt (auf seiner Zigbee-Seite oder mit "zigbee label").
model.ehome.zigbee.ZigbeeDevice.location = Standort
model.ehome.zigbee.ZigbeeDevice.location.tooltip = Der Teil des Gebäudes, in dem das Gerät ist.
model.ehome.zigbee.ZigbeeDevice.manufacturer = Hersteller
model.ehome.zigbee.ZigbeeDevice.manufacturer.tooltip = Der Hersteller, den das Gerät nennt (Basic-Cluster).
model.ehome.zigbee.ZigbeeDevice.model = Modell
model.ehome.zigbee.ZigbeeDevice.model.tooltip = Die Modellkennung, die das Gerät nennt (Basic-Cluster).
model.ehome.zigbee.ZigbeeDevice.name = Name
model.ehome.zigbee.ZigbeeDevice.name.tooltip = Der Name des Geräts im Projekt; der Import setzt ihn einmal (aus der Bezeichnung im Controller, sonst aus Hersteller und Modell), danach ändert ihn der Benutzer.
model.ehome.zigbee.ZigbeeDevice.tooltip = Ein Gerät im Zigbee-Netz eines Controllers, wie es sein Export beschreibt.
model.ehome.zigbee.ZigbeeEndpoint = Endpunkt
model.ehome.zigbee.ZigbeeEndpoint.deviceType = Gerätetyp
model.ehome.zigbee.ZigbeeEndpoint.deviceType.tooltip = Der Gerätetyp des Profils.
model.ehome.zigbee.ZigbeeEndpoint.endpoint = Endpunkt
model.ehome.zigbee.ZigbeeEndpoint.endpoint.tooltip = Die Nummer des Endpunkts (1..240).
model.ehome.zigbee.ZigbeeEndpoint.inputClusters = Server-Cluster
model.ehome.zigbee.ZigbeeEndpoint.inputClusters.tooltip = Die Server-Cluster (Eingangscluster), dezimal, durch Kommas getrennt.
model.ehome.zigbee.ZigbeeEndpoint.outputClusters = Client-Cluster
model.ehome.zigbee.ZigbeeEndpoint.outputClusters.tooltip = Die Client-Cluster (Ausgangscluster), dezimal, durch Kommas getrennt.
model.ehome.zigbee.ZigbeeEndpoint.profile = Profil
model.ehome.zigbee.ZigbeeEndpoint.profile.tooltip = Das Anwendungsprofil (260 Home Automation, 49246 Light Link).
model.ehome.zigbee.ZigbeeEndpoint.tooltip = Ein Endpunkt eines Zigbee-Geräts: sein Simple Descriptor, wie ihn die Abfrage des Controllers gelesen hat.
model.ehome.zigbee.ZigbeeEndpoint.zoneType = Zonentyp
model.ehome.zigbee.ZigbeeEndpoint.zoneType.tooltip = Der Zonentyp eines IAS-Zonen-Endpunkts; leer bei jedem anderen.
model.ehome.zigbee.ZigbeeFunction = Zigbee-Funktion
model.ehome.zigbee.ZigbeeFunction.absent = Nicht mehr exportiert
model.ehome.zigbee.ZigbeeFunction.absent.tooltip = Ob der letzte Export die Funktion nicht mehr enthielt; sie bleibt erhalten, weil ein Datenpunkt an sie gebunden ist.
model.ehome.zigbee.ZigbeeFunction.attribute = Attribut
model.ehome.zigbee.ZigbeeFunction.attribute.tooltip = Das Attribut des Clusters; leer bei den Befehlen eines Client-Clusters (action).
model.ehome.zigbee.ZigbeeFunction.cluster = Cluster
model.ehome.zigbee.ZigbeeFunction.cluster.tooltip = Der Cluster der Funktion (dezimal).
model.ehome.zigbee.ZigbeeFunction.datapoints = Datenpunkt
model.ehome.zigbee.ZigbeeFunction.datapoints.tooltip = Die an die Funktion gebundenen Datenpunkte des Projekts (in einem gültigen Abbild höchstens einer).
model.ehome.zigbee.ZigbeeFunction.displayName = Bezeichnung
model.ehome.zigbee.ZigbeeFunction.displayName.tooltip = Die Bezeichnung, mit der die Funktion aufgeführt wird: der Name des Geräts, der Name der Funktion in der Sprache des Benutzers (ihr Schlüssel, wenn E-Home sie nicht kennt) und der Endpunkt.
model.ehome.zigbee.ZigbeeFunction.endpoint = Endpunkt
model.ehome.zigbee.ZigbeeFunction.endpoint.tooltip = Der Endpunkt, zu dem die Funktion gehört (1..240).
model.ehome.zigbee.ZigbeeFunction.function = Funktion
model.ehome.zigbee.ZigbeeFunction.function.tooltip = Der Schlüssel der Funktionstabelle des Controllers (temperature, occupancy, on_off, action, ...).
model.ehome.zigbee.ZigbeeFunction.genericName = Generischer Name
model.ehome.zigbee.ZigbeeFunction.genericName.tooltip = Der Name, den der Controller dem Datenpunkt der Funktion ohne Bindung gibt (zigbee.<ieee>.<endpoint>.<suffix>).
model.ehome.zigbee.ZigbeeFunction.tooltip = Eine Funktion eines Endpunkts eines Zigbee-Geräts, wie sie die Cluster-Zuordnung des Controllers ableitet: woran ein Datenpunkt des Projekts gebunden werden kann.
model.ehome.zigbee.ZigbeeFunction.unit = Einheit
model.ehome.zigbee.ZigbeeFunction.unit.tooltip = Die Einheit der Werte, wo die Funktion eine hat.
model.ehome.zigbee.ZigbeeFunction.valueType = Werttyp
model.ehome.zigbee.ZigbeeFunction.valueType.tooltip = Der Werttyp, den die Funktion trägt; der Typ eines gebundenen Datenpunkts muss zu ihm passen.
model.ehome.zigbee.ZigbeeFunction.writable = Steuerbar
model.ehome.zigbee.ZigbeeFunction.writable.tooltip = Ob ein gebundener Datenpunkt das Gerät steuern darf.
