# Example: nginx in front of the E-Home of the Debian package (doc/debian.md, doc/controllers.md
# "TLS is operations"). Put it into /etc/nginx/sites-available/, set server_name and the
# certificate, enable it and reload nginx. Tomcat stays on localhost:8080; its context
# (/etc/tomcat10/Catalina/localhost/ehome.xml) trusts the forwarded headers of a proxy on this host.

map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name ehome.example.org;

	ssl_certificate /etc/letsencrypt/live/ehome.example.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/ehome.example.org/privkey.pem;

	client_max_body_size 64m;

	location /ehome/ {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		# The controllers' WebSocket (/ehome/api/controllers/<id>/socket) and the UI's.
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $http_host;
		# The enrollment answer builds the socket URL (wss://) from these.
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-Host $http_host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# Above the controllers' ping interval of 30 s.
		proxy_read_timeout 120s;
		proxy_send_timeout 120s;
	}
}
