# E-Home (package ehome): write access to its data directory for Tomcat 10 (ProtectSystem=strict), from
# Tomcat's next start. A Tomcat that runs already gets the directory bound into its namespace by the
# package (systemctl bind); the package never restarts Tomcat. The settings are not here: they are JNDI
# entries of the app's context descriptor (/etc/tomcat10/Catalina/localhost/ehome.xml).
[Service]
ReadWritePaths=/var/lib/ehome/
