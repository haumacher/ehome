de.haumacher.ehome.knx.WithinGroupRange = Innerhalb des Gruppenbereichs
de.haumacher.ehome.knx.WithinGroupRange.tooltip = Einschränkung, wonach Gruppenadressen und Gruppenbereiche innerhalb des Bereichs des sie enthaltenden Gruppenbereichs liegen müssen und der Anfang eines Bereichs vor dessen Ende liegen muss. <p> Mit den Anmerkungen <code>GroupAddress#address</code>, <code>GroupRange#rangeStart</code> und <code>GroupRange#rangeEnd</code> versehen. Ein Objekt, das (noch) nicht in einem Gruppenbereich enthalten ist, wird nur hinsichtlich der Reihenfolge seiner eigenen Grenzen überprüft. </p>
