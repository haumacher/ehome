de.haumacher.ehome.discover.DiscoverGatewaysAction = Entdecken Sie die „Gateways“-Aktion
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.timeout = Zeitüberschreitung
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.timeout.tooltip = Es dauert nur wenige Sekunden, bis die Antworten vorliegen.
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-multicast = Multicast verwenden
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-multicast.tooltip = Ob die Suchanfrage per Multicast gesendet werden soll.
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-nat = Verwende NAT
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-nat.tooltip = Ob über einen NAT-Router gesucht werden soll.
de.haumacher.ehome.discover.DiscoverGatewaysAction.tooltip = <i>Aktion anzeigen</i>, die die lokalen Netzwerke nach KNXnet/IP-Gateways durchsucht. <p> Als Eingabe wird entweder nichts oder ein Schlüssel-Wert-Paar mit den Sucheinstellungen erwartet: <code>interface</code> (Name der zu durchsuchenden Netzwerkschnittstelle, alle Schnittstellen, wenn leer), <code>local-host</code> (lokale Absenderadresse), <code>use-nat</code> und <code>use-multicast</code>; in dem Schlüssel-Wert-Paar fehlende Einstellungen werden aus der Konfiguration übernommen. Das Ergebnis ist die Liste der Gateways, die geantwortet haben, jeweils ein Schlüsselpaar pro Gateway (ein Gateway, das mehrmals geantwortet hat, wird nur einmal aufgeführt) mit den Schlüsseln <code>name</code>, <code>address</code>, <code>endpoint</code>, <code>mac</code>, <code>serial</code> und <code>medium</code>, die als Zeilen einer Tabelle angezeigt werden sollen. </p>
de.haumacher.ehome.discover.KnxNetworkInterfaces$Builder = Bauunternehmer
de.haumacher.ehome.discover.KnxNetworkInterfaces$Builder.tooltip = Generator für <i>KNX-Netzwerkschnittstellen</i>.
de.haumacher.ehome.etsImport.ImportEtsProjectAction = ETS-Projektaktion importieren
de.haumacher.ehome.etsImport.ImportEtsProjectAction.tooltip = <i>Aktion</i> zum Importieren der hochgeladenen ETS-Projektdateien <i>anzeigen</i> (<code>.knxproj</code>). <p> Als Eingabe dient die hochgeladene Datei oder eine Sammlung solcher Dateien. Jede Datei wird in einer eigenen Transaktion importiert. Das Ergebnis ist das durch den letzten Import erstellte Projekt, sodass eine nachfolgende <code>&lt;write-channel&gt;</code> dieses auswählt. </p>
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat = Format der Aufzählung
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat.Config.default-value = Standardwert
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat.Config.type = Typ
de.haumacher.ehome.importer.DefaultLanguage = Standardsprache
de.haumacher.ehome.importer.DefaultLanguage.Config.contents = Inhalt
de.haumacher.ehome.importer.DefaultLanguage.Config.contents.tooltip = Die Handler, die das Element importieren.
de.haumacher.ehome.importer.DefaultLanguage.Config.xml-attribute = XML-Attribut
de.haumacher.ehome.importer.DefaultLanguage.Config.xml-attribute.tooltip = Das XML-Attribut, das die Sprache angibt.
de.haumacher.ehome.importer.DefaultLanguage.tooltip = Importiert ein Element mit der Sprache, in der seine Texte verfasst sind: das <code>DefaultLanguage</code> des Elements, das dem <i>Import von Internationalisierungs-Eigenschaften</i> in der Variablen <code>"language"</code> zur Verfügung steht.
de.haumacher.ehome.importer.I18NPropertyImport = Import von Internationalisierungs-Eigenschaften
de.haumacher.ehome.importer.I18NPropertyImport.Config.name = Name
de.haumacher.ehome.importer.I18NPropertyImport.Config.name.tooltip = Das zu füllende Modellattribut.
de.haumacher.ehome.importer.I18NPropertyImport.Config.xml-attribute = XML-Attribut
de.haumacher.ehome.importer.I18NPropertyImport.Config.xml-attribute.tooltip = Das XML-Attribut, das den Text enthält.
de.haumacher.ehome.importer.I18NPropertyImport.tooltip = Importiert ein XML-Attribut in ein internationalisiertes Attribut (<code>tl.model.i18n:I18NString</code>) des aktuellen Objekts als Text in der Sprache des Elements (siehe <i>Standardsprache</i>). <p> Ist keine Sprache bekannt, wird der Text unter der Fallback-Sprache der Anwendung abgelegt. Texte in anderen Sprachen stammen aus den Übersetzungen der Datei (siehe <i>Import von Übersetzungen</i>). </p>
de.haumacher.ehome.importer.TranslationsImport = Übersetzungen importieren
de.haumacher.ehome.importer.TranslationsImport$Mapping = Zuordnung
de.haumacher.ehome.importer.TranslationsImport$Mapping.tooltip = Ordnet die Übersetzungen eines XML-Attributs von Objekten eines Modelltyps einem Modellattribut zu.
de.haumacher.ehome.importer.TranslationsImport.Config.mappings = Zuordnungen
de.haumacher.ehome.importer.TranslationsImport.Config.mappings.tooltip = Zu welchem Modellattribut die Übersetzungen eines XML-Attributs je nach Modelltyp zugeordnet werden.
de.haumacher.ehome.importer.TranslationsImport.Mapping.attribute = Attribut
de.haumacher.ehome.importer.TranslationsImport.Mapping.attribute.tooltip = Das internationalisierte Modellattribut, das die Übersetzungen empfängt.
de.haumacher.ehome.importer.TranslationsImport.Mapping.type = Typ
de.haumacher.ehome.importer.TranslationsImport.Mapping.type.tooltip = Der Modelltyp der Objekte (einschließlich ihrer Spezialisierungen).
de.haumacher.ehome.importer.TranslationsImport.Mapping.xml-attribute = XML-Attribut
de.haumacher.ehome.importer.TranslationsImport.Mapping.xml-attribute.tooltip = Das XML-Attribut, dessen Übersetzungen zugeordnet werden.
de.haumacher.ehome.importer.TranslationsImport.tooltip = Importiert den Abschnitt <code>Languages</code> einer ETS-Datei: die Texte der Objekte der Datei in weiteren Sprachen. <pre> &lt;Language Identifier="de-DE"&gt; &lt;TranslationUnit RefId="..."&gt; &lt;TranslationElement RefId="(Objekt-ID)"&gt; &lt;Translation AttributeName="Text" Text="..."/&gt; </pre> <p> Das Objekt wird anhand seiner ID unter den Objekten dieses Imports und den aus früheren Importen bekannten gemeinsamen Objekten gesucht. Die Zuordnungen geben an, in welches Modellattribut ein XML-Attribut eines Objekts eines bestimmten Typs importiert wird; Übersetzungen anderer Attribute werden ignoriert. </p>
de.haumacher.ehome.importer.UnlessKnown = Sofern nicht bekannt
de.haumacher.ehome.importer.UnlessKnown.Config.contents = Inhalt
de.haumacher.ehome.importer.UnlessKnown.Config.contents.tooltip = Die Handler, die das Element importieren, falls dessen Objekt noch nicht bekannt ist.
de.haumacher.ehome.importer.UnlessKnown.Config.id-attribute = ID-Attribut
de.haumacher.ehome.importer.UnlessKnown.Config.id-attribute.tooltip = Das XML-Attribut, das die ID des Elements enthält.
de.haumacher.ehome.importer.UnlessKnown.tooltip = Importiert ein Element nur dann, wenn das Objekt, dessen ID es angibt, noch nicht bekannt ist; andernfalls wird es übersprungen. <p> Wird für Daten verwendet, die sich unter derselben ID nie ändern, wie beispielsweise ein Anwendungsprogramm, dessen ID die Versionsnummer enthält: Ein Import, der das Programm bereits in der Datenbank findet (siehe <i>Importer</i>), überspringt es mitsamt seinem gesamten Inhalt, anstatt es erneut anzulegen. </p>
de.haumacher.ehome.knx.GAControlProvider = GA-Steuerungsanbieter
de.haumacher.ehome.knx.GAControlProvider.tooltip = Eingabesteuerung des Modells vom Typ <code>ehome.logical:GA</code>: Ein Textfeld, das die Gruppenadresse in ihrer Notation anzeigt und die Eingaben des Benutzers in dieser Notation liest. <p> Die Notation entspricht der des aktuellen Werts. Ein Feld ohne Wert übernimmt den Wert aus dem Speicher des Attributs (<code>GroupAddressStorage#getStyle(com.top_logic.model.TLObject)</code>); wenn dort ebenfalls kein Wert vorhanden ist (z. B. bei einer neuen Adresse, die noch nicht zum Projekt hinzugefügt wurde), wird jede Notation akzeptiert. </p>
de.haumacher.ehome.knx.GAStorageMapping = GA-Speicherzuordnung
de.haumacher.ehome.knx.GAStorageMapping.tooltip = Speicherzuordnung des Modelltyps <code>ehome.logical:GA</code>: Die Datenbank speichert die reine Gruppenadressnummer, die Anwendung sieht eine <i>GA</i>. <p> Eine Zuordnung sieht nur den gespeicherten Wert, daher enthält die von ihr erstellte <i>ga</i> keine Kennzeichnung. Das Attribut <i>„Speichergruppenadressenspeicher“</i> fügt die Kennzeichnung des zugehörigen Objekts hinzu. Beim Schreiben werden sowohl eine <i>ga</i> als auch eine reine Nummer akzeptiert, z. B. aus einem Import. </p>
de.haumacher.ehome.knx.GAStyle = GA-Stil
de.haumacher.ehome.knx.GAStyle.style = Stil
de.haumacher.ehome.knx.GAStyle.style.tooltip = Funktion zur Berechnung des <i>Gruppenadressformats</i> anhand des Objekts, auf dem das mit einer Anmerkung versehene Attribut definiert ist.
de.haumacher.ehome.knx.GAStyle.tooltip = Annotation eines Attributs vom Typ <code>ehome.logical:GA</code>, die angibt, in welcher Notation die Adressen seiner Gruppe geschrieben sind. <p> Der Ausdruck erhält das Objekt, auf dem das Attribut definiert ist, und liefert einen Klassifikator von <code>ehome.logical:GroupAddressStyle</code> (oder dessen Namen). Ohne die Annotation oder wenn der Ausdruck nichts liefert, werden Adressen in <code>GroupAddressStyle#DEFAULT</code> geschrieben. </p><pre> &lt;property name="address" type="ehome.logical:GA"&gt; &lt;annotations&gt; &lt;ga-style style="ga -&gt; ..."/&gt; &lt;/annotations&gt; &lt;/property&gt; </pre>
de.haumacher.ehome.knx.GroupAddressStorage = Speicherung von Gruppenadressen
de.haumacher.ehome.knx.GroupAddressStorage.tooltip = Attributspeicherung des Modelltyps <code>ehome.logical:GA</code>. <p> Speichert die reine Gruppenadressnummer wie jedes primitive Attribut und fügt beim Auslesen die Notation des zugehörigen Objekts an die <i>GA</i> an: den <i>GA-Ausdruck</i> des <i>Attributs, der</i> auf diesem Objekt ausgewertet wird. Die Speicherung ist auf dem Typ deklariert, sodass jedes Attribut des Typs sie nutzt, ohne etwas deklarieren zu müssen. </p>
de.haumacher.ehome.knx.GroupAddressStyle = Formatierung von Gruppenadressen
de.haumacher.ehome.knx.GroupAddressStyle.Free = Kostenlos
de.haumacher.ehome.knx.GroupAddressStyle.Free.tooltip = Die reine 16-Bit-Zahl.
de.haumacher.ehome.knx.GroupAddressStyle.ThreeLevel = Drei Ebenen
de.haumacher.ehome.knx.GroupAddressStyle.ThreeLevel.tooltip = Hauptgruppe, Mittelgruppe und Untergruppe: <code>main/middle/sub</code> mit 5, 3 und 8 Bits.
de.haumacher.ehome.knx.GroupAddressStyle.TwoLevel = Zweistöckig
de.haumacher.ehome.knx.GroupAddressStyle.TwoLevel.tooltip = Hauptgruppe und Untergruppe: <code>main/sub</code> mit 5 und 11 Bits.
de.haumacher.ehome.knx.GroupAddressStyle.tooltip = Schreibweise einer KNX-Gruppenadresse. <p> Eine Gruppenadresse ist ein 16-Bit-Wert. In der ETS kann für ein Projekt festgelegt werden, wie dieser Wert geschrieben wird; die Namen der Konstanten entsprechen den Literalen, die die ETS für <code>ProjectInformation@GroupAddressStyle</code> verwendet, und den Namen der Klassifikatoren für <code>ehome.logical:GroupAddressStyle</code>. </p>
