de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-nat = Verwende NAT
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-nat.tooltip = Ob über einen NAT-Router gesucht werden soll.
de.haumacher.ehome.discover.DiscoverGatewaysAction.tooltip = <i>Aktion anzeigen</i>, die die lokalen Netzwerke nach KNXnet/IP-Gateways durchsucht. <p> Als Eingabe wird entweder nichts oder ein Schlüssel-Wert-Paar mit den Sucheinstellungen erwartet: <code>interface</code> (Name der zu durchsuchenden Netzwerkschnittstelle, alle Schnittstellen, wenn leer), <code>local-host</code> (lokale Absenderadresse), <code>use-nat</code> und <code>use-multicast</code>; in dem Schlüssel-Wert-Paar fehlende Einstellungen werden aus der Konfiguration übernommen. Das Ergebnis ist die Liste der Gateways, die geantwortet haben, jeweils ein Schlüsselpaar pro Gateway (ein Gateway, das mehrmals geantwortet hat, wird nur einmal aufgeführt) mit den Schlüsseln <code>name</code>, <code>address</code>, <code>endpoint</code>, <code>mac</code>, <code>serial</code> und <code>medium</code>, die als Zeilen einer Tabelle angezeigt werden sollen. </p>
de.haumacher.ehome.discover.KnxNetworkInterfaces$Builder = Erzeuger
de.haumacher.ehome.discover.KnxNetworkInterfaces$Builder.tooltip = Generator für <i>KNX-Netzwerkschnittstellen</i>.
de.haumacher.ehome.etsImport.ImportEtsProjectAction = ETS-Projektaktion importieren
de.haumacher.ehome.etsImport.ImportEtsProjectAction.tooltip = <i>Aktion</i> zum Importieren der hochgeladenen ETS-Projektdateien (<code>.knxproj</code>). <p> Als Eingabe dient die hochgeladene Datei oder eine Sammlung solcher Dateien. Jede Datei wird in einer eigenen Transaktion importiert. Das Ergebnis ist der Bericht des Imports, ein Schlüssel-Wert-Paar: <code>project</code> ist das durch den letzten Import erstellte Projekt (für ein nachfolgendes <code>&lt;write-channel&gt;</code>), <code>messages</code> die Warnungen und Fehler, die der Import gemeldet hat (jeweils ein Schlüssel-Wert-Paar mit <code>file</code>, <code>severity</code>, <code>level</code> und <code>message</code>), und <code>summary</code> ein Satz, der die importierten Projekte und die Anzahl der Meldungen nennt. Die Meldungen ändern das Ergebnis nicht: Eine Datei, die nicht importiert werden kann, lässt die Aktion fehlschlagen. </p>
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat = Format der Aufzählung
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat.Config.default-value = Standardwert
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat.Config.type = Typ
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat.tooltip = Format zum Auslesen eines Klassifikators einer Aufzählung anhand seines Namens. <p> Ein Wert, der kein Bezeichner ist, wird ausschließlich anhand seiner Buchstaben, Ziffern und Unterstriche abgeglichen, sodass der Klassifikator <code>DPT9</code> den ETS-Wert <code>DPT 9</code> ausliest. </p>
de.haumacher.ehome.etsImport.importer.format.TLEnumerationSetFormat = Format der Aufzählungsmenge
de.haumacher.ehome.etsImport.importer.format.TLEnumerationSetFormat.Config.type = Typ
de.haumacher.ehome.etsImport.importer.format.TLEnumerationSetFormat.Config.type.tooltip = Der qualifizierte Name der Aufzählung.
de.haumacher.ehome.etsImport.importer.format.TLEnumerationSetFormat.tooltip = Format zum Einlesen einer Liste von Klassifikatoren einer Aufzählung anhand ihrer durch Leerzeichen getrennten Namen (eine XML-Schema-Liste, z. B. <code>remote local1</code>) für eine Mehrfachreferenz auf eine Aufzählung.
