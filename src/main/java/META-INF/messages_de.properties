de.haumacher.ehome.importer.TranslationsImport.Config.mappings.tooltip = Zu welchem Modellattribut die Übersetzungen eines XML-Attributs je nach Modelltyp zugeordnet werden.
de.haumacher.ehome.importer.TranslationsImport.Mapping.attribute = Attribut
de.haumacher.ehome.importer.TranslationsImport.Mapping.attribute.tooltip = Das internationalisierte Modellattribut, das die Übersetzungen empfängt.
de.haumacher.ehome.importer.TranslationsImport.Mapping.type = Typ
de.haumacher.ehome.importer.TranslationsImport.Mapping.type.tooltip = Der Modelltyp der Objekte (einschließlich ihrer Spezialisierungen).
de.haumacher.ehome.importer.TranslationsImport.Mapping.xml-attribute = XML-Attribut
de.haumacher.ehome.importer.TranslationsImport.Mapping.xml-attribute.tooltip = Das XML-Attribut, dessen Übersetzungen zugeordnet werden.
de.haumacher.ehome.importer.TranslationsImport.tooltip = Importiert den Abschnitt <code>Languages</code> einer ETS-Datei: die Texte der Objekte der Datei in weiteren Sprachen. <pre> &lt;Language Identifier="de-DE"&gt; &lt;TranslationUnit RefId="..."&gt; &lt;TranslationElement RefId="(Objekt-ID)"&gt; &lt;Translation AttributeName="Text" Text="..."/&gt; </pre> <p> Das Objekt wird anhand seiner ID unter den Objekten dieses Imports und den aus früheren Importen bekannten gemeinsamen Objekten gesucht. Die Zuordnungen geben an, in welches Modellattribut ein XML-Attribut eines Objekts eines bestimmten Typs importiert wird; Übersetzungen anderer Attribute werden ignoriert. </p>
de.haumacher.ehome.importer.TypedValueImport = Import von typisierten Werten
de.haumacher.ehome.importer.TypedValueImport.Config.xml-attribute = XML-Attribut
de.haumacher.ehome.importer.TypedValueImport.Config.xml-attribute.tooltip = Das XML-Attribut, das den Wert enthält.
de.haumacher.ehome.importer.TypedValueImport.tooltip = Importiert einen Parameterwert, wie er von ETS in den typisierten Wert des aktuellen Objekts (ein Parameter, eine Parameterreferenz oder eine Parametereinstellung) geschrieben wird, und dekodiert ihn entsprechend dem Parametertyp des Objekts, siehe <code>ParameterValues#decode(TLObject, String)</code>. <p> Der Typ wird aus den Referenzen des Objekts gelesen; daher müssen diese importiert sein, bevor dieser Handler ausgeführt wird. ETS-Dateien definieren die Parametertypen vor den Parametern und die Programme vor den Projekten, die diese verwenden, sodass die Referenzen zu diesem Zeitpunkt aufgelöst sind. Ein Wert, dessen Typ nicht dekodiert werden kann, wird als Text beibehalten und als Warnung unter Angabe des Parameters und seiner Position gemeldet (siehe <code>Importer#getMessages()</code>). </p>
de.haumacher.ehome.importer.UnlessKnown = Sofern nicht bekannt
de.haumacher.ehome.importer.UnlessKnown.Config.contents = Inhalt
de.haumacher.ehome.importer.UnlessKnown.Config.contents.tooltip = Die Handler, die das Element importieren, falls dessen Objekt noch nicht bekannt ist.
de.haumacher.ehome.importer.UnlessKnown.Config.id-attribute = ID-Attribut
de.haumacher.ehome.importer.UnlessKnown.Config.id-attribute.tooltip = Das XML-Attribut, das die ID des Elements enthält.
de.haumacher.ehome.importer.UnlessKnown.tooltip = Importiert ein Element nur dann, wenn das Objekt, dessen ID es angibt, noch nicht bekannt ist; andernfalls wird es übersprungen. <p> Wird für Daten verwendet, die sich unter derselben ID nie ändern, wie beispielsweise ein Anwendungsprogramm, dessen ID die Versionsnummer enthält: Ein Import, der das Programm bereits in der Datenbank findet (siehe <i>Importer</i>), überspringt es mitsamt seinem gesamten Inhalt, anstatt es erneut anzulegen. </p>
