de.haumacher.ehome.importer.TranslationsImport$Mapping = Zuordnung
de.haumacher.ehome.importer.TranslationsImport$Mapping.tooltip = Ordnet die Übersetzungen eines XML-Attributs von Objekten eines Modelltyps einem Modellattribut zu.
