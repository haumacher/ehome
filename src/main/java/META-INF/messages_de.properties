de.haumacher.ehome.discover.DiscoverGatewaysAction.tooltip = <i>Aktion anzeigen</i>, die die lokalen Netzwerke nach KNXnet/IP-Gateways durchsucht. <p> Als Eingabe wird entweder nichts oder ein Map mit den Sucheinstellungen erwartet: <code>interface</code> (Name der zu durchsuchenden Netzwerkschnittstelle, alle Schnittstellen, wenn leer), <code>local-host</code> (lokale Absenderadresse), <code>use-nat</code> und <code>use-multicast</code>; in dem Map fehlende Einstellungen werden aus der Konfiguration übernommen. Das Ergebnis ist die Liste der Gateways, die geantwortet haben, jeweils ein Schlüsselpaar pro Gateway mit den Schlüsseln <code>name</code>, <code>address</code>, <code>endpoint</code>, <code>mac</code>, <code>serial</code> und <code>medium</code>, die als Zeilen einer Tabelle angezeigt werden sollen. </p>
