de.haumacher.ehome.knx.GroupAddressStyle.tooltip = Schreibweise einer KNX-Gruppenadresse. <p> Eine Gruppenadresse ist ein 16-Bit-Wert. In der ETS kann für ein Projekt festgelegt werden, wie dieser Wert geschrieben wird; die Namen der Konstanten entsprechen den Literalen, die die ETS für <code>ProjectInformation@GroupAddressStyle</code> verwendet, und den Namen der Klassifikatoren für <code>ehome.logical:GroupAddressStyle</code>. </p>
