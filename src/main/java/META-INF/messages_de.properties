de.haumacher.ehome.knx.GAControlProvider = GA-Steuerungsanbieter
de.haumacher.ehome.knx.GAControlProvider.tooltip = Eingabesteuerung des Modells vom Typ <code>ehome.logical:GA</code>: Ein Textfeld, das die Gruppenadresse in ihrer Notation anzeigt und die Eingaben des Benutzers in dieser Notation liest. <p> Die Notation entspricht der des aktuellen Werts. Ein Feld ohne Wert übernimmt den Wert aus dem Speicher des Attributs (<code>GroupAddressStorage#getStyle(com.top_logic.model.TLObject)</code>); wenn dort ebenfalls kein Wert vorhanden ist (z. B. bei einer neuen Adresse, die noch nicht zum Projekt hinzugefügt wurde), wird jede Notation akzeptiert. </p>
de.haumacher.ehome.knx.GAStorageMapping = GA-Speicherzuordnung
de.haumacher.ehome.knx.GAStorageMapping.tooltip = Speicherzuordnung des Modelltyps <code>ehome.logical:GA</code>: Die Datenbank speichert die reine Gruppenadressnummer, die Anwendung sieht eine <i>GA</i>. <p> Eine Zuordnung sieht nur den gespeicherten Wert, daher enthält die von ihr erstellte <i>ga</i> keine Kennzeichnung. Das Attribut <i>„Speichergruppenadressenspeicher“</i> fügt die Kennzeichnung des zugehörigen Objekts hinzu. Beim Schreiben werden sowohl eine <i>ga</i> als auch eine reine Nummer akzeptiert, z. B. aus einem Import. </p>
de.haumacher.ehome.knx.GAStyle = GA-Stil
de.haumacher.ehome.knx.GAStyle.style = Stil
de.haumacher.ehome.knx.GAStyle.style.tooltip = Funktion zur Berechnung des <i>Gruppenadressformats</i> anhand des Objekts, auf dem das mit einer Anmerkung versehene Attribut definiert ist.
de.haumacher.ehome.knx.GAStyle.tooltip = Annotation eines Attributs vom Typ <code>ehome.logical:GA</code>, die angibt, in welcher Notation die Adressen seiner Gruppe geschrieben sind. <p> Der Ausdruck erhält das Objekt, auf dem das Attribut definiert ist, und liefert einen Klassifikator von <code>ehome.logical:GroupAddressStyle</code> (oder dessen Namen). Ohne die Annotation oder wenn der Ausdruck nichts liefert, werden Adressen in <code>GroupAddressStyle#DEFAULT</code> geschrieben. </p><pre> &lt;property name="address" type="ehome.logical:GA"&gt; &lt;annotations&gt; &lt;ga-style style="ga -&gt; ..."/&gt; &lt;/annotations&gt; &lt;/property&gt; </pre>
de.haumacher.ehome.knx.GroupAddressStorage = Speicherung von Gruppenadressen
de.haumacher.ehome.knx.GroupAddressStorage.tooltip = Attributspeicherung des Modelltyps <code>ehome.logical:GA</code>. <p> Speichert die reine Gruppenadressnummer wie jedes primitive Attribut und fügt beim Auslesen die Notation des zugehörigen Objekts an die <i>GA</i> an: den <i>GA-Ausdruck</i> des <i>Attributs, der</i> auf diesem Objekt ausgewertet wird. Die Speicherung ist auf dem Typ deklariert, sodass jedes Attribut des Typs sie nutzt, ohne etwas deklarieren zu müssen. </p>
de.haumacher.ehome.knx.GroupAddressStyle = Formatierung von Gruppenadressen
