de.haumacher.ehome.monitor.ConnectMonitorAction.tooltip = <i>Aktion anzeigen</i>, bei der der Gruppenmonitor eines Projekts über das Gateway (<code>ehome.project:Project#gateway</code>) des Projekts an den Bus angeschlossen wird, sowie die Ansicht des Monitors. <p> Die Eingabe ist das Projekt. Der Monitor ist derjenige des Projekts in der Sitzung (<i>Monitor-Sitzungen</i>); ein bereits verbundener Monitor wird nicht erneut verbunden. Von nun an schreibt jeder Monitor bei jeder Änderung eine <code>GroupMonitor#snapshot()</code> in den konfigurierten Kanal (<i>Window Publisher</i>); das Ergebnis ist der aktuelle Snapshot. </p>
