de.haumacher.ehome.view.ScriptLabelControlProvider = Anbieter für Skript-Label-Steuerelemente
de.haumacher.ehome.view.ScriptLabelControlProvider.Config.css-class = CSS-Klasse
de.haumacher.ehome.view.ScriptLabelControlProvider.Config.css-class.tooltip = Funktion, die anhand des Objekts eines Knotens dessen CSS-Klasse ermittelt; <code>null</code>, wenn keine vorhanden ist.
de.haumacher.ehome.view.ScriptLabelControlProvider.Config.label = Bezeichnung
de.haumacher.ehome.view.ScriptLabelControlProvider.Config.label.tooltip = Funktion, die die Beschriftung eines Knotens anhand seines Objekts berechnet; <code>null</code> für die eigene Beschriftung des Objekts. Nicht festgelegt: Jeder Knoten zeigt die Beschriftung seines Objekts an.
de.haumacher.ehome.view.ScriptLabelControlProvider.tooltip = Anzeige eines Knotens mit dem Wert <code>&lt;tree&gt;</code> (bzw. <code>nodeContent</code>) mit einer Beschriftung und einer CSS-Klasse, die durch TL-Script-Funktionen berechnet werden, für einen Baum, dessen Knoten eine andere Beschriftung benötigen als die, die ihre Objekte an allen anderen Stellen haben, oder eine Markierung. <p> Der Knoten zeigt das Symbol seines Objekts und die Bezeichnung an, die die Funktion aus dem Objekt berechnet; wenn die Funktion nichts liefert, wird die eigene Bezeichnung des Objekts angezeigt. Wie bei der Standardanzeige von Knoten ist der Knoten kein Link: Ein Klick markiert ihn. Die Werte der in <code>inputs</code> genannten Kanäle sind die ersten Argumente beider Funktionen, das Objekt ist das letzte. </p><pre> &lt;nodeContent class="de.haumacher.ehome.view.ScriptLabelControlProvider" label="x -&gt; if($x.instanceOf(`ehome.physical:Connection`), connectionLabel($x), null)"/&gt; &lt;nodeContent class="de.haumacher.ehome.view.ScriptLabelControlProvider" inputs="device" css-class="d -&gt; x -&gt; if(deviceChanged($d, $x), 'ehomeChanged', null)"/&gt; </pre> <p> Die Beschriftung und die Klasse werden bei der Anzeige des Knotens sowie bei jeder Änderung seines Objekts berechnet; eine von anderen Objekten abhängige Markierung erfordert einen Baum, der bei einer Änderung neu aufgebaut wird (ein Eingang des Baums, der sich mit der Markierung ändert). </p>
