de.haumacher.ehome.programming.download.CompareJob = Vergleichsauftrag
de.haumacher.ehome.programming.download.CompareJob.tooltip = Die Funktion des Befehls „compare“ für ein Gerät (<code>&lt;start-job&gt;</code> Body): Liest das Gerät über das Gateway des Projekts mit <i>dem Calimero-Lesegerät</i> aus (es wird nichts geschrieben) und vergleicht es mit dem Download-Image (<i>Gerätevergleich</i>). <p> Das Gerät ist das erste Objekt, mit dem der Auftrag gestartet wird (die Eingabe <code>device</code> ). Das Ergebnis ist ein <i>Programmierbericht</i>: die ausgelesenen Daten sowie pro Block des Images die „identischen“ oder abweichenden Adressen. </p>
de.haumacher.ehome.programming.download.DownloadJob = Download-Auftrag
de.haumacher.ehome.programming.download.DownloadJob.Config.kind = Art
de.haumacher.ehome.programming.download.DownloadJob.Config.kind.tooltip = Was der Download schreibt.
de.haumacher.ehome.programming.download.DownloadJob.tooltip = Die Funktionsweise des Download-Befehls eines Geräts (<code>&lt;start-job&gt;</code> body): plant den Download, stellt über <i>Calimero Writer</i> eine Verbindung zum Gateway des Projekts her, führt den Plan mit Fortschrittsanzeige pro Vorgang aus und speichert ihn bei Erfolg auf dem Gerät. <p> Das Gerät ist das erste Objekt, mit dem der Auftrag gestartet wird (die Eingabe <code>device</code> ). Das Ergebnis ist ein <i>Programmierbericht</i>. Eine Ablehnung (Schreiben deaktiviert, kein Gateway, ein Plan mit Problemen, keine Verbindung) führt zum Fehlschlagen des Auftrags mit Angabe des Grundes; ein Fehler des Geräts ist das Ergebnis des Berichts. </p>
