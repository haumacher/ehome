de.haumacher.ehome.etsImport.ImportEtsProjectAction = Import ets project action
de.haumacher.ehome.etsImport.ImportEtsProjectAction.tooltip = <i>View action</i> importing the uploaded ETS project files (<code>.knxproj</code>). <p> The input is the uploaded file, or a collection of them. Each file is imported in a transaction of its own. The result is the project created by the last import, so that a following <code>&lt;write-channel&gt;</code> selects it. </p>
