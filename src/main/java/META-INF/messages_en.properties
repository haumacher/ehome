de.haumacher.ehome.programming.download.CompareJob = Compare job
de.haumacher.ehome.programming.download.CompareJob.tooltip = The work of the compare command of a device (<code>&lt;start-job&gt;</code> body): reads the device through the project's gateway with <i>calimero reader</i> (nothing is written) and compares it with the download image (<i>device comparison</i>). <p> The device is the first object the job is started with (the <code>device</code> input). The result is a <i>programming report</i>: the facts read, and per block of the image "identical" or the differing addresses. </p>
de.haumacher.ehome.programming.download.DownloadJob = Download job
de.haumacher.ehome.programming.download.DownloadJob.Config.kind = Kind
de.haumacher.ehome.programming.download.DownloadJob.Config.kind.tooltip = What the download writes.
de.haumacher.ehome.programming.download.DownloadJob.tooltip = The work of the download command of a device (<code>&lt;start-job&gt;</code> body): plans the download, connects to the project's gateway through <i>calimero writer</i>, performs the plan with progress per operation, and records it at the device on success. <p> The device is the first object the job is started with (the <code>device</code> input). The result is a <i>programming report</i>. A refusal (writing switched off, no gateway, a plan with problems, no connection) fails the job with its reason; a failure of the device is the report's outcome. </p>
