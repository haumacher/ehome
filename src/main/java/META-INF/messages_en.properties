de.haumacher.ehome.importer.I18NPropertyImport.tooltip = Imports an XML attribute into an internationalized attribute (<code>tl.model.i18n:I18NString</code>) of the current object, as the text of the element's language (see <i>default language</i>). <p> Without a known language, the text is filed under the application's fallback language. Texts of other languages come from the translations of the file (see <i>translations import</i>). </p>
