de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-nat.tooltip = Whether to search through a NAT router.
de.haumacher.ehome.discover.DiscoverGatewaysAction.tooltip = <i>View action</i> searching the local networks for KNXnet/IP gateways. <p> The input is either nothing or a map with the search settings: <code>interface</code> (name of the network interface to search on, all interfaces if empty), <code>local-host</code> (local address to send from), <code>use-nat</code> and <code>use-multicast</code>; settings missing in the map are taken from the configuration. The result is the list of gateways that answered, one map per gateway (a gateway that answered several times is listed once) with the keys <code>name</code>, <code>address</code>, <code>endpoint</code>, <code>mac</code>, <code>serial</code> and <code>medium</code>, to be displayed as rows of a table. </p>
de.haumacher.ehome.discover.KnxNetworkInterfaces$Builder = Builder
de.haumacher.ehome.discover.KnxNetworkInterfaces$Builder.tooltip = Builder for <i>knx network interfaces</i>.
de.haumacher.ehome.etsImport.ImportEtsProjectAction = Import ets project action
de.haumacher.ehome.etsImport.ImportEtsProjectAction.tooltip = <i>View action</i> importing the uploaded ETS project files (<code>.knxproj</code>). <p> The input is the uploaded file, or a collection of them. Each file is imported in a transaction of its own. The result is the report of the import, a dictionary: <code>project</code> is the project created by the last import (for a following <code>&lt;write-channel&gt;</code>), <code>messages</code> the warnings and errors the import reported (each a dictionary with <code>file</code>, <code>severity</code>, <code>level</code> and <code>message</code>), and <code>summary</code> a sentence naming the imported projects and the number of messages. The messages do not change the outcome: a file that cannot be imported fails the action. </p>
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat = Enumeration format
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat.Config.default-value = Default value
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat.Config.type = Type
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat.tooltip = Format reading a classifier of an enumeration by its name. <p> A value that is no identifier is matched with its letters, digits and underscores only, so that the classifier <code>DPT9</code> reads the ETS value <code>DPT 9</code>. </p>
de.haumacher.ehome.etsImport.importer.format.TLEnumerationSetFormat = Enumeration set format
de.haumacher.ehome.etsImport.importer.format.TLEnumerationSetFormat.Config.type = Type
de.haumacher.ehome.etsImport.importer.format.TLEnumerationSetFormat.Config.type.tooltip = The qualified name of the enumeration.
de.haumacher.ehome.etsImport.importer.format.TLEnumerationSetFormat.tooltip = Format reading a list of classifiers of an enumeration from their names separated by spaces (an XML Schema list, e.g. <code>remote local1</code>), for a multiple reference to an enumeration.
de.haumacher.ehome.exporter.ExportKnxprojAction = Export knxproj action
de.haumacher.ehome.exporter.ExportKnxprojAction.tooltip = <i>View action</i> exporting the input project (<code>ehome.project:Project</code>) as an ETS project archive with <i>knxproj exporter</i>. <p> The result is the archive as binary data named after the project (<code>&lt;name&gt;.knxproj</code>), for a dialog offering it for download. The archive is not signed, so ETS does not import it. </p>
