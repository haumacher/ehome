de.haumacher.ehome.discover.DiscoverGatewaysAction.tooltip = <i>View action</i> searching the local networks for KNXnet/IP gateways. <p> The input is either nothing or a map with the search settings: <code>interface</code> (name of the network interface to search on, all interfaces if empty), <code>local-host</code> (local address to send from), <code>use-nat</code> and <code>use-multicast</code>; settings missing in the map are taken from the configuration. The result is the list of gateways that answered, one map per gateway with the keys <code>name</code>, <code>address</code>, <code>endpoint</code>, <code>mac</code>, <code>serial</code> and <code>medium</code>, to be displayed as rows of a table. </p>
