de.haumacher.ehome.discover.DiscoverGatewaysAction = Discover gateways action
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.timeout = Timeout
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.timeout.tooltip = Seconds to wait for answers.
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-multicast = Use multicast
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-multicast.tooltip = Whether to send the search request by multicast.
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-nat = Use nat
de.haumacher.ehome.discover.DiscoverGatewaysAction.Config.use-nat.tooltip = Whether to search through a NAT router.
de.haumacher.ehome.discover.DiscoverGatewaysAction.tooltip = <i>View action</i> searching the local networks for KNXnet/IP gateways. <p> The input is either nothing or a map with the search settings: <code>interface</code> (name of the network interface to search on, all interfaces if empty), <code>local-host</code> (local address to send from), <code>use-nat</code> and <code>use-multicast</code>; settings missing in the map are taken from the configuration. The result is the list of gateways that answered, one map per gateway (a gateway that answered several times is listed once) with the keys <code>name</code>, <code>address</code>, <code>endpoint</code>, <code>mac</code>, <code>serial</code> and <code>medium</code>, to be displayed as rows of a table. </p>
de.haumacher.ehome.discover.KnxNetworkInterfaces$Builder = Builder
de.haumacher.ehome.discover.KnxNetworkInterfaces$Builder.tooltip = Builder for <i>knx network interfaces</i>.
de.haumacher.ehome.etsImport.ImportEtsProjectAction = Import ets project action
de.haumacher.ehome.etsImport.ImportEtsProjectAction.tooltip = <i>View action</i> importing the uploaded ETS project files (<code>.knxproj</code>). <p> The input is the uploaded file, or a collection of them. Each file is imported in a transaction of its own. The result is the project created by the last import, so that a following <code>&lt;write-channel&gt;</code> selects it. </p>
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat = Enumeration format
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat.Config.default-value = Default value
de.haumacher.ehome.etsImport.importer.format.TLEnumerationFormat.Config.type = Type
de.haumacher.ehome.importer.DefaultLanguage = Default language
de.haumacher.ehome.importer.DefaultLanguage.Config.contents = Contents
de.haumacher.ehome.importer.DefaultLanguage.Config.contents.tooltip = The handlers importing the element.
de.haumacher.ehome.importer.DefaultLanguage.Config.xml-attribute = XML attribute
de.haumacher.ehome.importer.DefaultLanguage.Config.xml-attribute.tooltip = The XML attribute naming the language.
de.haumacher.ehome.importer.DefaultLanguage.tooltip = Imports an element with the language its texts are written in: the element's <code>DefaultLanguage</code>, made available to <i>internationalization property import</i> in the variable <code>"language"</code>.
de.haumacher.ehome.importer.I18NPropertyImport = Internationalization property import
de.haumacher.ehome.importer.I18NPropertyImport.Config.name = Name
de.haumacher.ehome.importer.I18NPropertyImport.Config.name.tooltip = The model attribute to fill.
de.haumacher.ehome.importer.I18NPropertyImport.Config.xml-attribute = XML attribute
de.haumacher.ehome.importer.I18NPropertyImport.Config.xml-attribute.tooltip = The XML attribute holding the text.
de.haumacher.ehome.importer.I18NPropertyImport.tooltip = Imports an XML attribute into an internationalized attribute (<code>tl.model.i18n:I18NString</code>) of the current object, as the text of the element's language (see <i>default language</i>). <p> Without a known language, the text is filed under the application's fallback language. Texts of other languages come from the translations of the file (see <i>translations import</i>). </p>
de.haumacher.ehome.importer.TranslationsImport = Translations import
de.haumacher.ehome.importer.TranslationsImport$Mapping = Mapping
de.haumacher.ehome.importer.TranslationsImport$Mapping.tooltip = Maps the translations of an XML attribute of objects of a model type to a model attribute.
de.haumacher.ehome.importer.TranslationsImport.Config.mappings = Mappings
de.haumacher.ehome.importer.TranslationsImport.Config.mappings.tooltip = Which model attribute the translations of an XML attribute go to, per model type.
de.haumacher.ehome.importer.TranslationsImport.Mapping.attribute = Attribute
de.haumacher.ehome.importer.TranslationsImport.Mapping.attribute.tooltip = The internationalized model attribute receiving the translations.
de.haumacher.ehome.importer.TranslationsImport.Mapping.type = Type
de.haumacher.ehome.importer.TranslationsImport.Mapping.type.tooltip = The model type of the objects (including its specializations).
de.haumacher.ehome.importer.TranslationsImport.Mapping.xml-attribute = XML attribute
de.haumacher.ehome.importer.TranslationsImport.Mapping.xml-attribute.tooltip = The XML attribute whose translations are mapped.
de.haumacher.ehome.importer.TranslationsImport.tooltip = Imports the <code>Languages</code> section of an ETS file: the texts of the file's objects in further languages. <pre> &lt;Language Identifier="de-DE"&gt; &lt;TranslationUnit RefId="..."&gt; &lt;TranslationElement RefId="(object ID)"&gt; &lt;Translation AttributeName="Text" Text="..."/&gt; </pre> <p> The object is looked up by its ID among the objects of this import and the shared objects known from earlier imports. The mappings say which model attribute an XML attribute of an object of a given type is imported into; translations of other attributes are ignored. </p>
de.haumacher.ehome.importer.UnlessKnown = Unless known
de.haumacher.ehome.importer.UnlessKnown.Config.contents = Contents
de.haumacher.ehome.importer.UnlessKnown.Config.contents.tooltip = The handlers importing the element if its object is not known yet.
de.haumacher.ehome.importer.UnlessKnown.Config.id-attribute = ID attribute
de.haumacher.ehome.importer.UnlessKnown.Config.id-attribute.tooltip = The XML attribute holding the ID of the element.
de.haumacher.ehome.importer.UnlessKnown.tooltip = Imports an element only if the object its ID names is not known yet, and skips it otherwise. <p> Used for data that never changes under the same ID, such as an application program, whose ID includes its version: an import that finds the program already in the database (see <i>importer</i>) skips it with all its content instead of creating it again. </p>
de.haumacher.ehome.knx.GAControlProvider = GA control provider
de.haumacher.ehome.knx.GAControlProvider.tooltip = Input control of the model type <code>ehome.logical:GA</code>: a text field showing the group address in its notation and reading what the user types in that notation. <p> The notation is the one of the current value. A field without a value takes it from the attribute's storage (<code>GroupAddressStorage#getStyle(com.top_logic.model.TLObject)</code>); if that yields none either (e.g. a new address not yet added to its project), every notation is accepted. </p>
de.haumacher.ehome.knx.GAStorageMapping = GA storage mapping
de.haumacher.ehome.knx.GAStorageMapping.tooltip = Storage mapping of the model type <code>ehome.logical:GA</code>: the database keeps the plain group address number, the application sees a <i>ga</i>. <p> A mapping only sees the stored value, so the <i>ga</i> it creates carries no notation. The attribute storage <i>group address storage</i> adds the notation of the owning object. Writing accepts a <i>ga</i> as well as a plain number, e.g. from an import. </p>
de.haumacher.ehome.knx.GAStyle = GA style
de.haumacher.ehome.knx.GAStyle.style = Style
de.haumacher.ehome.knx.GAStyle.style.tooltip = Function computing the <i>group address style</i> from the object the annotated attribute is defined on.
de.haumacher.ehome.knx.GAStyle.tooltip = Annotation of an attribute of type <code>ehome.logical:GA</code> stating the notation its group addresses are written in. <p> The expression receives the object the attribute is defined on and yields a classifier of <code>ehome.logical:GroupAddressStyle</code> (or its name). Without the annotation, or when the expression yields nothing, addresses are written in <code>GroupAddressStyle#DEFAULT</code>. </p> <pre> &lt;property name="address" type="ehome.logical:GA"&gt; &lt;annotations&gt; &lt;ga-style style="ga -&gt; ..."/&gt; &lt;/annotations&gt; &lt;/property&gt; </pre>
de.haumacher.ehome.knx.GroupAddressStorage = Group address storage
de.haumacher.ehome.knx.GroupAddressStorage.tooltip = Attribute storage of the model type <code>ehome.logical:GA</code>. <p> Stores the plain group address number like any primitive attribute and, when reading, attaches the notation of the owning object to the <i>ga</i>: the attribute's <i>GA style</i> expression evaluated on that object. The storage is declared on the type, so every attribute of the type uses it without declaring anything. </p>
de.haumacher.ehome.knx.GroupAddressStyle = Group address style
de.haumacher.ehome.knx.GroupAddressStyle.Free = Free
de.haumacher.ehome.knx.GroupAddressStyle.Free.tooltip = The plain 16-bit number.
de.haumacher.ehome.knx.GroupAddressStyle.ThreeLevel = Three level
de.haumacher.ehome.knx.GroupAddressStyle.ThreeLevel.tooltip = Main group, middle group and sub group: <code>main/middle/sub</code> with 5, 3 and 8 bits.
de.haumacher.ehome.knx.GroupAddressStyle.TwoLevel = Two level
de.haumacher.ehome.knx.GroupAddressStyle.TwoLevel.tooltip = Main group and sub group: <code>main/sub</code> with 5 and 11 bits.
de.haumacher.ehome.knx.GroupAddressStyle.tooltip = Notation of a KNX group address. <p> A group address is a 16-bit value. ETS lets a project choose how it is written; the names of the constants are the literals ETS uses in <code>ProjectInformation@GroupAddressStyle</code> and the names of the classifiers of <code>ehome.logical:GroupAddressStyle</code>. </p>
